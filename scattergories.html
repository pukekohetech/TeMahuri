<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scattergories Classroom</title>
  <style>
    :root{
      --bg1:#14142b;
      --bg2:#261447;
      --bg3:#073b4c;
      --card:rgba(255,255,255,.12);
      --card2:rgba(255,255,255,.18);
      --text:#ffffff;
      --muted:#d9ddff;
      --accent:#ffd166;
      --accent2:#06d6a0;
      --danger:#ef476f;
      --blue:#118ab2;
      --shadow: 0 18px 40px rgba(0,0,0,.35);
      --radius:18px;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(255,209,102,.25), transparent 25%),
        radial-gradient(circle at 85% 20%, rgba(6,214,160,.22), transparent 28%),
        radial-gradient(circle at 50% 95%, rgba(239,71,111,.2), transparent 30%),
        linear-gradient(135deg, var(--bg1), var(--bg2) 55%, var(--bg3));
      overflow-x:hidden;
    }

    body{
      padding:14px;
    }

    .app{
      width:min(1280px, 100%);
      margin:0 auto;
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }

    .title-wrap{
      min-width:190px;
    }

    h1{
      margin:0;
      font-size:clamp(1.35rem, 3vw, 2.35rem);
      letter-spacing:.5px;
      line-height:1;
      text-shadow:0 4px 14px rgba(0,0,0,.35);
    }

    .subtitle{
      margin:4px 0 0;
      color:var(--muted);
      font-size:.9rem;
    }

    .top-controls{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
    }

    .control,
    button,
    select,
    input{
      font:inherit;
    }

    .control{
      display:flex;
      align-items:center;
      gap:6px;
      background:rgba(255,255,255,.1);
      border:1px solid rgba(255,255,255,.18);
      padding:7px 9px;
      border-radius:999px;
      box-shadow:0 8px 22px rgba(0,0,0,.18);
      white-space:nowrap;
    }

    .control span{
      color:var(--muted);
      font-weight:700;
      font-size:.84rem;
    }

    select,
    input[type="number"]{
      border:none;
      border-radius:999px;
      padding:7px 9px;
      background:#fff;
      color:#18182e;
      font-weight:800;
      outline:none;
      min-height:34px;
    }

    input[type="number"]{
      width:72px;
    }

    button{
      border:none;
      border-radius:999px;
      padding:10px 14px;
      font-weight:900;
      color:#121225;
      background:var(--accent);
      cursor:pointer;
      transition:.14s transform ease, .14s filter ease, .14s background ease;
      box-shadow:0 9px 18px rgba(0,0,0,.25);
      min-height:38px;
    }

    button:hover{
      transform:translateY(-1px) scale(1.02);
      filter:brightness(1.06);
    }

    button:active{
      transform:translateY(1px) scale(.98);
    }

    button.secondary{
      background:#fff;
    }

    button.green{
      background:var(--accent2);
    }

    button.blue{
      background:#8ecae6;
    }

    button.danger{
      background:var(--danger);
      color:#fff;
    }

    .main-grid{
      display:grid;
      grid-template-columns:minmax(260px, .8fr) minmax(460px, 1.35fr);
      gap:12px;
      align-items:stretch;
    }

    .panel{
      background:var(--card);
      border:1px solid rgba(255,255,255,.18);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
    }

    .letter-panel{
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
      min-height:calc(100vh - 110px);
    }

    .letter-card{
      flex:1;
      min-height:250px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:
        linear-gradient(145deg, rgba(255,255,255,.22), rgba(255,255,255,.08)),
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.22), transparent 25%);
      border:1px solid rgba(255,255,255,.18);
      border-radius:22px;
      position:relative;
      overflow:hidden;
    }

    .letter-card::before{
      content:"";
      position:absolute;
      inset:-60px;
      background:conic-gradient(from 0deg, transparent, rgba(255,255,255,.18), transparent, rgba(255,209,102,.18), transparent);
      animation:spin 9s linear infinite;
      opacity:.6;
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    .letter-inner{
      position:relative;
      z-index:1;
      text-align:center;
    }

    .small-label{
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.12em;
      font-weight:900;
      font-size:.84rem;
    }

    #letter{
      font-size:clamp(7rem, 20vw, 15rem);
      font-weight:1000;
      line-height:.88;
      text-shadow:
        0 10px 30px rgba(0,0,0,.38),
        0 0 40px rgba(255,209,102,.35);
    }

    #timer{
      margin-top:4px;
      font-size:clamp(2.1rem, 6vw, 4.5rem);
      font-weight:1000;
      font-variant-numeric:tabular-nums;
      color:#fff;
    }

    .timer-warning{
      color:var(--accent)!important;
      animation:pulseText .55s infinite alternate;
    }

    .timer-danger{
      color:var(--danger)!important;
      animation:shake .22s linear infinite;
    }

    @keyframes pulseText{
      to{text-shadow:0 0 28px rgba(255,209,102,.9)}
    }

    @keyframes shake{
      0%,100%{transform:translateX(0)}
      25%{transform:translateX(-3px)}
      75%{transform:translateX(3px)}
    }

    .letter-buttons{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .big-action{
      grid-column:1 / -1;
      font-size:1.06rem;
      padding:13px 14px;
    }

    .hint{
      color:var(--muted);
      text-align:center;
      font-size:.86rem;
      line-height:1.35;
      margin:0;
    }

    .category-panel{
      padding:12px;
      min-height:calc(100vh - 110px);
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .cat-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }

    .cat-head h2{
      margin:0;
      font-size:1.3rem;
      line-height:1;
    }

    .cat-actions{
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      gap:7px;
    }

    .categories{
      flex:1;
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:8px;
      align-content:start;
    }

    .category{
      min-height:52px;
      display:flex;
      align-items:center;
      gap:8px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.16);
      border-radius:14px;
      padding:8px 10px;
      box-shadow:0 8px 16px rgba(0,0,0,.16);
    }

    .num{
      flex:0 0 auto;
      width:32px;
      height:32px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:linear-gradient(145deg, var(--accent), #ff9f1c);
      color:#15152b;
      font-weight:1000;
      box-shadow:0 6px 14px rgba(0,0,0,.28);
    }

    .cat-text{
      font-size:clamp(.92rem, 1.65vw, 1.12rem);
      font-weight:850;
      line-height:1.13;
    }

    .add-row{
      display:flex;
      gap:8px;
    }

    #customCategory{
      flex:1;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      padding:10px 13px;
      font-weight:800;
    }

    canvas#confettiCanvas{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      pointer-events:none;
      z-index:50;
    }

    .overlay{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      z-index:60;
      background:rgba(0,0,0,.45);
      backdrop-filter:blur(5px);
      text-align:center;
      padding:20px;
    }

    .overlay.show{
      display:flex;
      animation:overlayPop .25s ease-out;
    }

    @keyframes overlayPop{
      from{opacity:0}
      to{opacity:1}
    }

    .celebration-card{
      width:min(720px, 96vw);
      border-radius:32px;
      padding:28px;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.3), transparent 22%),
        linear-gradient(135deg, #ff006e, #8338ec, #3a86ff, #06d6a0);
      box-shadow:0 30px 100px rgba(0,0,0,.55);
      border:3px solid rgba(255,255,255,.45);
      animation:celebrateBounce .8s cubic-bezier(.2,1.8,.2,1) both;
    }

    @keyframes celebrateBounce{
      0%{transform:scale(.6) rotate(-4deg)}
      70%{transform:scale(1.08) rotate(2deg)}
      100%{transform:scale(1) rotate(0)}
    }

    .celebration-card h2{
      margin:0;
      font-size:clamp(3rem, 10vw, 7rem);
      line-height:.9;
      text-shadow:0 8px 22px rgba(0,0,0,.45);
    }

    .celebration-card p{
      margin:12px 0 20px;
      font-size:clamp(1.1rem, 3vw, 1.8rem);
      font-weight:900;
    }

    .sound-note{
      margin:0;
      color:var(--muted);
      text-align:center;
      font-size:.8rem;
    }

    @media (orientation:landscape) and (min-width:720px){
      body{
        padding:10px;
      }

      header{
        margin-bottom:8px;
      }

      .main-grid{
        grid-template-columns:minmax(250px, 34vw) 1fr;
      }

      .letter-panel,
      .category-panel{
        min-height:calc(100vh - 90px);
      }

      .category{
        min-height:46px;
        padding:7px 9px;
      }

      .categories{
        grid-template-columns:repeat(2, minmax(0,1fr));
      }
    }

    @media (min-width:1150px){
      .categories{
        grid-template-columns:repeat(3, minmax(0,1fr));
      }
    }

    @media (max-width:820px){
      body{
        padding:10px;
      }

      header{
        flex-direction:column;
        align-items:stretch;
      }

      .top-controls{
        justify-content:flex-start;
      }

      .main-grid{
        grid-template-columns:1fr;
      }

      .letter-panel,
      .category-panel{
        min-height:auto;
      }

      .letter-card{
        min-height:240px;
      }

      .categories{
        grid-template-columns:1fr;
      }
    }

    @media print{
      body{
        background:#fff;
        color:#000;
      }

      header,
      .letter-buttons,
      .cat-actions,
      .add-row,
      .hint,
      .sound-note,
      .overlay,
      canvas{
        display:none!important;
      }

      .main-grid{
        grid-template-columns:1fr 2fr;
      }

      .panel,
      .category,
      .letter-card{
        box-shadow:none;
        border:1px solid #000;
        background:#fff;
        color:#000;
      }

      #letter,
      #timer{
        color:#000!important;
        text-shadow:none;
      }

      .num{
        background:#000;
        color:#fff;
      }
    }
  </style>
</head>
<body>
  <canvas id="confettiCanvas"></canvas>

  <div class="overlay" id="timeUpOverlay" role="dialog" aria-modal="true">
    <div class="celebration-card">
      <h2>TIME'S UP!</h2>
      <p>Pencils down! Count your answers.</p>
      <button class="big-action" id="overlayNextRound">Next Round</button>
    </div>
  </div>

  <div class="app">
    <header>
      <div class="title-wrap">
        <h1>Scattergories</h1>
        <p class="subtitle">Classroom party edition</p>
      </div>

      <div class="top-controls">
        <label class="control">
          <span>Time</span>
          <select id="timeSelect" title="Choose round time">
            <option value="60">1:00</option>
            <option value="90">1:30</option>
            <option value="120" selected>2:00</option>
            <option value="180">3:00</option>
            <option value="300">5:00</option>
          </select>
        </label>

        <label class="control">
          <span>Categories</span>
          <input id="categoryCount" type="number" min="4" max="24" value="12" />
        </label>

        <label class="control">
          <span>Volume</span>
          <select id="volumeSelect" title="Sound volume">
            <option value="0">Muted</option>
            <option value="0.45">Normal</option>
            <option value="0.8" selected>Loud</option>
            <option value="1">Very loud</option>
          </select>
        </label>
      </div>
    </header>

    <main class="main-grid">
      <section class="panel letter-panel">
        <div class="letter-card">
          <div class="letter-inner">
            <div class="small-label">Letter</div>
            <div id="letter">A</div>
            <div class="small-label">Timer</div>
            <div id="timer">2:00</div>
          </div>
        </div>

        <div class="letter-buttons">
          <button class="green big-action" id="startPauseBtn">Start</button>
          <button class="secondary" id="newLetterBtn">New Letter</button>
          <button class="blue" id="newRoundBtn">New Round</button>
          <button class="danger" id="resetTimerBtn">Reset Timer</button>
        </div>

        <p class="hint">
          Sounds start after the first button press because browsers block autoplay.
          Use the volume menu if it gets too loud.
        </p>
      </section>

      <section class="panel category-panel">
        <div class="cat-head">
          <h2>Categories</h2>
          <div class="cat-actions">
            <button class="secondary" id="shuffleCategoriesBtn">Shuffle</button>
            <button class="secondary" id="fewerBtn">− Fewer</button>
            <button class="secondary" id="moreBtn">+ More</button>
          </div>
        </div>

        <div class="categories" id="categories"></div>

        <div class="add-row">
          <input id="customCategory" placeholder="Add your own category..." />
          <button id="addCategoryBtn">Add</button>
        </div>

        <p class="sound-note">
          Child-friendly categories are used automatically.
        </p>
      </section>
    </main>
  </div>

    let customCategories = [];

    let timeRemaining = roundSeconds;

    const letterEl = document.getElementById("letter");
    const timerEl = document.getElementById("timer");
    const categoriesEl = document.getElementById("categories");
    const timeSelect = document.getElementById("timeSelect");

    const newLetterBtn = document.getElementById("newLetterBtn");
    const newRoundBtn = document.getElementById("newRoundBtn");
    const resetTimerBtn = document.getElementById("resetTimerBtn");
    const shuffleCategoriesBtn = document.getElementById("shuffleCategoriesBtn");
    const fewerBtn = document.getElementById("fewerBtn");
    const moreBtn = document.getElementById("moreBtn");

    // ---------- Audio ----------
    let audioCtx = null;

    function getVolume(){
      return Number(volumeSelect.value || 0.8);
    }

    function ensureAudio(){
      if (!audioCtx){
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === "suspended"){
        audioCtx.resume();
      }
    }

    function beep(freq=440, duration=0.12, type="sine", gain=0.4, when=0){
      if (getVolume() <= 0) return;
      ensureAudio();
      const now = audioCtx.currentTime + when;
      const osc = audioCtx.createOscillator();
      const vol = audioCtx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      vol.gain.setValueAtTime(0.0001, now);
      vol.gain.exponentialRampToValueAtTime(Math.max(0.0001, gain * getVolume()), now + 0.015);
      vol.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(vol);
      vol.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.03);
    }

    function noiseBurst(duration=0.25, gain=0.25, when=0){
      if (getVolume() <= 0) return;
      ensureAudio();
      const now = audioCtx.currentTime + when;
      const bufferSize = Math.floor(audioCtx.sampleRate * duration);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);

      for(let i=0; i<bufferSize; i++){
        data[i] = Math.random() * 2 - 1;
      }

      const source = audioCtx.createBufferSource();
      const filter = audioCtx.createBiquadFilter();
      const vol = audioCtx.createGain();

      source.buffer = buffer;
      filter.type = "bandpass";
      filter.frequency.setValueAtTime(1800, now);
      filter.frequency.exponentialRampToValueAtTime(700, now + duration);

      vol.gain.setValueAtTime(0.0001, now);
      vol.gain.exponentialRampToValueAtTime(gain * getVolume(), now + 0.02);
      vol.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      source.connect(filter);
      filter.connect(vol);
      vol.connect(audioCtx.destination);
      source.start(now);
      source.stop(now + duration);
    }

    function playStartSound(){
      beep(330, .10, "square", .35, 0);
      beep(440, .10, "square", .35, .11);
      beep(660, .16, "triangle", .5, .22);
    }

    function playPauseSound(){
      beep(380, .12, "sawtooth", .28, 0);
      beep(250, .18, "sawtooth", .25, .11);
    }

    function playNewLetterSound(){
      beep(220, .06, "square", .35, 0);
      beep(330, .06, "square", .35, .06);
      beep(550, .08, "square", .35, .12);
      noiseBurst(.12, .15, .02);
    }

    function playShuffleSound(){
      beep(520, .05, "square", .25, 0);
      beep(430, .05, "square", .25, .05);
      beep(610, .05, "square", .25, .10);
      beep(500, .05, "square", .25, .15);
    }

    function playTick(second){
      if (second <= 10){
        beep(880, .055, "square", .42, 0);
        if (second <= 5) beep(1320, .04, "square", .3, .06);
      } else if (second <= 20) {
        beep(620, .045, "triangle", .23, 0);
      } else if (second % 10 === 0) {
        beep(430, .055, "triangle", .2, 0);
      }
    }

    function playEndCelebration(){
      noiseBurst(.55, .45, 0);
      beep(220, .2, "sawtooth", .6, 0);
      beep(110, .55, "square", .45, .05);

      const notes = [523, 659, 784, 1046, 784, 1046, 1318];
      notes.forEach((n, i) => beep(n, .16, i % 2 ? "triangle" : "square", .52, .34 + i * .12));

      setTimeout(() => {
        notes.slice().reverse().forEach((n, i) => beep(n, .09, "triangle", .35, i * .07));
      }, 1300);
    }

    // ---------- Game ----------
    function formatTime(seconds){
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${m}:${String(s).padStart(2, "0")}`;
    }

    function updateTimerDisplay(){
      timerEl.textContent = formatTime(timeRemaining);
      timerEl.classList.toggle("timer-warning", timeRemaining <= 20 && timeRemaining > 10);
      timerEl.classList.toggle("timer-danger", timeRemaining <= 10 && timeRemaining > 0);
    }

    function setTimerFromDropdown(){
      roundSeconds = Number(timeSelect.value);
      timeRemaining = roundSeconds;
      lastTickSecond = null;
      stopTimer(false);
      updateTimerDisplay();
    }

    function randomLetter(){
      const previous = currentLetter;
      let next = previous;
      while (next === previous && letters.length > 1){
        next = letters[Math.floor(Math.random() * letters.length)];
      }
      currentLetter = next;
      letterEl.textContent = currentLetter;
      letterEl.animate([
        {transform:"scale(.7) rotate(-8deg)", opacity:.35},
        {transform:"scale(1.16) rotate(4deg)", opacity:1},
        {transform:"scale(1) rotate(0)", opacity:1}
      ], {duration:360, easing:"cubic-bezier(.2,1.8,.3,1)"});
      playNewLetterSound();
    }

    function shuffleArray(arr){
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function chooseCategories(){
      const count = Math.max(4, Math.min(24, Number(categoryCountInput.value) || 12));
      categoryCountInput.value = count;
      const pool = [...categoryBank, ...customCategories];
      currentCategories = shuffleArray(pool).slice(0, count);
      renderCategories();
    }

    function renderCategories(){
      categoriesEl.innerHTML = "";
      currentCategories.forEach((cat, index) => {
        const item = document.createElement("div");
        item.className = "category";
        item.innerHTML = `
          <div class="num">${index + 1}</div>
          <div class="cat-text">${escapeHtml(cat)}</div>
        `;
        categoriesEl.appendChild(item);
      });
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function startTimer(){
      ensureAudio();
      overlay.classList.remove("show");
      if (running) return;
      running = true;
      startPauseBtn.textContent = "Pause";
      playStartSound();

      timerInterval = setInterval(() => {
        if (timeRemaining <= 0){
          endRound();
          return;
        }

        timeRemaining -= 1;
        updateTimerDisplay();

        if (lastTickSecond !== timeRemaining){
          lastTickSecond = timeRemaining;
          playTick(timeRemaining);
        }

        if (timeRemaining <= 0){
          endRound();
        }
      }, 1000);
    }

    function stopTimer(playSound=true){
      running = false;
      startPauseBtn.textContent = "Start";
      if (timerInterval){
        clearInterval(timerInterval);
        timerInterval = null;
      }
      if (playSound) playPauseSound();
    }

    function resetTimer(){
      stopTimer(false);
      timeRemaining = roundSeconds;
      lastTickSecond = null;
      updateTimerDisplay();
    }

    function newRound(){
      overlay.classList.remove("show");
      stopTimer(false);
      randomLetter();
      chooseCategories();
      timeRemaining = roundSeconds;
      lastTickSecond = null;
      updateTimerDisplay();
      playShuffleSound();
    }

    function endRound(){
      stopTimer(false);
      timeRemaining = 0;
      updateTimerDisplay();
      playEndCelebration();
      launchConfetti();
      overlay.classList.add("show");

      if ("vibrate" in navigator){
        navigator.vibrate([120, 60, 120, 60, 220]);
      }
    }

    function addCustomCategory(){
      const value = customCategoryInput.value.trim();
      if (!value) return;
      customCategories.push(value);
      customCategoryInput.value = "";
      chooseCategories();
      playShuffleSound();
    }

    // ---------- Confetti ----------
    const canvas = document.getElementById("confettiCanvas");
    const ctx = canvas.getContext("2d");
    let confettiPieces = [];
    let confettiAnimation = null;

    function resizeCanvas(){
      canvas.width = window.innerWidth * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    function launchConfetti(){
      resizeCanvas();
      confettiPieces = [];
      const colours = ["#ffd166", "#06d6a0", "#118ab2", "#ef476f", "#ffffff", "#8338ec", "#ffbe0b"];

      for(let i=0; i<260; i++){
        confettiPieces.push({
          x: Math.random() * window.innerWidth,
          y: -20 - Math.random() * window.innerHeight * .35,
          vx: (Math.random() - .5) * 9,
          vy: Math.random() * 4 + 4,
          size: Math.random() * 8 + 4,
          spin: Math.random() * Math.PI,
          rotSpeed: (Math.random() - .5) * .35,
          colour: colours[Math.floor(Math.random() * colours.length)],
          life: 220 + Math.random() * 80
        });
      }

      if (confettiAnimation) cancelAnimationFrame(confettiAnimation);
      animateConfetti();
    }

    function animateConfetti(){
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      confettiPieces.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += .035;
        p.vx *= .992;
        p.spin += p.rotSpeed;
        p.life -= 1;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.spin);
        ctx.fillStyle = p.colour;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .62);
        ctx.restore();
      });

      confettiPieces = confettiPieces.filter(p => p.life > 0 && p.y < window.innerHeight + 60);

      if (confettiPieces.length){
        confettiAnimation = requestAnimationFrame(animateConfetti);
      } else {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        confettiAnimation = null;
      }
    }

    // ---------- Events ----------
    timeSelect.addEventListener("change", setTimerFromDropdown);

    volumeSelect.addEventListener("change", () => {
      ensureAudio();
      beep(660, .08, "triangle", .25, 0);
      beep(880, .08, "triangle", .25, .09);
    });

    categoryCountInput.addEventListener("change", () => {
      chooseCategories();
      playShuffleSound();
    });

    startPauseBtn.addEventListener("click", () => {
      if (running) stopTimer(true);
      else startTimer();
    });

    newLetterBtn.addEventListener("click", randomLetter);
    newRoundBtn.addEventListener("click", newRound);
    resetTimerBtn.addEventListener("click", resetTimer);

    shuffleCategoriesBtn.addEventListener("click", () => {
      chooseCategories();
      playShuffleSound();
    });

    fewerBtn.addEventListener("click", () => {
      categoryCountInput.value = Math.max(4, Number(categoryCountInput.value) - 1);
      chooseCategories();
      playShuffleSound();
    });

    moreBtn.addEventListener("click", () => {
      categoryCountInput.value = Math.min(24, Number(categoryCountInput.value) + 1);
      chooseCategories();
      playShuffleSound();
    });

    addCategoryBtn.addEventListener("click", addCustomCategory);

    customCategoryInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addCustomCategory();
    });

    overlayNextRound.addEventListener("click", newRound);

    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) overlay.classList.remove("show");
    });

    window.addEventListener("resize", resizeCanvas);

    document.addEventListener("keydown", (e) => {
      if (e.target.matches("input, select, textarea")) return;

      if (e.code === "Space"){
        e.preventDefault();
        if (running) stopTimer(true);
        else startTimer();
      }

      if (e.key.toLowerCase() === "n"){
        newRound();
      }

      if (e.key.toLowerCase() === "l"){
        randomLetter();
      }

      if (e.key.toLowerCase() === "s"){
        chooseCategories();
        playShuffleSound();
      }
    });

    // Initial setup
    resizeCanvas();
    randomLetter();
    chooseCategories();
    updateTimerDisplay();
  </script>
</body>
</html>
