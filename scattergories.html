<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scattergories List Generator</title>
  <style>
    :root {
      --bg1: #111827;
      --bg2: #312e81;
      --card: rgba(255,255,255,.92);
      --ink: #111827;
      --muted: #6b7280;
      --accent: #f97316;
      --accent2: #22c55e;
      --danger: #ef4444;
      --shadow: 0 18px 45px rgba(0,0,0,.25);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(249,115,22,.45), transparent 28rem),
        radial-gradient(circle at bottom right, rgba(34,197,94,.35), transparent 25rem),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color: white;
      padding: 12px;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 3rem);
      line-height: 1;
      margin: 0;
      letter-spacing: -0.05em;
      text-shadow: 0 8px 22px rgba(0,0,0,.25);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.25);
      backdrop-filter: blur(8px);
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 12px;
      align-items: start;
    }

    .panel {
      background: var(--card);
      color: var(--ink);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px;
      overflow: hidden;
    }

    .game-panel {
      display: grid;
      gap: 7px;
    }

    .big-card {
      border-radius: 14px;
      background: white;
      padding: 10px;
      box-shadow: inset 0 0 0 2px #f3f4f6;
      text-align: center;
    }

    .label {
      text-transform: uppercase;
      font-size: .82rem;
      font-weight: 900;
      color: var(--muted);
      letter-spacing: .12em;
      margin-bottom: 2px;
    }

    .letter {
      font-size: clamp(3.8rem, 10vw, 6rem);
      font-weight: 1000;
      line-height: .9;
      color: var(--accent);
      text-shadow: 0 7px 0 #fed7aa;
      margin: 4px 0 8px;
    }

    .timer {
      font-size: clamp(2.3rem, 6vw, 3.6rem);
      font-variant-numeric: tabular-nums;
      font-weight: 1000;
      margin: 2px 0 8px;
    }

    button, input, select {
      font: inherit;
    }

    button {
      border: 0;
      background: #111827;
      color: white;
      padding: 9px 11px;
      border-radius: 14px;
      font-weight: 850;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0,0,0,.22);
      transform: translateY(0);
      transition: .12s ease;
    }

    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.22); }
    button.secondary { background: #e5e7eb; color: #111827; }
    button.good { background: var(--accent2); }
    button.warn { background: var(--accent); }
    button.danger { background: var(--danger); }
    button.small { padding: 8px 10px; border-radius: 10px; box-shadow: none; }

    .row {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 7px;
      margin: 8px 0;
    }

    input, select {
      width: 100%;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      padding: 8px 10px;
      background: white;
      color: #111827;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--accent); }

    .category-list {
      display: grid;
      gap: 7px;
      margin-top: 8px;
    }

    .category {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 8px;
      background: #f9fafb;
      border: 2px solid #eef2f7;
      border-radius: 10px;
      padding: 6px 8px;
    }

    .num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #111827;
      color: white;
      font-weight: 900;
    }

    .category-name { font-weight: 850; font-size: .95rem; }

    #roundCategories { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #bank { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .muted { color: var(--muted); }

    .controls {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin: 4px 0 6px;
    }

    .count-box {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #f3f4f6;
      border-radius: 12px;
      padding: 5px;
      font-weight: 900;
    }

    .count-box span {
      min-width: 32px;
      text-align: center;
      font-size: 1.05rem;
    }

    .notice {
      padding: 8px 10px;
      border-radius: 14px;
      background: #fffbeb;
      color: #92400e;
      font-weight: 700;
      margin-top: 8px;
    }

    .footer-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .about {
      margin-top: 8px;
      color: rgba(255,255,255,.8);
      font-size: .85rem;
    }

    @media (max-width: 850px) {
      body { padding: 14px; }
      .grid { grid-template-columns: 1fr; }
      #roundCategories, #bank { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Scattergories<br>List Generator</h1>
      <div class="pill">Standalone classroom version</div>
    </header>

    <section class="grid">
      <div class="panel game-panel">
        <div class="big-card">
          <div class="label">Letter</div>
          <div class="letter" id="letter">A</div>
          <button class="warn" id="rerollLetter">Re-roll Letter</button>
        </div>

        <div class="big-card">
          <div class="label">Time</div>
          <div class="timer" id="timer">03:00</div>
          <div class="row">
            <select id="timeSelect" aria-label="Select timer length">
              <option value="60">1 minute</option>
              <option value="120">2 minutes</option>
              <option value="180" selected>3 minutes</option>
              <option value="300">5 minutes</option>
              <option value="600">10 minutes</option>
            </select>
            <button class="secondary" id="setTime">Update</button>
          </div>
          <div class="row" style="margin-top: 12px;">
            <button class="good" id="playPause">Start</button>
            <button class="secondary" id="resetTimer">Reset</button>
          </div>
        </div>

        <button class="danger" id="restart">Restart Round</button>
      </div>

      <div class="panel">
        <div class="label">Categories</div>
        <h2 style="margin: 0 0 4px;font-size:1.25rem;">This round</h2>
        <div class="controls">
          <div class="count-box">
            <button class="small secondary" id="less">−</button>
            <span id="count">12</span>
            <button class="small secondary" id="more">+</button>
          </div>
          <button class="secondary" id="newRound">Randomise Categories</button>
          <button class="secondary" id="childFriendly">Make Child-Friendly</button>
        </div>

        <p class="muted" id="summary"></p>
        <div id="roundCategories" class="category-list"></div>

        <hr style="border:0;border-top:2px solid #eef2f7;margin:10px 0;">

        <h2 style="margin-bottom: 2px;font-size:1.15rem;">Edit category bank</h2>
        <p class="muted" style="margin:0;">Add your own ideas. They save in this browser.</p>
        <div class="field-row">
          <input id="newCategory" placeholder="Add a category, e.g. Things in a video game" />
          <button class="good" id="addCategory">Add</button>
        </div>
        <div class="footer-actions">
          <button class="secondary" id="showBank">Show / Hide Full Bank</button>
          <button class="danger" id="clearCustom">Remove Custom Categories</button>
        </div>
        <div id="bank" class="category-list" style="display:none;"></div>
      </div>
    </section>

    <p class="about">Tip: choose a letter, start the timer, then students write one answer per category starting with that letter.</p>
  </main>

  <script>
    const defaultCategories = [
      { text: "Animals", kid: true },
      { text: "Things in the kitchen", kid: true },
      { text: "Movies", kid: true },
      { text: "Famous people", kid: true },
      { text: "Countries", kid: true },
      { text: "Cities", kid: true },
      { text: "Foods", kid: true },
      { text: "Drinks", kid: true },
      { text: "Desserts", kid: true },
      { text: "Fruit or vegetables", kid: true },
      { text: "Things at school", kid: true },
      { text: "School subjects", kid: true },
      { text: "Jobs", kid: true },
      { text: "Sports", kid: true },
      { text: "Sports teams", kid: true },
      { text: "Video games", kid: true },
      { text: "Game characters", kid: true },
      { text: "Things in Minecraft", kid: true },
      { text: "Things in Roblox", kid: true },
      { text: "Things in Fortnite", kid: true },
      { text: "Things that are cold", kid: true },
      { text: "Things that are hot", kid: true },
      { text: "Things that are loud", kid: true },
      { text: "Things that are quiet", kid: true },
      { text: "Things you can wear", kid: true },
      { text: "Shoes or clothing brands", kid: true },
      { text: "Cartoon characters", kid: true },
      { text: "TV shows", kid: true },
      { text: "YouTubers or streamers", kid: true },
      { text: "Apps or websites", kid: true },
      { text: "Phone apps", kid: true },
      { text: "Things with wheels", kid: true },
      { text: "Vehicles", kid: true },
      { text: "Things found outside", kid: true },
      { text: "Things in nature", kid: true },
      { text: "Things that fly", kid: true },
      { text: "Things in the ocean", kid: true },
      { text: "Things in space", kid: true },
      { text: "Things in a supermarket", kid: true },
      { text: "Things at the mall", kid: true },
      { text: "Music artists or bands", kid: true },
      { text: "Songs", kid: true },
      { text: "Board games", kid: true },
      { text: "Card games", kid: true },
      { text: "Things you plug in", kid: true },
      { text: "Things that use batteries", kid: true },
      { text: "Things that smell good", kid: true },
      { text: "Things that are expensive", kid: true },
      { text: "Things that are cheap", kid: true },
      { text: "Things you can break", kid: true },
      { text: "Things you can build", kid: true },
      { text: "Things made of metal", kid: true },
      { text: "Things made of plastic", kid: true },
      { text: "Things made of wood", kid: true },
      { text: "Things that are round", kid: true },
      { text: "Things that are square", kid: true },
      { text: "Things that are red", kid: true },
      { text: "Things that are blue", kid: true },
      { text: "Things you do on the weekend", kid: true },
      { text: "Holiday activities", kid: true },
      { text: "Places to visit", kid: true },
      { text: "Things in a bedroom", kid: true },
      { text: "Things in a bathroom", kid: true },
      { text: "Things in a backpack", kid: true },
      { text: "Things in a car", kid: true },
      { text: "Books", kid: true },
      { text: "Book characters", kid: true },
      { text: "Words with double letters", kid: true },
      { text: "Three-letter words", kid: true },
      { text: "Four-letter words", kid: true },
      { text: "Things that make you laugh", kid: true },
      { text: "Reasons to celebrate", kid: true },
      { text: "Excuses", kid: false },
      { text: "Bad habits", kid: false },
      { text: "Things people argue about", kid: false },
      { text: "Things you should not say to a teacher", kid: false },
      { text: "Embarrassing moments", kid: false },
      { text: "Reasons to be late", kid: false }
    ];

    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").filter(l => !["Q", "U", "V", "X", "Y", "Z"].includes(l));
    let customCategories = JSON.parse(localStorage.getItem("scatterCustomCategories") || "[]");
    let categoryBank = [...defaultCategories, ...customCategories.map(text => ({ text, kid: true, custom: true }))];
    let numberOfCategories = Number(localStorage.getItem("scatterCount") || 12);
    let timeTotal = 180;
    let timeLeft = timeTotal;
    let timerId = null;
    let currentRound = [];

    const $ = id => document.getElementById(id);

    function save() {
      localStorage.setItem("scatterCustomCategories", JSON.stringify(customCategories));
      localStorage.setItem("scatterCount", numberOfCategories);
    }

    function shuffle(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function pickLetter() {
      $("letter").textContent = letters[Math.floor(Math.random() * letters.length)];
    }

    function pickCategories(source = categoryBank) {
      const available = source.length ? source : categoryBank;
      currentRound = shuffle(available).slice(0, Math.min(numberOfCategories, available.length));
      renderRound();
    }

    function renderRound() {
      $("count").textContent = numberOfCategories;
      $("summary").textContent = `${currentRound.length} categories chosen from ${categoryBank.length} available categories.`;
      const container = $("roundCategories");
      container.innerHTML = "";

      if (!currentRound.length) {
        container.innerHTML = `<div class="notice">No categories available. Add a category to restart.</div>`;
        return;
      }

      currentRound.forEach((cat, index) => {
        const div = document.createElement("div");
        div.className = "category";
        div.innerHTML = `<div class="num">${index + 1}</div><div class="category-name">${cat.text}</div><button class="small secondary" type="button">Swap</button>`;
        div.querySelector("button").addEventListener("click", () => swapCategory(index));
        container.appendChild(div);
      });
    }

    function renderBank() {
      const bank = $("bank");
      bank.innerHTML = "";
      categoryBank.forEach((cat, index) => {
        const div = document.createElement("div");
        div.className = "category";
        div.innerHTML = `<div class="num">${index + 1}</div><div class="category-name">${cat.text}${cat.custom ? " <span class='muted'>(custom)</span>" : ""}</div><button class="small danger" type="button">Remove</button>`;
        div.querySelector("button").addEventListener("click", () => removeCategory(cat.text));
        bank.appendChild(div);
      });
    }

    function rebuildBank() {
      categoryBank = [...defaultCategories, ...customCategories.map(text => ({ text, kid: true, custom: true }))];
      renderBank();
    }

    function swapCategory(index) {
      const used = new Set(currentRound.map(c => c.text));
      const choices = categoryBank.filter(c => !used.has(c.text));
      if (!choices.length) return;
      currentRound[index] = choices[Math.floor(Math.random() * choices.length)];
      renderRound();
    }

    function removeCategory(text) {
      customCategories = customCategories.filter(c => c !== text);
      const defaultIndex = defaultCategories.findIndex(c => c.text === text);
      if (defaultIndex >= 0) defaultCategories.splice(defaultIndex, 1);
      rebuildBank();
      pickCategories();
      save();
    }

    function addCategory() {
      const value = $("newCategory").value.trim();
      if (!value) return;
      if (!categoryBank.some(c => c.text.toLowerCase() === value.toLowerCase())) {
        customCategories.push(value);
        rebuildBank();
        pickCategories();
        save();
      }
      $("newCategory").value = "";
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, "0");
      const s = (seconds % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function renderTime() {
      $("timer").textContent = formatTime(timeLeft);
    }

    function startTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        $("playPause").textContent = "Start";
        return;
      }
      $("playPause").textContent = "Pause";
      timerId = setInterval(() => {
        timeLeft--;
        renderTime();
        if (timeLeft <= 0) {
          clearInterval(timerId);
          timerId = null;
          $("playPause").textContent = "Start";
          alert("Time is up!");
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerId);
      timerId = null;
      timeLeft = timeTotal;
      $("playPause").textContent = "Start";
      renderTime();
    }

    function restartRound() {
      resetTimer();
      pickLetter();
      pickCategories();
    }

    $("rerollLetter").addEventListener("click", pickLetter);
    $("newRound").addEventListener("click", () => pickCategories());
    $("restart").addEventListener("click", restartRound);
    $("playPause").addEventListener("click", startTimer);
    $("resetTimer").addEventListener("click", resetTimer);
    $("setTime").addEventListener("click", () => {
      timeTotal = Number($("timeSelect").value);
      resetTimer();
    });
    $("less").addEventListener("click", () => {
      numberOfCategories = Math.max(1, numberOfCategories - 1);
      save();
      pickCategories();
    });
    $("more").addEventListener("click", () => {
      numberOfCategories = Math.min(categoryBank.length, numberOfCategories + 1);
      save();
      pickCategories();
    });
    $("addCategory").addEventListener("click", addCategory);
    $("newCategory").addEventListener("keydown", e => { if (e.key === "Enter") addCategory(); });
    $("showBank").addEventListener("click", () => {
      const bank = $("bank");
      bank.style.display = bank.style.display === "none" ? "grid" : "none";
      renderBank();
    });
    $("childFriendly").addEventListener("click", () => pickCategories(categoryBank.filter(c => c.kid)));
    $("clearCustom").addEventListener("click", () => {
      customCategories = [];
      rebuildBank();
      pickCategories();
      save();
    });

    pickLetter();
    renderTime();
    rebuildBank();
    pickCategories();
  </script>
</body>
</html>
