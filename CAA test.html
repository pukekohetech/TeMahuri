<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAA Skills Studio | Pukekohe High School</title>
<style>
:root{
  --bg:#f5f7fb;--surface:#fff;--text:#182230;--muted:#617083;--line:#dce3ec;
  --primary:#2457c5;--primary2:#6c4bc3;--good:#197548;--warn:#a85b00;--bad:#b42318;
  --shadow:0 12px 35px rgba(24,34,48,.10);--radius:18px;--font:1rem;
}
*{box-sizing:border-box}html{font-size:var(--font);scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
body.high-contrast{--bg:#fff;--surface:#fff;--text:#000;--muted:#222;--line:#000;--primary:#003da6;--primary2:#551a8b;--good:#006b2f;--bad:#9d0000}
body.reduce-motion *{scroll-behavior:auto!important;animation:none!important;transition:none!important}
button,input,select,textarea{font:inherit}button{cursor:pointer}
a{color:var(--primary)}
.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;z-index:50;background:#fff;padding:10px;border:2px solid #000}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar{max-width:1180px;margin:auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;white-space:nowrap}.school-shield{width:38px;height:45px;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(24,34,48,.18))}.brand-copy{display:grid;line-height:1.05}.brand-school{font-size:.72rem;letter-spacing:.045em;text-transform:uppercase;color:#7a1f35;font-weight:900}.brand-title{font-size:1rem;color:var(--text);font-weight:900}.hero-school{display:flex;align-items:center;gap:12px;margin-bottom:8px}.hero-school img{width:52px;height:62px;object-fit:contain}.hero-school strong{display:block;color:#7a1f35;font-size:.98rem}.hero-school span{display:block;color:var(--muted);font-size:.85rem}.pattern-chip{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;font-weight:750;font-size:.78rem;border:1px solid #e5c6a2;background:#fff6e8;color:#7a4a00}.pattern-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pattern-box{border:1px solid var(--line);border-radius:12px;padding:12px;background:#f8fafc}.pattern-box h3{font-size:1rem;margin:0 0 5px}.pattern-box p{font-size:.88rem;margin:0;color:var(--muted)}
nav{display:flex;gap:5px;flex:1;flex-wrap:wrap}.nav-btn{border:0;background:transparent;border-radius:10px;padding:9px 11px;color:var(--muted);font-weight:700}.nav-btn:hover,.nav-btn.active{background:#edf2ff;color:var(--primary)}
.top-actions{display:flex;gap:5px}.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-width:42px}
main{max-width:1180px;margin:auto;padding:28px 18px 64px}
.hero{background:linear-gradient(135deg,#e9f0ff,#f4edff 60%,#fff4df);border:1px solid #dce3f5;border-radius:28px;padding:28px;display:grid;grid-template-columns:1.5fr 1fr;gap:24px;box-shadow:var(--shadow)}
.eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:.76rem;font-weight:850;color:var(--primary)}
h1,h2,h3{line-height:1.15}h1{font-size:clamp(2rem,4vw,3.5rem);margin:.25rem 0 .8rem}h2{font-size:1.55rem;margin:.25rem 0 .7rem}h3{margin:.2rem 0 .45rem}
.hero p{font-size:1.08rem;max-width:68ch;color:#354458}.hero-side{display:grid;gap:10px;align-content:center}
.standard-pill,.pill,.theme-chip,.skill-chip,.difficulty-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-weight:750;font-size:.82rem;border:1px solid var(--line);background:#fff}
.standard-pill{justify-content:space-between}.standard-pill b{color:var(--primary)}
.section{margin-top:28px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.section-head p{margin:0;color:var(--muted)}
.grid{display:grid;gap:14px}.theme-grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.area-grid{grid-template-columns:repeat(3,1fr)}.stat-grid{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 3px 14px rgba(24,34,48,.05)}
.theme-card{position:relative;text-align:left;min-height:150px;transition:.18s transform,.18s box-shadow;border:2px solid transparent}.theme-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.theme-card.selected{border-color:var(--primary);box-shadow:0 0 0 3px rgba(36,87,197,.12)}.theme-card .icon{font-size:1.65rem}.theme-card p{font-size:.91rem;color:var(--muted);margin:.4rem 0}.theme-card .check{position:absolute;right:12px;top:12px;opacity:0}.theme-card.selected .check{opacity:1;color:var(--primary);font-weight:900}
.area-card{display:flex;flex-direction:column;gap:8px;min-height:220px}.area-icon{font-size:2rem}.area-card p{color:var(--muted);flex:1}.area-card.reading{border-top:5px solid #2878c8}.area-card.writing{border-top:5px solid #26845a}.area-card.numeracy{border-top:5px solid #db731d}
.btn{border:0;border-radius:12px;padding:10px 15px;font-weight:800}.btn-primary{background:var(--primary);color:#fff}.btn-secondary{background:#edf2ff;color:var(--primary);border:1px solid #cdd9f5}.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--text)}.btn-good{background:var(--good);color:#fff}.btn-danger{background:#fff0ef;color:var(--bad);border:1px solid #ffd0cb}.btn:disabled{opacity:.48;cursor:not-allowed}
.button-row{display:flex;gap:9px;flex-wrap:wrap}.small{font-size:.86rem}.muted{color:var(--muted)}.hidden{display:none!important}
.practice-shell{max-width:860px;margin:auto}.practice-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.progress-track{height:9px;background:#e5e9f0;border-radius:99px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));width:0}
.question-card{margin-top:16px;padding:24px}.question-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.theme-chip{background:#f5f0ff}.skill-chip{background:#edf7ff}.difficulty-chip{background:#fff6e8}
.stimulus{background:#f7f9fc;border-left:5px solid var(--primary);padding:16px 18px;border-radius:12px;margin:12px 0 20px;white-space:pre-line}.stimulus h3{margin-top:0}.prompt{font-size:1.2rem;font-weight:800;margin:14px 0}
.options{display:grid;gap:9px}.option{display:flex;gap:12px;text-align:left;width:100%;border:2px solid var(--line);background:#fff;border-radius:13px;padding:13px}.option:hover{border-color:#9fb6eb;background:#f8faff}.option.selected{border-color:var(--primary);background:#eef3ff}.option.correct{border-color:var(--good);background:#eaf7f0}.option.incorrect{border-color:var(--bad);background:#fff0ef}.letter{min-width:29px;height:29px;border-radius:8px;background:#edf1f6;display:grid;place-items:center;font-weight:900}
.answer-input{width:100%;max-width:330px;padding:12px;border:2px solid var(--line);border-radius:12px}.answer-input:focus,textarea:focus,select:focus{outline:3px solid rgba(36,87,197,.2);border-color:var(--primary)}
.feedback{margin-top:15px;border-radius:13px;padding:15px;border:1px solid var(--line)}.feedback.good{background:#eaf7f0;border-color:#a5d5bb}.feedback.bad{background:#fff3ef;border-color:#f2b7a8}.feedback h3{margin-top:0}.working{background:#fff;border:1px dashed #b6c0cc;border-radius:10px;padding:11px;margin-top:9px}
.hint{background:#fff9e7;border:1px solid #ecd696;padding:12px;border-radius:12px;margin-top:12px}
.textarea{width:100%;min-height:230px;border:2px solid var(--line);border-radius:12px;padding:13px;resize:vertical}.checklist{display:grid;gap:7px;margin:12px 0}.check-row{display:flex;gap:10px;align-items:flex-start;background:#f7f9fc;border-radius:10px;padding:10px}
.stat-card strong{font-size:1.9rem;display:block}.bar-list{display:grid;gap:11px}.bar-row{display:grid;grid-template-columns:180px 1fr 70px;gap:10px;align-items:center}.mini-track{height:10px;background:#e7ebf1;border-radius:999px;overflow:hidden}.mini-fill{height:100%;background:var(--primary)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-weight:800}.field select,.field input[type=number]{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.toggle-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.toggle{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}
.audit{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.86rem;white-space:pre-wrap;background:#111827;color:#e5f4ff;border-radius:12px;padding:14px;max-height:310px;overflow:auto}
.notice{border-left:5px solid #d28a12;background:#fff8e9;padding:13px 15px;border-radius:10px}.success-notice{border-left-color:var(--good);background:#eaf7f0}
.report-list{display:grid;gap:8px}.report-item{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:80;display:grid;place-items:center;padding:20px}.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;padding:20px;box-shadow:var(--shadow)}
footer{max-width:1180px;margin:auto;padding:0 18px 28px;color:var(--muted);font-size:.85rem}
@media(max-width:800px){.hero{grid-template-columns:1fr}.area-grid,.stat-grid,.settings-grid,.pattern-list{grid-template-columns:1fr}.bar-row{grid-template-columns:120px 1fr 55px}.topbar{flex-wrap:wrap}nav{order:3;width:100%}}
@media(max-width:520px){.theme-grid{grid-template-columns:1fr 1fr}.theme-card{min-height:130px;padding:13px}.toggle-list{grid-template-columns:1fr}.question-card{padding:17px}.bar-row{grid-template-columns:1fr}.mini-track{grid-column:1/-1}}
@media print{header,footer,.no-print,.button-row,.practice-top{display:none!important}body{background:#fff}.card{box-shadow:none}.print-page{break-after:page}.answer-key{break-before:page}}
</style>
</head>

function mcq(id,area,theme,family,skill,difficulty,prompt,options,answerIndex,rationale,extra={}){
 return {id,area,theme,family,skill,difficulty,type:"mcq",prompt,options,answerIndex,rationale,...extra};
}
function numeric(id,theme,family,skill,difficulty,prompt,answer,unit,rationale,calc){

}

}

function buildReading(){
 const out=[];
 for(const [theme,p] of Object.entries(READING_PACKS)){
  const defs=[
   ["locate","read-locate","Locate explicit information",1,p.locate],
   ["infer","read-infer","Make an inference",2,p.infer],
   ["purpose","read-purpose","Identify purpose",2,p.purpose],
   ["relevance","read-relevance","Select relevant information",2,p.relevance]
  ];
  defs.forEach(([key,family,skill,difficulty,d])=>{
   out.push(mcq(`R-${theme}-${key}`,"reading",theme,family,skill,difficulty,d[0],d[1],d[2],d[3],{stimulusTitle:p.title,stimulus:p.text}));
  });
  out.push(mcq(`R-${theme}-credibility`,"reading",theme,"read-credibility","Judge source credibility",2,
   "If an important detail in this notice may have changed, which source is best to check before acting?",
   ["An anonymous comment posted last year","A current update from the organisation responsible for the notice","A friend's guess about what usually happens","An advertisement for an unrelated service"],1,
   "A current update from the responsible organisation is the strongest source because it is directly connected to the arrangements and is most likely to be up to date.",
   {stimulusTitle:p.title,stimulus:p.text}));
  const ex=READING_EXTRAS[theme];
  out.push(mcq(`R-${theme}-vocab`,"reading",theme,"read-vocab","Work out vocabulary from context",2,
   ex.vocab[0],ex.vocab[1],ex.vocab[2],ex.vocab[3],{stimulusTitle:p.title,stimulus:p.text,caaPattern:true}));
  out.push(mcq(`R-${theme}-combine`,"reading",theme,"read-combine","Combine and summarise information",3,
   ex.combine[0],ex.combine[1],ex.combine[2],ex.combine[3],{stimulusTitle:p.title,stimulus:p.text,caaPattern:true}));
  out.push(mcq(`R-${theme}-feature`,"reading",theme,"read-text-feature","Understand a text feature",2,
   `How does the heading "${p.title}" help the reader?`,
   ["It gives the answer to every question in the notice","It tells the reader who wrote every sentence","It signals the topic so the reader can predict the kind of information that follows","It proves that every detail will stay current forever"],2,
   "A useful heading previews the topic and helps the reader anticipate what information will follow.",
   {stimulusTitle:p.title,stimulus:p.text,caaPattern:true}));
 }
 return out;
}

function recompute(calc){
 const c=calc||{};
 if(c.kind==="percentPrice") return +(c.price*(1-c.rate/100)).toFixed(2);
 if(c.kind==="rateTime") return +(c.target*(c.minutes/c.count)).toFixed(2);
 if(c.kind==="mToCm") return +(c.metres*100).toFixed(4);
 if(c.kind==="area") return +(c.length*c.width).toFixed(4);
 if(c.kind==="mean") return +(c.values.reduce((a,b)=>a+b,0)/c.values.length).toFixed(4);
 if(c.kind==="scale") return +(c.draw*c.scale).toFixed(4);
 if(c.kind==="change") return +(((c.newValue-c.oldValue)/c.oldValue)*100).toFixed(2);
 if(c.kind==="linear") return +(c.start+(c.term-1)*c.step).toFixed(4);
 if(c.kind==="range") return +(Math.max(...c.values)-Math.min(...c.values)).toFixed(4);
 if(c.kind==="navigate") return +(Math.abs(c.end-c.start)*c.unit).toFixed(4);
 if(c.kind==="duration") return +(c.end-c.start).toFixed(4);
 if(c.kind==="servings") return +((c.litres*1000)/c.servingMl).toFixed(4);
 return NaN;
}

}

  return state.settings.fixedTheme==="mixed"?e:[state.settings.fixedTheme];

function selectQuestions(area,count){
 if(area==="mixed"){
  const areas=shuffle(["reading","writing","numeracy"]);
  const base=Math.floor(count/3), extra=count%3;
  const buckets=areas.map((a,i)=>selectQuestions(a,base+(i<extra?1:0)));
  const combined=[];
  while(buckets.some(b=>b.length)){
   for(const b of buckets){if(b.length)combined.push(b.shift());}
  }
  return combined;
 }
 const themes=themePoolForSelection();
 let pool=BANK.filter(q=>(area==="mixed"||q.area===area)&&themes.includes(q.theme)&&q.difficulty<=state.settings.maxDifficulty);
 const chosen=[];
 const used=new Set();
 const usedFamilies=new Set();
 for(let i=0;i<count;i++){
  let candidates=pool.filter(q=>!used.has(q.id));
  if(!candidates.length){used.clear();candidates=pool;}
  if(!candidates.length)break;
  let freshFamily=candidates.filter(q=>!usedFamilies.has(q.family));
  if(freshFamily.length)candidates=freshFamily;
  else usedFamilies.clear();
  // Prefer different themes and skill families so short sessions cover more ground.
  if(chosen.length){
   const last=chosen[chosen.length-1];
   const varied=candidates.filter(q=>q.theme!==last.theme&&q.family!==last.family);
   if(varied.length)candidates=varied;
  }
  const q=pick(candidates); chosen.push(q); used.add(q.id); usedFamilies.add(q.family);
 }

}

function themeCard(t){
 const selected=effectiveTheme()===t.id&&state.settings.themeMode!=="fixed";
 const disabled=state.settings.themeMode!=="student"||(t.id!=="mixed"&&!enabledThemes().includes(t.id));
 return `<button class="card theme-card ${selected?"selected":""}" data-theme="${t.id}" ${disabled?"disabled":""}><span class="check">Selected</span><div class="icon">${t.icon}</div><h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p></button>`;
}
function areaCards(){
 return [
  ["reading","&#128214;","Reading",STANDARDS.reading.title,"reading"],
  ["writing","&#9998;","Writing",STANDARDS.writing.title,"writing"],
  ["numeracy","&#247;","Numeracy",STANDARDS.numeracy.title,"numeracy"]
 ].map(([id,icon,name,desc,cls])=>`<article class="card area-card ${cls}"><div class="area-icon">${icon}</div><h2>${name}</h2><p>${esc(desc)}</p><div class="small muted">${BANK.filter(q=>q.area===id).length} practice items | ${new Set(BANK.filter(q=>q.area===id).map(q=>q.family)).size} skill types | ${REAL_THEMES.length} contexts</div><button class="btn btn-primary" data-start="${id}">Start ${name}</button></article>`).join("");
}
function renderPracticeLanding(){
 const audit=validateBank();
 document.getElementById("main").innerHTML=`
 <section class="section-head"><div><div class="eyebrow">Practice</div><h1 style="font-size:2.3rem">Choose your session</h1><p>Current context: <strong>${esc(themeName(effectiveTheme()))}</strong>. Session length: ${state.settings.sessionLength} questions.</p></div></section>
 <div class="grid area-grid">${areaCards()}</div>

  <h2>Balanced CAA practice</h2><p class="muted">Mixes Reading, Writing and Numeracy. In Mixed context mode, the engine also rotates contexts to reduce repetition.</p>
  <div class="button-row"><button class="btn btn-primary" data-start="mixed">Start balanced session</button><button class="btn btn-ghost" data-view="home">Change context</button></div>
 </section>

function startSession(area){
 const qs=selectQuestions(area,state.settings.sessionLength);
 if(!qs.length){alert("No questions are available with the current teacher settings.");return;}
 session={area,questions:qs.map(q=>q.id),index:0,score:0,answered:false,selected:null,hints:0,optionOrders:{},started:Date.now()};
 renderQuestion();
}
function renderQuestion(){
 const main=document.getElementById("main");
 if(!session||session.index>=session.questions.length){finishSession();return;}
 const q=ITEM_MAP[session.questions[session.index]];
 const pct=(session.index/session.questions.length)*100;
 main.innerHTML=`<div class="practice-shell">
  <div class="practice-top no-print"><div><strong>Question ${session.index+1} of ${session.questions.length}</strong> <span class="muted">| Score ${session.score}</span></div><button class="btn btn-ghost small" id="quitBtn">End session</button></div>

  <article class="card question-card">
   <div class="question-meta">
    <span class="theme-chip">${esc(themeName(q.theme))}</span><span class="skill-chip">${esc(q.skill)}</span><span class="difficulty-chip">${difficultyLabel(q.difficulty)}</span>${q.caaPattern?`<span class="pattern-chip" title="Original practice item informed by released CAA question patterns">CAA pattern</span>`:""}
   </div>
   ${q.stimulus?`<div class="stimulus"><h3>${esc(q.stimulusTitle)}</h3>${esc(q.stimulus)}</div>`:""}
   ${q.scenario?`<div class="stimulus"><h3>Scenario</h3>${esc(q.scenario)}</div>`:""}
   <div class="prompt">${esc(q.prompt)}</div>
   <div id="answerArea">${answerUI(q)}</div>
   <div id="supportArea"></div>
   <div class="button-row no-print" style="margin-top:16px">

function validateBank(){
 const errors=[];const ids=new Set();let numericChecked=0;
 BANK.forEach(q=>{
  if(ids.has(q.id))errors.push(`${q.id}: duplicate ID`);ids.add(q.id);
  ["id","area","theme","family","skill","difficulty","type","prompt"].forEach(k=>{if(q[k]===undefined||q[k]==="")errors.push(`${q.id}: missing ${k}`);});
  if(!THEME_MAP[q.theme])errors.push(`${q.id}: unknown theme`);
  if(!["reading","writing","numeracy"].includes(q.area))errors.push(`${q.id}: invalid area`);
  if(![1,2,3].includes(q.difficulty))errors.push(`${q.id}: invalid difficulty`);
  if(q.type==="mcq"){
   if(!Array.isArray(q.options)||q.options.length<3)errors.push(`${q.id}: too few options`);
   if(!Number.isInteger(q.answerIndex)||q.answerIndex<0||q.answerIndex>=q.options.length)errors.push(`${q.id}: invalid answer index`);
   if(new Set(q.options.map(x=>String(x).trim().toLowerCase())).size!==q.options.length)errors.push(`${q.id}: duplicate answer options`);
   if(!q.rationale)errors.push(`${q.id}: missing rationale`);
  }
  if(q.type==="numeric"){
   numericChecked++;const check=recompute(q.calc);
   if(!Number.isFinite(q.answer)||!Number.isFinite(check))errors.push(`${q.id}: invalid numeric value`);
   else if(Math.abs(check-q.answer)>0.0001)errors.push(`${q.id}: stored answer ${q.answer} does not match recomputed ${check}`);
   if(!q.rationale)errors.push(`${q.id}: missing worked explanation`);
  }
  if(q.area==="reading"&&(!q.stimulus||!q.stimulusTitle))errors.push(`${q.id}: reading item missing source text`);
 });
 // Coverage checks: each real theme should include every core family.
 const required=["read-locate","read-infer","read-purpose","read-relevance","read-credibility","read-vocab","read-combine","read-text-feature","write-punctuation","write-sentence","write-register","write-organisation","write-spelling","write-extended","write-informative","write-homophones","write-verb","write-conjunction","write-boundaries","write-apostrophe","num-percent","num-rate","num-units","num-area","num-mean","num-scale","num-change","num-pattern","num-probability","num-range","num-navigation","num-time","num-capacity","num-reasonableness","num-data-claim","num-prob-equivalence","num-best-value"];
 REAL_THEMES.forEach(t=>required.forEach(f=>{if(!BANK.some(q=>q.theme===t.id&&q.family===f))errors.push(`${t.id}: missing family ${f}`);}));
 const log=[
  `CAA Skills Studio automated bank audit`,
  `Items checked: ${BANK.length}`,
  `Reading: ${BANK.filter(q=>q.area==="reading").length}`,
  `Writing: ${BANK.filter(q=>q.area==="writing").length}`,
  `Numeracy: ${BANK.filter(q=>q.area==="numeracy").length}`,
  `Skill families: ${new Set(BANK.map(q=>q.family)).size}`,
  `CAA-pattern flagged items: ${BANK.filter(q=>q.caaPattern).length}`,
  `Numeric answers recomputed: ${numericChecked}`,
  `Themes checked: ${REAL_THEMES.length}`,
  `Errors: ${errors.length}`,
  errors.length?"":"PASS - no structural or calculation errors detected.",
  ...errors.slice(0,60).map(e=>`ERROR - ${e}`)
 ].join("\n");
 return {errors,numericChecked,log};
}

 const keyHTML=questions.map((q,i)=>`<section><p><strong>${i+1}.</strong> ${q.type==="mcq"?esc(q.options[q.answerIndex]):q.type==="numeric"?`${trimNumber(q.answer)} ${esc(q.unit||"")}`:"Teacher/self review using content, language choices, organisation and accuracy."}${q.rationale?`<br><span>${esc(q.rationale)}</span>`:""}</p></section>`).join("");

 const w=window.open("","_blank");w.document.write(`<!doctype html><html><head><title>Pukekohe High School CAA Practice</title><style>body{font:12pt Arial,sans-serif;max-width:800px;margin:30px auto;line-height:1.4}.print-brand{display:flex;align-items:center;gap:12px;border-bottom:2px solid #222;padding-bottom:10px;margin-bottom:18px}.print-brand img{width:44px;height:52px;object-fit:contain}.print-brand strong{display:block;font-size:14pt}.print-brand span{font-size:10pt}.paper-q{margin:0 0 22px}.stimulus{background:#f4f4f4;border-left:4px solid #333;padding:10px;margin:8px 0}.answer-key{break-before:page}h1{font-size:22pt}@media print{button{display:none}}</style></head><body><button onclick="print()">Print</button><div class="print-brand"><img src="${shieldSrc}" alt=""><div><strong>Pukekohe High School</strong><span>CAA Skills Studio</span></div></div><h1>CAA Practice - ${esc(area==="mixed"?"Balanced":areaName(area))}</h1><p>Name: ______________________________ Date: ____________</p>${testHTML}<div class="answer-key"><div class="print-brand"><img src="${shieldSrc}" alt=""><div><strong>Pukekohe High School</strong><span>CAA Skills Studio - Answer key</span></div></div><h1>Answer key</h1>${keyHTML}</div></body></html>`);w.document.close();
}
function exportProgress(){
 const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),state},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="caa-skills-progress.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
}

function bindViewButtons(){document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>render(b.dataset.view));}
function bindCommon(){
 bindViewButtons();
 document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{if(state.settings.themeMode!=="student")return;state.theme=b.dataset.theme;saveState();renderHome();});
 document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>startSession(b.dataset.start));
}
document.querySelectorAll(".nav-btn").forEach(b=>b.onclick=()=>render(b.dataset.view));
document.getElementById("textDown").onclick=()=>{state.settings.fontScale=Math.max(.9,+(state.settings.fontScale-.05).toFixed(2));saveState();};
document.getElementById("textUp").onclick=()=>{state.settings.fontScale=Math.min(1.25,+(state.settings.fontScale+.05).toFixed(2));saveState();};
document.getElementById("contrastBtn").onclick=()=>{state.settings.highContrast=!state.settings.highContrast;saveState();};
applyAccessibility();
render("home");
</script>
</body>
</html>
