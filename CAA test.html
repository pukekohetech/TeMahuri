<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5d6b">
<title>CAA Skills Quest v1.2 — Reading, Writing & Numeracy</title>
<style>
:root{
  --ink:#102a43;--muted:#52667a;--paper:#f6f7f4;--card:#ffffff;--line:#d8e2e8;
  --teal:#0d8b8f;--teal-dark:#075f69;--blue:#2878c8;--purple:#6c4bb6;--green:#3c8e52;
  --orange:#e97b22;--pink:#c64c86;--gold:#d79b18;--danger:#b5473f;--soft:#eef5f6;
  --shadow:0 12px 34px rgba(16,42,67,.13);--radius:22px;--focus:#ffbf47;
  --nav-h:72px;--max:1220px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--paper)}
body{margin:0;font-family:Arial,"Helvetica Neue",sans-serif;color:var(--ink);background:
 radial-gradient(circle at 12% 8%,rgba(13,139,143,.09),transparent 28rem),
 radial-gradient(circle at 92% 18%,rgba(108,75,182,.08),transparent 25rem),var(--paper);min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.55}
a{color:var(--blue)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.hidden{display:none!important}
.skip-link{position:fixed;left:12px;top:-100px;z-index:9999;background:#fff;color:#000;padding:12px 16px;border-radius:8px;box-shadow:var(--shadow)}
.skip-link:focus{top:12px}

/* Top navigation */
#topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);min-height:var(--nav-h)}
.topbar-inner{max-width:var(--max);margin:auto;display:flex;align-items:center;gap:12px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:10px;min-width:max-content}
.brand-mark{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,var(--teal),var(--blue));display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 7px 18px rgba(13,139,143,.28)}
.brand-text strong{display:block;font-size:1rem}.brand-text span{font-size:.78rem;color:var(--muted)}
.nav-stats{display:flex;gap:8px;align-items:center;margin-left:auto}
.stat-chip{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#f2f6f7;border:1px solid var(--line);border-radius:999px;font-size:.82rem;white-space:nowrap}
.progress-mini{width:92px;height:8px;border-radius:999px;background:#dfe9ec;overflow:hidden}.progress-mini>span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green));width:0}
.nav-actions{display:flex;align-items:center;gap:6px}
.icon-btn{min-width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:13px;display:grid;place-items:center;color:var(--ink);font-size:1.05rem}
.icon-btn:hover{background:#edf7f7;border-color:#9bcfd2}
.menu-toggle{display:none}
.nav-menu{display:flex;gap:6px;align-items:center}
.nav-menu button{border:0;background:transparent;color:var(--ink);padding:10px 9px;border-radius:11px;font-weight:700;font-size:.88rem}
.nav-menu button:hover{background:#edf4f6}
#topbar.start-mode .nav-stats,#topbar.start-mode .nav-menu{display:none}

main{max-width:var(--max);margin:0 auto;padding:28px 18px 72px;min-height:calc(100vh - var(--nav-h))}
.screen-title{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin:8px 0 24px}
.screen-title h1{font-size:clamp(1.8rem,4vw,3rem);margin:0;line-height:1.05}.screen-title p{margin:8px 0 0;color:var(--muted);max-width:760px;line-height:1.55}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-weight:900;text-transform:uppercase;letter-spacing:.09em;font-size:.74rem;color:var(--teal-dark);margin-bottom:9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel{padding:22px}
.soft-panel{background:linear-gradient(145deg,#fff,#f0f7f7)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;background:#e7f4f4;color:var(--teal-dark);font-weight:800;font-size:.78rem}
.pill.purple{background:#eee9fa;color:#563d97}.pill.orange{background:#fff0df;color:#9b4f13}.pill.blue{background:#e8f1fb;color:#195a9f}.pill.green{background:#e8f4eb;color:#2c6b3b}
.btn{border:0;border-radius:14px;padding:12px 17px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(145deg,var(--teal),var(--teal-dark));color:#fff;box-shadow:0 8px 18px rgba(7,95,105,.22)}
.btn-secondary{background:#edf4f6;color:var(--ink);border:1px solid #cbdadd}
.btn-purple{background:linear-gradient(145deg,#7656c4,#563d97);color:#fff}
.btn-orange{background:linear-gradient(145deg,#f0923d,#cf6512);color:#fff}
.btn-green{background:linear-gradient(145deg,#4da465,#2f7541);color:#fff}
.btn-danger{background:#fff0ee;color:#8c2c26;border:1px solid #e6aaa4}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.button-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Start screen */
.hero{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(340px,.92fr);gap:22px;align-items:stretch}
.hero-copy{padding:clamp(24px,5vw,52px);position:relative;overflow:hidden;background:linear-gradient(145deg,#073e4a,#0d6d76 58%,#2878c8);color:#fff;min-height:510px}
.hero-copy:after{content:"";position:absolute;width:360px;height:360px;border-radius:50%;right:-145px;top:-115px;background:rgba(255,255,255,.08)}
.hero-copy h1{font-size:clamp(2.4rem,6vw,4.9rem);line-height:.96;margin:12px 0 18px;max-width:780px}.hero-copy h1 span{color:#ffd37a}
.hero-copy p{font-size:clamp(1rem,2vw,1.2rem);line-height:1.55;max-width:640px;color:#ecfbff}
.hero-values{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0}.hero-values span{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);font-weight:800;font-size:.85rem}
.hero-art{height:175px;margin-top:24px;border-radius:20px;background-image:var(--art-game);background-size:cover;background-position:center 6%;border:1px solid rgba(255,255,255,.2);box-shadow:0 14px 30px rgba(0,0,0,.2)}
.start-panel{padding:26px;display:flex;flex-direction:column;gap:18px}
.start-panel h2{margin:0;font-size:1.55rem}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field.full{grid-column:1/-1}
.field label{display:block;font-weight:850;margin:0 0 7px}.field input,.field select,.field textarea{width:100%;border:1px solid #bfcfd5;border-radius:12px;padding:12px 13px;background:#fff;color:var(--ink)}
.start-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.start-actions .btn:first-child{grid-column:1/-1}
.notice{border-left:5px solid var(--teal);background:#edf8f8;padding:13px 15px;border-radius:12px;color:#274f55;line-height:1.45;font-size:.9rem}
.notice.warning{border-color:var(--orange);background:#fff6ea;color:#70421c}.notice.purple{border-color:var(--purple);background:#f5f1fd;color:#493979}
.subject-chooser{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.subject-choice{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 12px;text-align:left;display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;color:var(--ink)}
.subject-choice:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(16,42,67,.12)}
.subject-choice .subject-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;font-size:1.35rem;background:var(--subject,#2878c8)}
.subject-choice strong{display:block}.subject-choice small{display:block;color:var(--muted);margin-top:3px;line-height:1.3}
.subject-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:18px 0 30px}
.subject-card{position:relative;overflow:hidden;padding:25px;min-height:265px;display:flex;flex-direction:column;border-top:8px solid var(--subject,#2878c8)}
.subject-card:after{content:"";position:absolute;width:185px;height:185px;border-radius:50%;right:-70px;top:-70px;background:var(--subject-soft,#e7f1fb)}
.subject-card>*{position:relative;z-index:1}.subject-card .subject-big-icon{width:68px;height:68px;border-radius:20px;background:var(--subject,#2878c8);color:#fff;display:grid;place-items:center;font-size:2rem;box-shadow:0 9px 20px rgba(16,42,67,.15)}
.subject-card h2{margin:16px 0 7px}.subject-card p{color:var(--muted);line-height:1.5;margin:0 0 15px}.subject-card .btn{margin-top:auto;align-self:flex-start;background:var(--subject,#2878c8)}
.subject-section{margin:34px 0}.subject-section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:14px;border-bottom:3px solid var(--subject,#2878c8);padding-bottom:10px}.subject-section-head h2{margin:0}.subject-section-head p{margin:4px 0 0;color:var(--muted)}
.subject-hero{padding:26px;background:linear-gradient(145deg,#fff,var(--subject-soft,#e7f1fb));border-top:8px solid var(--subject,#2878c8)}
.subject-hero-inner{display:grid;grid-template-columns:88px 1fr auto;gap:20px;align-items:center}.subject-hero-icon{width:88px;height:88px;border-radius:25px;background:var(--subject,#2878c8);color:#fff;display:grid;place-items:center;font-size:2.8rem}.subject-hero h1{margin:0 0 6px}.subject-hero p{margin:0;color:var(--muted);line-height:1.5}
.paper-stimulus{border:1px solid #697a82;border-radius:8px;padding:10px 12px;margin:8px 0 10px;background:#f7f8f8;white-space:pre-line;line-height:1.45}.paper-stimulus strong{display:block;margin-bottom:5px}

/* Hubs and zones */
.mode-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:20px 0 30px}
.mode-card{padding:20px;min-height:190px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;position:relative;overflow:hidden;border:1px solid var(--line);background:#fff;border-radius:20px;box-shadow:0 8px 24px rgba(16,42,67,.09)}
.mode-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(16,42,67,.14)}
.mode-card .icon{font-size:2rem;width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:#e9f5f5;margin-bottom:16px}.mode-card h3{font-size:1.08rem;margin:0 0 7px}.mode-card p{margin:0;color:var(--muted);line-height:1.42;font-size:.9rem}.mode-card .mini-label{margin-top:auto;padding-top:14px;color:var(--teal-dark);font-weight:900;font-size:.78rem}
.zone-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.zone-card{padding:21px;position:relative;overflow:hidden;min-height:230px;display:flex;flex-direction:column}
.zone-card:before{content:"";position:absolute;right:-50px;top:-55px;width:150px;height:150px;border-radius:50%;background:var(--zone-soft,#e9f6f6)}
.zone-icon{position:relative;width:58px;height:58px;border-radius:18px;background:var(--zone,#0d8b8f);color:#fff;display:grid;place-items:center;font-size:1.65rem;box-shadow:0 8px 18px rgba(16,42,67,.16)}
.zone-card h3{position:relative;margin:16px 0 6px;font-size:1.25rem}.zone-card p{position:relative;margin:0;color:var(--muted);line-height:1.45;font-size:.92rem}
.zone-meta{position:relative;display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}.zone-progress{position:relative;margin-top:auto}.bar{height:10px;background:#e3ebee;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:var(--zone,#0d8b8f);border-radius:inherit}.zone-progress small{display:flex;justify-content:space-between;margin-top:7px;color:var(--muted)}
.locked{filter:grayscale(.7);opacity:.65}.locked .btn{pointer-events:none}

/* Question screen */
.practice-shell{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}
.question-card{overflow:hidden}.question-head{padding:18px 22px;border-bottom:1px solid var(--line);background:linear-gradient(145deg,#fff,#f2f7f7);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.question-head h1{font-size:1.25rem;margin:3px 0}.question-body{padding:clamp(20px,4vw,34px)}
.level-banner{display:flex;align-items:center;gap:10px;margin-bottom:16px}.level-dot{width:12px;height:12px;border-radius:50%;background:var(--teal)}
.prompt{font-size:clamp(1.25rem,2.7vw,1.75rem);line-height:1.36;font-weight:850;margin:8px 0 22px}
.easy-box{border:2px solid #9b8bd3;background:#f5f2fd;border-radius:16px;padding:16px;margin:0 0 18px}.easy-box h3{margin:0 0 7px;color:#4f3a8d}.easy-box p{margin:0;line-height:1.5}.clue{margin-top:10px;padding:10px 12px;background:#fff;border-radius:10px;border:1px dashed #a99ad7;color:#493979}
.stimulus{background:#fbfcfd;border:1px solid #cbd9df;border-radius:17px;margin-bottom:22px;overflow:hidden}.stimulus summary{cursor:pointer;padding:14px 17px;font-weight:900;background:#edf5f7}.stimulus-content{padding:18px;white-space:pre-line;line-height:1.65;font-size:1rem;max-height:430px;overflow:auto}.stimulus-section{padding:15px;border:1px solid var(--line);border-radius:13px;margin:10px 0;background:#fff}.stimulus-section strong{display:block;margin-bottom:8px;color:var(--teal-dark)}
.option-list{display:grid;gap:11px;margin:0 0 20px}.option-btn{width:100%;text-align:left;border:2px solid #cddbe0;background:#fff;border-radius:15px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;color:var(--ink);line-height:1.4}.option-btn:hover{border-color:#7bbdc2;background:#f3fbfb}.option-btn[aria-pressed="true"]{border-color:var(--teal);background:#e7f6f6;box-shadow:0 0 0 3px rgba(13,139,143,.13)}.option-btn.eliminated{text-decoration:line-through;opacity:.45}.option-letter{flex:0 0 30px;width:30px;height:30px;border-radius:9px;background:#edf3f5;display:grid;place-items:center;font-weight:900}.option-btn[aria-pressed="true"] .option-letter{background:var(--teal);color:#fff}
.answer-input{width:100%;max-width:420px;border:2px solid #b9cbd2;border-radius:15px;padding:14px 15px;font-size:1.16rem}.unit-label{font-weight:850;margin-left:8px}
.response-area{width:100%;min-height:180px;border:2px solid #b9cbd2;border-radius:15px;padding:15px;line-height:1.55;resize:vertical}.response-area.large{min-height:310px}.word-count{font-size:.86rem;color:var(--muted);text-align:right;margin-top:6px}
.task-data{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:18px}.task-data div{padding:11px;border-radius:12px;background:#eef5f6}.task-data small{display:block;color:var(--muted);margin-bottom:3px}.task-data strong{font-size:.9rem}
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.plan-grid textarea{width:100%;min-height:100px;border:1px solid #b9cbd2;border-radius:12px;padding:11px;resize:vertical}.plan-grid label{font-weight:850;font-size:.88rem}
.check-list{display:grid;gap:9px;margin:16px 0}.check-item{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}.check-item input{margin-top:3px;transform:scale(1.25)}
.sequence-list{display:grid;gap:9px;margin:14px 0}.sequence-step{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;border:1px solid #c7d6dc;background:#fff;border-radius:14px;padding:10px}.sequence-number{width:34px;height:34px;border-radius:10px;background:#e9f5f5;display:grid;place-items:center;font-weight:900}.step-controls{display:flex;gap:4px}.step-controls button{width:36px;height:36px;border:1px solid var(--line);background:#f4f7f8;border-radius:9px}
.feedback{margin-top:20px;border-radius:17px;padding:18px;border:2px solid}.feedback.correct{background:#edf8f0;border-color:#72b582;color:#225f31}.feedback.notyet{background:#fff7ed;border-color:#e3a45f;color:#70421c}.feedback h3{margin:0 0 8px}.feedback p{margin:6px 0;line-height:1.5}.feedback .answer-reveal{background:rgba(255,255,255,.75);border-radius:11px;padding:11px;margin:10px 0}
.question-tools{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding:15px 22px;background:#fbfcfc}
.practice-side{position:sticky;top:92px;display:grid;gap:14px}.side-card{padding:17px}.side-card h3{margin:0 0 10px;font-size:1rem}.side-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.side-stat{padding:10px;border-radius:12px;background:#eff5f6;text-align:center}.side-stat strong{display:block;font-size:1.25rem}.side-stat small{color:var(--muted)}
.thinking-cycle{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.thinking-cycle span{padding:8px 5px;text-align:center;border-radius:9px;font-size:.73rem;font-weight:900;background:#eef4f5}.thinking-cycle span.active{background:var(--teal);color:#fff}

/* Vocabulary */
.search-row{display:flex;gap:10px;margin:15px 0 22px}.search-row input{flex:1;border:1px solid #b9cbd2;border-radius:13px;padding:12px 14px}.vocab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.vocab-card{padding:18px}.vocab-card h3{margin:0 0 7px;font-size:1.18rem}.vocab-card p{margin:6px 0;line-height:1.45}.vocab-card dl{margin:12px 0 0}.vocab-card dt{font-weight:900;margin-top:8px}.vocab-card dd{margin:3px 0 0;color:var(--muted)}

/* Sorter */
.sort-shell{display:grid;grid-template-columns:1fr 340px;gap:18px}.sort-cards{display:grid;gap:12px}.sort-card{padding:16px;border:2px solid #cbd9df;background:#fff;border-radius:15px;text-align:left;line-height:1.45}.sort-card.selected{border-color:var(--purple);background:#f4f0fd}.sort-card.placed{opacity:.55}.sort-source{display:block;margin:9px 0 4px;padding:9px 10px;border-left:4px solid #2878c8;background:#f3f8fc;border-radius:7px;font-size:.86rem;color:#304a58}.sort-source strong{display:block;margin-bottom:3px}.sort-bins{display:grid;gap:10px;position:sticky;top:90px}.sort-bin{border:2px dashed #9db6bf;background:#f7fbfb;border-radius:16px;padding:16px;text-align:left;min-height:88px}.sort-bin:hover,.sort-bin.active{border-color:var(--teal);background:#eaf7f7}.sort-bin strong{display:block;margin-bottom:4px}

/* Progress */
.progress-layout{display:grid;grid-template-columns:330px 1fr;gap:20px}.progress-hero{padding:28px;text-align:center}.progress-ring{width:190px;height:190px;border-radius:50%;margin:12px auto 20px;display:grid;place-items:center;background:conic-gradient(var(--teal) calc(var(--pct,0)*1%),#dce7ea 0);position:relative}.progress-ring:after{content:"";position:absolute;inset:18px;border-radius:50%;background:#fff}.progress-ring strong{position:relative;z-index:1;font-size:2.3rem}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.big-stat{padding:17px;border-radius:16px;background:#f1f6f7;text-align:center}.big-stat strong{display:block;font-size:1.7rem}.big-stat small{color:var(--muted)}
.skill-table{width:100%;border-collapse:collapse;margin-top:10px}.skill-table th,.skill-table td{text-align:left;border-bottom:1px solid var(--line);padding:11px 8px}.skill-table th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.badge{padding:17px;text-align:center;border:1px solid var(--line);border-radius:17px;background:#fff}.badge .badge-icon{width:62px;height:62px;margin:auto;border-radius:20px;background:linear-gradient(145deg,#e4eef0,#fff);display:grid;place-items:center;font-size:2rem;border:1px solid #d4e0e4}.badge.locked-badge{filter:grayscale(1);opacity:.45}.badge h4{margin:9px 0 4px}.badge p{margin:0;color:var(--muted);font-size:.8rem}

/* Dialogs */
dialog{border:0;border-radius:22px;padding:0;box-shadow:0 25px 80px rgba(0,0,0,.28);max-width:min(920px,calc(100vw - 24px));max-height:calc(100vh - 24px);width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(9,25,39,.62);backdrop-filter:blur(4px)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line);background:#f5f8f9;position:sticky;top:0;z-index:4}.dialog-head h2{margin:0;font-size:1.25rem}.dialog-close{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:1.2rem}.dialog-body{padding:22px;overflow:auto;max-height:calc(100vh - 100px)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.setting-card{border:1px solid var(--line);border-radius:15px;padding:15px}.setting-card h3{margin:0 0 10px;font-size:1rem}.setting-card label{display:flex;gap:9px;align-items:flex-start;margin:9px 0;line-height:1.35}.setting-card select,.setting-card input[type="number"],.setting-card input[type="text"]{width:100%;padding:10px;border:1px solid #b9cbd2;border-radius:10px}.toggle-row{display:flex;justify-content:space-between!important;gap:16px!important}.toggle-row input{transform:scale(1.25)}
.guide-view{display:grid;gap:14px}.guide-image-wrap{background:#e8eff1;border-radius:18px;overflow:hidden;min-height:390px;display:grid;place-items:center}.guide-image{width:100%;max-height:68vh;object-fit:contain;display:block}.guide-controls{display:flex;justify-content:space-between;gap:10px;align-items:center}.guide-thumbs{display:flex;gap:8px;overflow:auto;padding:3px}.guide-thumb{border:3px solid transparent;border-radius:10px;padding:0;background:#fff;min-width:100px}.guide-thumb.active{border-color:var(--teal)}.guide-thumb img{display:block;width:100px;height:68px;object-fit:cover;border-radius:6px}
.modal-notice{padding:12px;border-radius:12px;background:#edf6f7;margin:10px 0;line-height:1.45}

/* Test preview */
.test-preview{background:#fff;color:#111;padding:24px;border:1px solid #bbb;max-height:65vh;overflow:auto}.test-page h1{text-align:center;margin:0 0 5px}.test-fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin:14px 0}.test-line{border-bottom:1px solid #333;height:25px}.paper-question{break-inside:avoid;margin:0 0 17px}.paper-question h3{font-size:1rem;margin:0 0 7px}.paper-options{display:grid;gap:4px;margin-left:12px}.answer-space{height:44px;border-bottom:1px solid #aaa}.answer-space.large{height:90px}.two-column{columns:2;column-gap:28px}.two-column .paper-question{display:inline-block;width:100%}

/* Toast and celebration */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);background:#102a43;color:#fff;border-radius:14px;padding:12px 18px;z-index:1000;box-shadow:var(--shadow);transition:transform .24s ease;max-width:min(560px,calc(100vw - 28px));text-align:center}#toast.show{transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}.confetti span{position:absolute;top:-30px;animation:fall 1.7s ease-in forwards;font-size:1.3rem}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.15}}

/* Print fallback */
#printFallback{display:none}
body.print-fallback #app,body.print-fallback dialog,body.print-fallback #toast{display:none!important}
body.print-fallback #printFallback{display:block!important;background:#fff;color:#000;padding:18mm}

<script>
"use strict";
const BANK = {"metadata":{"title":"NZ CAA Literacy and Numeracy Question Bank","version":"1.2","created":"2026-08-21","language":"en-NZ","target_group":"Year 10 students preparing for the NCEA Literacy and Numeracy Co-requisite CAAs","purpose":"Original practice items designed to help teachers and students understand what the CAA tests and how common question types are presented.","copyright_note":"All practice questions and stimuli in this file are newly written for this bank. They are aligned to official NZ CAA outcomes and common assessment patterns but do not reproduce NZQA past-paper questions.","standards":{"32403":{"name":"Demonstrate understanding of ideas and information in written texts","area":"Literacy - Reading","credits":5},"32405":{"name":"Write texts to communicate ideas and information","area":"Literacy - Writing","credits":5},"32406":{"name":"Apply mathematics and statistics in a range of everyday situations","area":"Numeracy","credits":10}},"alignment_sources":[{"title":"Aligning the NCEA Co-requisite and the refreshed NZC - Reading","publisher":"Ministry of Education New Zealand","year":2026},{"title":"Aligning the NCEA Co-requisite and the refreshed NZC - Writing","publisher":"Ministry of Education New Zealand","year":2026},{"title":"Aligning the NCEA Co-requisite and the refreshed NZC - Numeracy","publisher":"Ministry of Education New Zealand","year":2026}],"difficulty_scale":{"1":"Foundation - direct, familiar, one-step","2":"Developing - familiar with a small interpretation step","3":"CAA-like - requires selection, inference, or multi-step processing","4":"Stretch - competing information, less familiar context, or stronger justification"},"response_types":["multiple_choice","multi_select","matching","short_text","numeric_entry","extended_response"],"notes_for_software_use":["Use student.prompt and stimulus data for the student view.","Hide teacher.answer, teacher.rationale, teacher.distractor_notes and teacher.marking_guide in student mode.","Items can be filtered by standard, outcome, archetype, context, difficulty, strand, and tags.","For extended writing items, teacher.marking_guide replaces a single correct answer."],"updated":"2026-08-21","revision_notes":["Improved wording of one measurement reasonableness item to remove possible unit ambiguity.","Interactive resource now always displays required Reading source texts in generated practice, Rapid Fire, and printable tests.","Added explicit Reading, Writing, and Numeracy area selection.","Made the measurement reasonableness item fully self-contained rather than relying on outside knowledge about insect size.","Added explicit source instructions to Reading-derived Question Decoder and Mistake Detective activities.","Corrected printable-test pooling so Reading questions are not discarded merely because they share a passage.","Improved numeric answer and unit formatting in feedback and answer keys.","Improved selected Writing register and marking-guide wording."],"revised":"2026-08-21","revision_note":"Every Reading item and every Reading-derived activity must display its source text. Students can choose Reading, Writing, or Numeracy as a focused pathway. Numeracy wording, answer keys, calculations, units, and explanations were re-audited for version 1.2."},"outcome_reference":{"32403":{"1.1":"Process information and identify important ideas.","1.2":"Make links within texts using text structures and language features.","1.3":"Identify the meaning of vocabulary essential to understanding the text.","2.1":"Identify and make links between audience, purpose, and writer point-of-view.","2.2":"Evaluate the reliability and credibility of the text and/or writer.","3.1":"Select and evaluate the relevance of texts according to the reader's purpose.","3.2":"Locate and use information across a range of texts according to the reader's purpose."},"32405":{"1.1":"Select and use content appropriate to purpose and audience.","1.2":"Use text structures appropriate to purpose and audience.","1.3":"Make language choices appropriate to purpose and audience.","1.4":"Write with sufficient technical accuracy to communicate meaning.","2.1":"Construct a variety of complete sentences.","2.2":"Punctuate correctly to support meaning.","2.3":"Use grammatical conventions accurately enough to communicate meaning.","2.4":"Use and spell everyday high-frequency vocabulary accurately.","2.5":"Make simple changes to improve coherence and organisation."},"32406":{"1.1":"Select an appropriate operation, representation, variable, and/or method.","2.1":"Apply mathematical and statistical procedures correctly in situations.","3.1":"Explain mathematical and statistical responses to situations."}},"reading_stimuli":[{"id":"RST01","title":"Repair Cafe Notice","form":"community notice","context":"community","text":"PUKEKOHE REPAIR CAFE - SATURDAY 12 SEPTEMBER\n\nBefore you throw it away, see if it can be repaired. Volunteers will be available from 10:00 am to 2:00 pm at the community hall to help with small electrical items, bicycles, clothing repairs and simple wooden furniture. Repairs are free, although visitors may need to pay for replacement parts. Please do not bring microwaves or large appliances. Children under 14 must attend with an adult. The final repair job will be accepted at 1:30 pm so volunteers have time to finish safely. No booking is required, but people are encouraged to arrive early because busy periods are expected."},{"id":"RST02","title":"Hydration Social Media Claim","form":"social media post","context":"health/media","text":"POST FROM @PeakPerformanceDaily\n\n\"Sports drinks are ALWAYS better than water after exercise. Our new ElectroMax drink replaces everything your body loses and will make you recover twice as fast. Thousands of athletes use electrolyte drinks, so the science is obvious. Try ElectroMax today!\"\n\nThe post includes a photograph of a professional-looking runner holding the product. At the bottom, in small text, it says: \"Paid partnership with ElectroMax NZ.\" No study, expert source, or comparison data is linked."},{"id":"RST03","title":"School Garden Update","form":"school newsletter article","context":"school/environment","text":"Last autumn, students converted an unused patch beside the science block into a vegetable garden. At first, the team planned to grow as many different crops as possible. After two months, however, they noticed that the shaded end of the garden stayed damp and several plants struggled. The group began recording sunlight, rainfall and plant growth each week. Using the records, they moved the tomatoes to the sunniest beds and planted leafy greens in the cooler area. By the end of the term, fewer plants had died and the garden was producing enough vegetables for the food technology classes to use once a week. The students now plan to keep collecting data before deciding what to plant next season."},{"id":"RST04","title":"Bus Service Change","form":"transport advisory","context":"transport","text":"ROUTE 394 TEMPORARY CHANGE - MONDAY TO FRIDAY\n\nRoadworks on King Street mean Route 394 will not stop at King Street Library or King Street Shops between 8:30 am and 4:00 pm from 3-14 August. During these hours, passengers should use the temporary stop on West Road, approximately 350 metres from the library. Services before 8:30 am and after 4:00 pm will follow the normal route. The 394 timetable will not change, but delays of up to 10 minutes are possible. Passengers needing step-free access should note that the temporary stop has a raised kerb but no shelter."},{"id":"RST05","title":"The Missing Wallet","form":"fiction extract","context":"narrative","text":"By the time Tama reached the dairy, the rain had turned the footpath silver. He pushed his hands into his jacket pockets and froze. The left pocket was empty. He checked again, more slowly this time, although he already knew what he would find. No wallet. Behind him, a bus pulled away from the stop with a sigh of brakes. Tama pictured the wallet on the seat where he had been sitting, his student ID tucked behind the bank card. He started running, then stopped. Chasing the bus was pointless. He pulled out his phone instead and searched for the transport company's lost-property number."},{"id":"RST06","title":"AI for Homework - Two Views","form":"paired opinion texts","context":"school/digital technology","texts":[{"label":"Text A","text":"A student council article argues that AI tools can help students begin difficult tasks. It says students can use AI to generate examples, explain unfamiliar vocabulary, or suggest questions to investigate. The article warns that copying an AI answer and submitting it as your own work prevents learning and may breach school rules."},{"label":"Text B","text":"A teacher blog post says AI can be useful when students already understand the basics of a topic. The writer recommends asking AI for feedback on a draft or for another explanation of a concept. However, the post cautions that AI can invent facts, so important information should be checked against reliable sources."}]},{"id":"RST07","title":"Workshop Safety Email","form":"workplace-style email","context":"technology/workshop","text":"Subject: Change to workshop entry procedure\n\nFrom Monday, students must collect safety glasses before entering the practical work area. Bags are to be placed in the storage zone beside the classroom door, not beside machines or walkways. Students wearing open-toed footwear will complete theory work and will not take part in the practical activity that day. If a machine guard appears damaged, do not use the machine; tell the teacher immediately. These changes follow two near-miss incidents involving a bag in a walkway and a loose guard. Please read the updated safety poster before Monday's lesson."},{"id":"RST08","title":"Youth Project Grant","form":"webpage information","context":"community/project","text":"YOUTH MAKE-IT GRANT\n\nGroups of 3-8 young people aged 13-18 can apply for up to $800 to create a project that benefits their local community. Projects might include building planter boxes, producing a community podcast, running a cultural event, or creating signs for a walking track. Applications must include a short project plan, a basic budget, and the name of an adult supporter. Funding cannot be used to buy personal devices, pay group members, or cover travel outside the region. Applications close at 5:00 pm on 30 October. Successful groups will be notified within three weeks."},{"id":"RST09","title":"Stream Clean-Up Article","form":"local news article","context":"environment/news","text":"More than 60 volunteers spent Sunday morning removing rubbish from a stream beside a local reserve. Organisers reported collecting 18 bags of general waste as well as two damaged shopping trolleys. The event was organised by Wai Care Friends, a community group that has run monthly clean-ups since March. Group coordinator Lena Wu said the amount of visible rubbish had decreased over the past four months, but warned that one clean-up could not solve the problem. She encouraged people using the reserve to take litter home and asked the council to consider adding another bin near the car park. The council said it would review rubbish-bin use at the reserve before making a decision."},{"id":"RST10","title":"Apprenticeship Pathway","form":"brochure plus student comment","context":"careers/trades","texts":[{"label":"Brochure","text":"BuildStart Engineering offers a paid apprenticeship combining workplace training with off-job learning. Applicants do not need previous engineering employment, but they should be comfortable using basic measurement, following safety instructions and asking questions when unsure. Apprentices normally work four days each week and spend one day on training tasks. Some early starts are required. Applicants must be able to travel reliably to the workshop."},{"label":"Student comment","text":"\"I thought an apprenticeship would mean doing practical work all day, but there is more reading and recording than I expected. I still enjoy it because I can see why the paperwork matters. My biggest adjustment was getting to work by 7:00 am. I started planning my bus connections the night before.\""}]}],"items":[{"id":"R001","standard":"32403","area":"reading","outcome":"1.1","archetype":"locate_explicit_information","context":"community","difficulty":1,"response_type":"multiple_choice","student":{"prompt":"Which item would the Repair Cafe NOT accept?","options":["A bicycle","A torn jacket","A microwave","A small wooden stool"]},"tags":["CAA","reading","locate","community notice"],"estimated_time_seconds":60,"stimulus_id":"RST01","skill":"locate","teacher":{"answer":"C","answer_text":"A microwave","rationale":"The notice specifically says not to bring microwaves or large appliances."}},{"id":"R002","standard":"32403","area":"reading","outcome":"1.1","archetype":"identify_important_idea","context":"community","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"What is the main purpose of the Repair Cafe?","options":["To sell second-hand goods","To help people repair items instead of throwing them away","To teach children how to use power tools","To collect broken appliances for recycling"]},"tags":["CAA","reading","main_idea","community notice"],"estimated_time_seconds":60,"stimulus_id":"RST01","skill":"main_idea","teacher":{"answer":"B","answer_text":"To help people repair items instead of throwing them away","rationale":"The opening sentence and the list of volunteer repair services show that the event is intended to help repair items."}},{"id":"R003","standard":"32403","area":"reading","outcome":"1.3","archetype":"vocabulary_in_context","context":"community","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"In this notice, what does 'replacement parts' mean?","options":["New pieces needed to complete a repair","Extra volunteers who replace absent workers","Sections of the hall used for different repairs","Items people can swap with each other"]},"tags":["CAA","reading","vocabulary","community notice"],"estimated_time_seconds":60,"stimulus_id":"RST01","skill":"vocabulary","teacher":{"answer":"A","answer_text":"New pieces needed to complete a repair","rationale":"The phrase refers to components that may need to be bought to fix an item."}},{"id":"R004","standard":"32403","area":"reading","outcome":"2.1","archetype":"purpose_audience","context":"community","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"Who is the notice mainly written for?","options":["People wanting help to fix a small household item","Qualified electricians looking for full-time work","Retailers wanting to sell new appliances","People booking the hall for private functions"]},"tags":["CAA","reading","audience","community notice"],"estimated_time_seconds":60,"stimulus_id":"RST01","skill":"audience","teacher":{"answer":"A","answer_text":"People wanting help to fix a small household item","rationale":"The information is directed at members of the public who may bring repairable items."}},{"id":"R005","standard":"32403","area":"reading","outcome":"3.1","archetype":"relevance_for_purpose","context":"community","difficulty":3,"response_type":"multiple_choice","student":{"prompt":"Ana has a broken bicycle and can only arrive at 1:40 pm. Which detail is MOST relevant to deciding whether she should go?","options":["Repairs are free","No booking is required","The final repair job is accepted at 1:30 pm","Children under 14 need an adult"]},"tags":["CAA","reading","relevance","community notice"],"estimated_time_seconds":90,"stimulus_id":"RST01","skill":"relevance","teacher":{"answer":"C","answer_text":"The final repair job is accepted at 1:30 pm","rationale":"Her arrival time is after the stated final acceptance time."}},{"id":"R006","standard":"32403","area":"reading","outcome":"1.1","archetype":"inference","context":"community","difficulty":3,"response_type":"multiple_choice","student":{"prompt":"Why does the notice encourage people to arrive early?","options":["Parts are cheaper in the morning","The volunteers leave at lunchtime","There may be a queue when the event is busy","Bicycles can only be repaired before noon"]},"tags":["CAA","reading","infer","community notice"],"estimated_time_seconds":90,"stimulus_id":"RST01","skill":"infer","teacher":{"answer":"C","answer_text":"There may be a queue when the event is busy","rationale":"The notice says busy periods are expected, so early arrival reduces the risk of waiting or missing out."}},{"id":"R007","standard":"32403","area":"reading","outcome":"1.1","archetype":"identify_writer_claim","context":"health/media","difficulty":1,"response_type":"multiple_choice","student":{"prompt":"What claim does the post make about ElectroMax?","options":["It costs less than water","It makes recovery twice as fast","It is only for professional athletes","It contains no electrolytes"]},"tags":["CAA","reading","main_idea","social media post"],"estimated_time_seconds":60,"stimulus_id":"RST02","skill":"main_idea","teacher":{"answer":"B","answer_text":"It makes recovery twice as fast","rationale":"The post directly claims that the drink will make recovery twice as fast."}},{"id":"R008","standard":"32403","area":"reading","outcome":"1.2","archetype":"language_feature","context":"health/media","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"Why is the word 'ALWAYS' written in capital letters?","options":["To make the claim sound strong and certain","To show it is a scientific term","To indicate a quotation from a study","To warn that the drink is dangerous"]},"tags":["CAA","reading","text_feature","social media post"],"estimated_time_seconds":60,"stimulus_id":"RST02","skill":"text_feature","teacher":{"answer":"A","answer_text":"To make the claim sound strong and certain","rationale":"Capitalisation adds emphasis and strengthens the persuasive tone."}},{"id":"R009","standard":"32403","area":"reading","outcome":"1.3","archetype":"vocabulary_in_context","context":"health/media","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"What does 'paid partnership' tell the reader?","options":["The runner owns the company","The post has been sponsored by the product company","The post is from a government health agency","The product is free for athletes"]},"tags":["CAA","reading","vocabulary","social media post"],"estimated_time_seconds":60,"stimulus_id":"RST02","skill":"vocabulary","teacher":{"answer":"B","answer_text":"The post has been sponsored by the product company","rationale":"A paid partnership indicates commercial sponsorship."}},{"id":"R010","standard":"32403","area":"reading","outcome":"2.2","archetype":"credibility","context":"health/media","difficulty":3,"response_type":"multiple_choice","student":{"prompt":"Which detail gives the STRONGEST reason to question the post's reliability?","options":["It includes a photograph","It uses the word 'today'","It provides no evidence for the recovery claim","It mentions athletes"]},"tags":["CAA","reading","credibility","social media post"],"estimated_time_seconds":90,"stimulus_id":"RST02","skill":"credibility","teacher":{"answer":"C","answer_text":"It provides no evidence for the recovery claim","rationale":"The major performance claim is unsupported by evidence, data, or an expert source."}},{"id":"R011","standard":"32403","area":"reading","outcome":"2.2","archetype":"bias","context":"health/media","difficulty":3,"response_type":"multiple_choice","student":{"prompt":"Why might the writer have a biased point of view?","options":["The post is short","The company is paying for promotion of the product","The runner is outdoors","The product contains liquid"]},"tags":["CAA","reading","bias","social media post"],"estimated_time_seconds":90,"stimulus_id":"RST02","skill":"bias","teacher":{"answer":"B","answer_text":"The company is p ell."]},"tags":["CAA","writing","conventions","sentence"],"estimated_time_seconds":45,"skill":"sentence","teacher":{"answer":"C","answer_text":"When the bell rang, we packed our bags.","rationale":"It contains a dependent clause ('When the bell rang') plus an independent clause."}},{"id":"W015","standard":"32405","area":"writing","outcome":"2.2","archetype":"apostrophe_contraction","context":"everyday/school","difficulty":1,"response_type":"multiple_choice","student":{"prompt":"Which sentence uses the apostrophe correctly?","options":["Its going to rain.","It's going to rain.","Its' going to rain.","Its going to rain'."]},"tags":["CAA","writing","conventions","punctuation"],"estimated_time_seconds":45,"skill":"punctuation","teacher":{"answer":"B","answer_text":"It's going to rain.","rationale":"'It's' is the contraction of 'it is'."}},{"id":"W016","standard":"32405","area":"writing","outcome":"2.2","archetype":"apostrophe_possession","context":"everyday/school","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"Which sentence correctly shows that the helmet belongs to one student?","options":["The students helmet was damaged.","The student's helmet was damaged.","The students' helmet was damaged.","The student,s helmet was damaged."]},"tags":["CAA","writing","conventions","punctuation"],"estimated_time_seconds":45,"skill":"punctuation","teacher":{"answer":"B","answer_text":"The student's helmet was damaged.","rationale":"Singular possession is shown with apostrophe + s."}},{"id":"W017","standard":"32405","area":"writing","outcome":"2.2","archetype":"comma_list","context":"everyday/school","difficulty":1,"response_type":"multiple_choice","student":{"prompt":"Which sentence uses commas correctly in a list?","options":["Bring a pencil ruler eraser and calculator.","Bring a pencil, ruler, eraser and calculator.","Bring, a pencil ruler eraser and calculator.","Bring a pencil ruler, eraser and, calculator."]},"tags":["CAA","writing","conventions","punctuation"],"estimated_time_seconds":45,"skill":"punctuation","teacher":{"answer":"B","answer_text":"Bring a pencil, ruler, eraser and calculator.","rationale":"Commas separate items in the list."}},{"id":"W018","standard":"32405","area":"writing","outcome":"2.2","archetype":"comma_introductory_clause","context":"everyday/school","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"Which sentence uses the comma correctly?","options":["After the lesson ended we cleaned the benches.","After the lesson, ended we cleaned the benches.","After the lesson ended, we cleaned the benches.","After, the lesson ended we cleaned the benches."]},"tags":["CAA","writing","conventions","punctuation"],"estimated_time_seconds":45,"skill":"punctuation","teacher":{"answer":"C","answer_text":"After the lesson ended, we cleaned the benches.","rationale":"The comma separates the introductory dependent clause from the main clause."}},{"id":"W019","standard":"32405","area":"writing","outcome":"2.2","archetype":"colon_list","context":"everyday/school","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"Which sentence uses a colon correctly?","options":["You need three items: glasses, an apron and closed shoes.","You need: three items glasses, an apron and closed shoes.","You: need three items glasses, an apron and closed shoes.","You need three: items glasses an apron and closed shoes."]},"tags":["CAA","writing","conventions","punctuation"],"estimated_time_seconds":45,"skill":"punctuation","teacher":{"answer":"A","answer_text":"You need three items: glasses, an apron and closed shoes.","rationale":"The colon follows a complete clause and introduces the list."}},{"id":"W020","standard":"32405","area":"writing","outcome":"2.3","archetype":"subject_verb_agreement","context":"everyday/school","difficulty":1,"response_type":"multiple_choice","student":{"prompt":"Choose the sentence with correct subject–verb agreement.","options":["The box of tools are beside the bench.","The box of tools is beside the bench.","The box of tools were beside the bench.","The box of tools be beside the bench."]},"tags":["CAA","writing","conventions","grammar"],"estimated_time_seconds":45,"skill":"grammar","teacher":{"answer":"B","answer_text":"The box of tools is beside the bench.","rationale":"The singular subject 'box' agrees with the singular verb 'is'."}},{"id":"W021","standard":"32405","area":"writing","outcome":"2.3","archetype":"verb_tense","context":"everyday/school","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"Which sentence keeps the verb tense consistent?","options":["Yesterday we measured the board and cut it to length.","Yesterday we measure the board and cut it to length.","Yesterday we measured the board and will cut it to length yesterday.","Yesterday we measuring the board and cut it."]},"tags":["CAA","writing","conventions","grammar"],"estimated_time_seconds":45,"skill":"grammar","teacher":{"answer":"A","answer_text":"Yesterday we measured the board and cut it to length.","rationale":"Both verbs describe completed past actions."}},{"id":"W022","standard":"32405","area":"writing","outcome":"2.3","archetype":"pronoun_reference","context":"everyday/school","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"Which sentence has the clearest pronoun reference?","options":["When Mia spoke to Hana, she was worried.","Mia was worried when she spoke to Hana.","Mia spoke to Hana because she said it.","When she spoke, Hana told Mia she."]},"tags":["CAA","writing","conventions","grammar"],"estimated_time_seconds":45,"skill":"grammar","teacher":{"answer":"B","answer_text":"Mia was worried when she spoke to Hana.","rationale":"It clearly identifies Mia as the person who was worried."}},{"id":"W023","standard":"32405","area":"writing","outcome":"2.4","archetype":"spelling_common_word","context":"everyday/school","difficulty":1,"response_type":"multiple_choice","student":{"prompt":"Which word is spelled correctly?","options":["definately","definitely","definitly","definetely"]},"tags":["CAA","writing","conventions","spelling"],"estimated_time_seconds":45,"skill":"spelling","teacher":{"answer":"B","answer_text":"definitely","rationale":"'Definitely' is the standard spelling."}},{"id":"W024","standard":"32405","area":"writing","outcome":"2.4","archetype":"spelling_context","context":"everyday/school","difficulty":1,"response_type":"multiple_choice","student":{"prompt":"Choose the correct word: 'Please _____ the safety instructions before using the machine.'","options":["reed","read","red","reade"]},"tags":["CAA","writing","conventions","spelling"],"estimated_time_seconds":45,"skill":"spelling","teacher":{"answer":"B","answer_text":"read","rationale":"'Read' is the correct verb in this context."}},{"id":"W025","standard":"32405","area":"writing","outcome":"2.3","archetype":"homophone","context":"everyday/school","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"Which sentence uses 'they’re' and 'their' correctly?","options":["Their going to collect there bags.","They're going to collect their bags.","There going to collect they're bags.","They're going to collect there bags."]},"tags":["CAA","writing","conventions","grammar"],"estimated_time_seconds":45,"skill":"grammar","teacher":{"answer":"B","answer_text":"They're going to collect their bags.","rationale":"'They're' means 'they are' and 'their' shows possession."}},{"id":"W026","standard":"32405","area":"writing","outcome":"1.3","archetype":"formal_register","context":"everyday/school","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"Which sentence is MOST suitable in a formal email to the council?","options":["Hey, the park is kinda wrecked.","The park's pretty stink right now.","I am writing to request improvements to the lighting near the park entrance.","Yo, can you sort the lights?"]},"tags":["CAA","writing","conventions","register"],"estimated_time_seconds":45,"skill":"register","teacher":{"answer":"C","answer_text":"I am writing to request improvements to the lighting near the park entrance.","rationale":"It uses a clear, respectful formal register appropriate to the audience."}},{"id":"W027","standard":"32405","area":"writing","outcome":"1.3","archetype":"audience_language","context":"everyday/school","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"Which opening best suits an article written for new Year 9 students?","options":["Pursuant to institutional transition protocols...","Starting high school can feel busy, so here are three things that can make your first week easier.","Dear Chief Executive Officer,","Once upon a time in a distant kingdom..."]},"tags":["CAA","writing","conventions","register"],"estimated_time_seconds":45,"skill":"register","teacher":{"answer":"B","answer_text":"Starting high school can feel busy, so here are three things that can make your first week easier.","rationale":"It directly addresses the intended audience in accessible language."}},{"id":"W028","standard":"32405","area":"writing","outcome":"2.5","archetype":"coherence_order","context":"everyday/school","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"Which order is clearest for instructions about using a school printer?","options":["Collect printout -> log in -> choose printer -> send file","Log in -> choose printer -> send file -> collect printout","Send file -> collect printout -> log in -> choose printer","Choose printer -> collect printout -> send file -> log in"]},"tags":["CAA","writing","conventions","organisation"],"estimated_time_seconds":45,"skill":"organisation","teacher":{"answer":"B","answer_text":"Log in -> choose printer -> send file -> collect printout","rationale":"The steps follow the logical sequence of the task."}},{"id":"W029","standard":"32405","area":"writing","outcome":"2.5","archetype":"topic_sentence","context":"everyday/school","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"Which is the best topic sentence for a paragraph about the benefits of walking to school?","options":["Walking to school can improve health and reduce short car trips.","My shoes are black.","Some roads have names.","Yesterday was Tuesday."]},"tags":["CAA","writing","conventions","organisation"],"estimated_time_seconds":45,"skill":"organisation","teacher":{"answer":"A","answer_text":"Walking to school can improve health and reduce short car trips.","rationale":"It introduces the paragraph's central idea and gives two directions for development."}},{"id":"W030","standard":"32405","area":"writing","outcome":"2.5","archetype":"remove_irrelevant_detail","context":"everyday/school","difficulty":3,"response_type":"multiple_choice","student":{"prompt":"A paragraph explains how to prepare for a job interview. Which sentence is least relevant?","options":["Research the organisation before the interview.","Plan how you will travel to arrive on time.","Prepare examples of skills you can discuss.","My cousin owns a blue mountain bike."]},"tags":["CAA","writing","conventions","organisation"],"estimated_time_seconds":60,"skill":"organisation","teacher":{"answer":"D","answer_text":"My cousin owns a blue mountain bike.","rationale":"The mountain-bike detail does not support the paragraph's purpose."}},{"id":"W031","standard":"32405","area":"writing","outcome":"2.3","archetype":"active_passive","context":"everyday/school","difficulty":3,"response_type":"multiple_choice","student":{"prompt":"Which sentence is written in the active voice?","options":["The report was completed by Leila.","Leila completed the report.","The report had been completed.","The report was being completed."]},"tags":["CAA","writing","conventions","grammar"],"estimated_time_seconds":60,"skill":"grammar","teacher":{"answer":"B","answer_text":"Leila completed the report.","rationale":"The subject 'Leila' directly performs the action."}},{"id":"W032","standard":"32405","area":"writing","outcome":"2.1","archetype":"compound_sentence","context":"everyday/school","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"Which sentence is compound?","options":["The rain stopped.","Because the rain stopped, we went outside.","The rain stopped, so we went outside.","Stopping after the rain."]},"tags":["CAA","writing","conventions","sentence"],"estimated_time_seconds":45,"skill":"sentence","teacher":{"answer":"C","answer_text":"The rain stopped, so we went outside.","rationale":"It joins two independent clauses using the coordinating conjunction 'so'."}},{"id":"W033","standard":"32405","area":"writing","outcome":"2.2","archetype":"quotation_marks","context":"everyday/school","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"Which sentence punctuates direct speech correctly?","options":["Mia said \"I will bring the tools tomorrow.\"","\"Mia said, I will bring the tools tomorrow.\"","Mia said, \"I will bring the tools tomorrow.\"","Mia \"said, I will bring the tools tomorrow.\""]},"tags":["CAA","writing","conventions","punctuation"],"estimated_time_seconds":45,"skill":"punctuation","teacher":{"answer":"C","answer_text":"Mia said, \"I will bring the tools tomorrow.\"","rationale":"The reporting clause is followed by a comma and the spoken words are enclosed in quotation marks."}},{"id":"W034","standard":"32405","area":"writing","outcome":"2.3","archetype":"word_form","context":"everyday/school","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"Choose the correct word: 'The new layout made the room more _____ for wheelchair users.'","options":["access","accessible","accessing","accessed"]},"tags":["CAA","writing","conventions","grammar"],"estimated_time_seconds":45,"skill":"grammar","teacher":{"answer":"B","answer_text":"accessible","rationale":"The adjective 'accessible' correctly describes the room."}},{"id":"W035","standard":"32405","area":"writing","outcome":"1.3","archetype":"precise_vocabulary","context":"everyday/school","difficulty":3,"response_type":"multiple_choice","student":{"prompt":"Which sentence uses the most precise language?","options":["The machine did a thing.","The machine was bad.","The drill bit slipped because it was not centred on the punch mark.","Stuff went wrong."]},"tags":["CAA","writing","conventions","vocabulary"],"estimated_time_seconds":60,"skill":"vocabulary","teacher":{"answer":"C","answer_text":"The drill bit slipped because it was not centred on the punch mark.","rationale":"It names the specific tool, action and cause."}},{"id":"W036","standard":"32405","area":"writing","outcome":"2.5","archetype":"cohesive_device","context":"everyday/school","difficulty":3,"response_type":"multiple_choice","student":{"prompt":"Choose the best linking word: 'The first trial was unsuccessful. _____, the team changed the design and tested it again.'","options":["However","For example","Meanwhile","Similarly"]},"tags":["CAA","writing","conventions","cohesion"],"estimated_time_seconds":60,"skill":"cohesion","teacher":{"answer":"A","answer_text":"However","rationale":"'However' signals a contrast between the unsuccessful trial and the later change."}},{"id":"W037","standard":"32405","area":"writing","outcome":"2.3","archetype":"agreement_plural","context":"everyday/school","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"Which sentence has correct subject–verb agreement for a plural subject?","options":["The results shows a clear pattern.","The results show a clear pattern.","The results showing a clear pattern.","The results is showing a clear pattern."]},"tags":["CAA","writing","conventions","grammar"],"estimated_time_seconds":45,"skill":"grammar","teacher":{"answer":"B","answer_text":"The results show a clear pattern.","rationale":"The plural subject 'results' agrees with 'show'."}},{"id":"W038","standard":"32405","area":"writing","outcome":"2.2","archetype":"question_mark","context":"everyday/school","difficulty":1,"response_type":"multiple_choice","student":{"prompt":"Which direct question is punctuated correctly?","options":["Where should the bags be stored.","Where should the bags be stored?","Where should the bags be stored!","Where, should the bags be stored."]},"tags":["CAA","writing","conventions","punctuation"],"estimated_time_seconds":45,"skill":"punctuation","teacher":{"answer":"B","answer_text":"Where should the bags be stored?","rationale":"A direct question ends with a question mark."}},{"id":"W039","standard":"32405","area":"writing","outcome":"2.4","archetype":"high_frequency_spelling","context":"everyday/school","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"Which sentence contains no spelling error?","options":["The students recieved the information yesterday.","The students received the information yesterday.","The students receved the infomation yesterday.","The studants received the information yesterday."]},"tags":["CAA","writing","conventions","spelling"],"estimated_time_seconds":45,"skill":"spelling","teacher":{"answer":"B","answer_text":"The students received the information yesterday.","rationale":"'Students', 'received' and 'information' are all spelled correctly."}},{"id":"W040","standard":"32405","area":"writing","outcome":"2.5","archetype":"edit_for_clarity","context":"everyday/school","difficulty":3,"response_type":"multiple_choice","student":{"prompt":"Which revision is clearest? Original: 'The event was good and lots of people came and it was good for the community.'","options":["The event was good, good, and good.","The event attracted many people and gave community members a useful chance to meet and take part.","Lots came. Good community. Event.","The event was community because people were event."]},"tags":["CAA","writing","conventions","editing"],"estimated_time_seconds":60,"skill":"editing","teacher":{"answer":"B","answer_text":"The event attracted many people and gave community members a useful chance to meet and take part.","rationale":"It removes repetition and replaces vague words with specific information."}},{"id":"N001","standard":"32406","area":"numeracy","outcome":"2.1","archetype":"percentage_discount","context":"shopping","difficulty":2,"response_type":"numeric_entry","student":{"prompt":"A jacket normally costs $80 and is discounted by 15%. What is the sale price?","units":"dollars"},"tags":["CAA","numeracy","number","percentage","money"],"estimated_time_seconds":75,"strand":"Number","skill":"percentage_discount","caa_moves":["use"],"teacher":{"answer":68.0,"answer_text":"68.0","tolerance":0.001,"rationale":"A 15% discount is $12, so $80 - $12 = $68."}},{"id":"N002","standard":"32406","area":"numeracy","outcome":"3.1","archetype":"evaluate_percentage_claim","context":"shopping","difficulty":3,"response_type":"multiple_choice","student":{"prompt":"A shop reduces a $120 pair of shoes to $90 and advertises '25% off'. Is the claim correct?","options":["Yes, because the reduction is $30 and $30 is 25% of $120.","Yes, because $90 is 25% of $120.","No, because the reduction is only 20%.","No, because all discounts must be 50%."]},"tags":["CAA","numeracy","number","percentage","money","claim"],"estimated_time_seconds":105,"strand":"Number","skill":"evaluate_percentage_claim","caa_moves":["formulate","use","explain"],"teacher":{"answer":"A","answer_text":"Yes, because the reduction is $30 and $30 is 25% of $120.","rationale":"The reduction is $30. $30 ÷ $120 = 0.25 = 25%, so the claim is correct."}},{"id":"N003","standard":"32406","area":"numeracy","outcome":"2.1","archetype":"rate_unit_price","context":"shopping","difficulty":2,"response_type":"numeric_entry","student":{"prompt":"Rice costs $9.60 for a 3 kg bag. What is the cost per kilogram?","units":"dollars_per_kg"},"tags":["CAA","numeracy","number","rate","money"],"estimated_time_seconds":75,"strand":"Number","skill":"rate_unit_price","caa_moves":["use"],"teacher":{"answer":3.2,"answer_text":"3.2","tolerance":0.001,"rationale":"$9.60 ÷ 3 = $3.20 per kg."}},{"id":"N004","standard":"32406","area":"numeracy","outcome":"1.1","archetype":"select_operation","context":"food","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"A recipe for 4 people uses 300 g of pasta. You are cooking for 10 people. Which calculation is most appropriate?","options":["300 × (10 ÷ 4)","300 + 10 + 4","300 ÷ 10","300 - 4"]},"tags":["CAA","numeracy","number","ratio","proportion"],"estimated_time_seconds":75,"strand":"Number","skill":"select_operation","caa_moves":["formulate"],"teacher":{"answer":"A","answer_text":"300 × (10 ÷ 4)","rationale":"The quantity must be scaled by the factor 10/4."}},{"id":"N005","standard":"32406","area":"numeracy","outcome":"2.1","archetype":"fraction_of_quantity","context":"school","difficulty":2,"response_type":"numeric_entry","student":{"prompt":"Three-eighths of 240 students travel to school by bus. How many students is this?","units":"students"},"tags":["CAA","numeracy","number","fractions"],"estimated_time_seconds":75,"strand":"Number","skill":"fraction_of_quantity","caa_moves":["use"],"teacher":{"answer":90,"answer_text":"90","tolerance":0.001,"rationale":"240 ÷ 8 = 30, then 30 × 3 = 90."}},{"id":"N006","standard":"32406","area":"numeracy","outcome":"3.1","archetype":"reasonableness_money","context":"event","difficulty":3,"response_type":"short_text","student":{"prompt":"A student calculates that 18 tickets at $7.50 each will raise $1,350. Explain whether this answer is reasonable and give the correct total."},"tags":["CAA","numeracy","number","money","reasonableness"],"estimated_time_seconds":120,"strand":"Number","skill":"reasonableness_money","caa_moves":["use","explain"],"teacher":{"rationale":"18 × $7.50 = $135. $1,350 is ten times too large, so it is not reasonable.","marking_guide":{"expected_evidence":"18 × $7.50 = $135. $1,350 is ten times too large, so it is not reasonable.","accept":"Equivalent mathematically correct reasoning expressed clearly in words, calculations, or both.","focus":"The explanation must connect the mathematics/statistics to the situation rather than give an unsupported answer."}}},{"id":"N007","standard":"32406","area":"numeracy","outcome":"2.1","archetype":"decimal_total","context":"shopping","difficulty":1,"response_type":"numeric_entry","student":{"prompt":"You buy a drink for $3.80 and a sandwich for $6.45. What is the total cost?","units":"dollars"},"tags":["CAA","numeracy","number","decimals","money"],"estimated_time_seconds":75,"strand":"Number","skill":"decimal_total","caa_moves":["use"],"teacher":{"answer":10.25,"answer_text":"10.25","tolerance":0.001,"rationale":"$3.80 + $6.45 = $10.25."}},{"id":"N008","standard":"32406","area":"numeracy","outcome":"2.1","archetype":"ratio_scale","context":"mixture","difficulty":3,"response_type":"numeric_entry","student":{"prompt":"A cleaning mixture uses 1 part concentrate to 4 parts water. If 600 mL of concentrate is used, how much water is needed?","units":"mL"},"tags":["CAA","numeracy","number","ratio"],"estimated_time_seconds":105,"strand":"Number","skill":"ratio_scale","caa_moves":["use"],"teacher":{"answer":2400,"answer_text":"2400","tolerance":0.001,"rationale":"There are 4 parts water for each 1 part concentrate: 600 × 4 = 2400 mL."}},{"id":"N009","standard":"32406","area":"numeracy","outcome":"1.1","archetype":"choose_best_buy","context":"shopping","difficulty":3,"response_type":"multiple_choice","student":{"prompt":"Which pack has the lowest cost per can?","options":["6 cans for $9.00","8 cans for $11.20","10 cans for $15.00","12 cans for $18.60"]},"tags":["CAA","numeracy","number","unit_rate","money"],"estimated_time_seconds":105,"strand":"Number","skill":"choose_best_buy","caa_moves":["formulate","use"],"teacher":{"answer":"B","answer_text":"8 cans for $11.20","rationale":"Unit prices are $1.50, $1.40, $1.50 and $1.55. The 8-pack is cheapest per can."}},{"id":"N010","standard":"32406","area":"numeracy","outcome":"3.1","archetype":"percentage_interpretation","context":"school","difficulty":3,"response_type":"short_text","student":{"prompt":"A survey found that 72% of 200 students support a change. A student says, 'That means exactly 72 students support it.' Explain the error and state how many students 72% represents."},"tags":["CAA","numeracy","number","percentage","interpretation"],"estimated_time_seconds":120,"strand":"Number","skill":"percentage_interpretation","caa_moves":["use","explain"],"teacher":{"rationale":"72% means 72 per 100, not 72 students out of 200. 0.72 × 200 = 144 students.","marking_guide":{"expected_evidence":"72% means 72 per 100, not 72 students out of 200. 0.72 × 200 = 144 students.","accept":"Equivalent mathematically correct reasoning expressed clearly in words, calculations, or both.","focus":"The explanation must connect the mathematics/statistics to the situation rather than give an unsupported answer."}}},{"id":"N011","standard":"32406","area":"numeracy","outcome":"2.1","archetype":"linear_rule","context":"transport","difficulty":2,"response_type":"numeric_entry","student":{"prompt":"A shuttle charges a $4 booking fee plus $2.50 per kilometre. What is the cost of a 6 km trip?","units":"dollars"},"tags":["CAA","numeracy","algebra","linear_relationship","money"],"estimated_time_seconds":75,"strand":"Algebra","skill":"linear_rule","caa_moves":["use"],"teacher":{"answer":19.0,"answer_text":"19.0","tolerance":0.001,"rationale":"$4 + (6 × $2.50) = $19."}},{"id":"N012","standard":"32406","area":"numeracy","outcome":"1.1","archetype":"identify_rule","context":"pattern","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"A table shows x: 1,2,3,4 and y: 5,8,11,14. Which rule matches the table?","options":["y = x + 4","y = 3x + 2","y = 5x","y = 2x + 3"]},"tags":["CAA","numeracy","algebra","table","linear_relationship"],"estimated_time_seconds":75,"strand":"Algebra","skill":"identify_rule","caa_moves":["formulate"],"teacher":{"answer":"B","answer_text":"y = 3x + 2","rationale":"Each time x increases by 1, y increases by 3, and y = 3(1)+2 = 5."}},{"id":"N013","standard":"32406","area":"numeracy","outcome":"2.1","archetype":"solve_simple_equation","context":"event","difficulty":2,"response_type":"numeric_entry","student":{"prompt":"A group pays $84 in total for 7 identical tickets. What is the price of one ticket?","units":"dollars"},"tags":["CAA","numeracy","algebra","inverse_operation"],"estimated_time_seconds":75,"strand":"Algebra","skill":"solve_simple_equation","caa_moves":["use"],"teacher":{"answer":12,"answer_text":"12","tolerance":0.001,"rationale":"84 ÷ 7 = 12."}},{"id":"N014","standard":"32406","area":"numeracy","outcome":"3.1","archetype":"compare_linear_plans","context":"mobile_data","difficulty":4,"response_type":"short_text","student":{"prompt":"Plan A costs $15 plus $4 per extra data pack. Plan B costs $27 plus $2 per extra data pack. For 4 extra packs, which plan is cheaper, and by how much?"},"tags":["CAA","numeracy","algebra","linear_relationship","compare"],"estimated_time_seconds":120,"strand":"Algebra","skill":"compare_linear_plans","caa_moves":["formulate","use","explain"],"teacher":{"rationale":"Plan A = 15 + 4×4 = $31. Plan B = 27 + 2×4 = $35. Plan A is cheaper by $4.","marking_guide":{"expected_evidence":"Plan A = 15 + 4×4 = $31. Plan B = 27 + 2×4 = $35. Plan A is cheaper by $4.","accept":"Equivalent mathematically correct reasoning expressed clearly in words, calculations, or both.","focus":"The explanation must connect the mathematics/statistics to the situation rather than give an unsupported answer."}}},{"id":"N015","standard":"32406","area":"numeracy","outcome":"2.1","archetype":"substitute_formula","context":"fitness","difficulty":2,"response_type":"numeric_entry","student":{"prompt":"A walking challenge gives 5 points for every kilometre plus a 10-point daily bonus. How many points are earned for 7 km?","units":"points"},"tags":["CAA","numeracy","algebra","formula"],"estimated_time_seconds":75,"strand":"Algebra","skill":"substitute_formula","caa_moves":["use"],"teacher":{"answer":45,"answer_text":"45","tolerance":0.001,"rationale":"5 × 7 + 10 = 45."}},{"id":"N016","standard":"32406","area":"numeracy","outcome":"1.1","archetype":"recognise_variable","context":"shopping","difficulty":2,"response_type":"multiple_choice","student":{"prompt":"A fruit shop charges $4.50 per kg for apples. In the expression 4.5w, what does w represent?","options":["The cost per kilogram","The weight of apples in kilograms","The number of staff","The change received"]},"tags":["CAA","numeracy","algebra","variable"],"estimated_time_seconds":75,"strand":"Algebra","skill":"recognise_variable","caa_moves":["formulate"],"teacher":{"answer":"B","answer_text":"The weight of apples in kilograms","rationale":"The variable multiplied by the unit rate represents the number of kilograms bought."}},{"id":"N017","standard":"32406","area":"numeracy","outcome":"2.1","archetype":"continue_pattern","context":"design","difficulty":1,"response_type":"numeric_entry","student":{"prompt":"A tile pattern uses 6 tiles in row 1, 10 in row 2, 14 in row 3 and 18 in row 4. How many tiles are in row 6 if the pattern continues?","units":"tiles"},"tags":["CAA","numeracy","algebra","pattern"],"estimated_time_seconds":75,"strand":"Algebra","skill":"continue_pattern","caa_moves":["use"],"teacher":{"answer":26,"answer_text":"26","tolerance":0.001,"rationale":"The pattern increases by 4 each row: row 5 = 22, row 6 = 26."}},{"id":"N018","standard":"32406","area":"numeracy","outcome":"3.1","archetype":"interpret_graph_rule","context":"water","difficulty":3,"response_type":"multiple_choice","student":{"prompt":"A tank starts with 50 L of water and fills at 8 L per minute. Which statement correctly describes the relationship?","options":["The amount starts at 8 L and rises by 50 L each minute.","The amount starts at 50 L and rises by 8 L each minute.","The amount stays at 50 L.","The amount falls by 8 L each minute."]},"tags":["C  if(unit==="dollars")return "Enter an amount in dollars.";
 if(unit==="dollars_per_kg")return "Enter dollars per kilogram.";
 if(unit==="percent")return "Enter a percentage.";
 if(unit==="week")return "Enter the week number.";
 return `Unit: ${formatUnits(unit)}`;
}
function attachDraftListeners(q,aq){

 const text=document.getElementById("textAnswer");if(text)text.addEventListener("input",e=>{state.activeQuestion.response=e.target.value;saveState();});
 if(q.response_type==="extended_response"){
  const key=q.baseSource||q.id;if(!state.drafts[key])state.drafts[key]={plan1:"",plan2:"",plan3:"",text:"",checks:[]};
  document.querySelectorAll("[data-draft]").forEach(el=>el.addEventListener("input",e=>{state.drafts[key][e.target.dataset.draft]=e.target.value;if(e.target.dataset.draft==="text")document.getElementById("wordCount").textContent=countWords(e.target.value)+" words";saveState();}));

function renderFeedback(q,aq){
 if(!aq.result)return"";const r=aq.result,cls=r.correct?"correct":"notyet";let extra="";
 if(!r.correct){const misses=state.missedSkills[skillGroup(q)]||1;extra=`<p><strong>Hint:</strong> ${esc(clueFor(q))}</p>${misses>=3?`<div class="answer-reveal"><strong>Worked example:</strong> ${esc(workedExample(q))}</div>`:""}`;}
 return `<section class="feedback ${cls}" aria-live="polite"><h3>${r.correct?"Correct — strong thinking.":"Not yet."}</h3><p>${esc(r.message)}</p>${r.answerText?`<div class="answer-reveal"><strong>Best answer:</strong> ${esc(r.answerText)}</div>`:""}${extra}<div class="button-row" style="margin-top:14px"><button class="btn ${r.correct?"btn-green":"btn-orange"}" data-action="next-question">${r.correct?"Next challenge":"Fresh question, same skill"} →</button>${!r.correct?`<button class="btn btn-secondary" data-action="read-feedback">🔊 Read feedback</button>`:""}</div></section>`;
}
function easyText(text){
 const replacements=[[/Which statement best (summarises|captures)/gi,"Which answer gives the main message of"],[/Which detail gives the STRONGEST reason/gi,"Which detail is the best reason"],[/Which information is most useful/gi,"Which detail helps the most"],[/approximately/gi,"about"],[/appropriate/gi,"suitable"],[/determine/gi,"work out"],[/evaluate/gi,"judge"],[/relevant/gi,"useful for this task"],[/credibility/gi,"trustworthiness"],[/reliability/gi,"how dependable it is"],[/interpret/gi,"explain the meaning of"],[/communicate/gi,"share"],[/sufficient/gi,"enough"],[/constructed response/gi,"written answer"],[/Which calculation is most appropriate/gi,"Which maths should you use"],[/Explain whether/gi,"Say if"],[/justify/gi,"give evidence for"]];
 let out=String(text);for(const[r,v]of replacements)out=out.replace(r,v);return out;
}
function clueFor(q){
 if(q.area==="decoder")return"Look for the action word and decide whether the prompt asks you to find, write, calculate or explain.";
 if(q.area==="mistake")return"Good feedback names the misunderstanding and shows a better reasoning step.";
 if(q.standard==="32403"){
  if(q.outcome==="1.1")return"Return to the exact sentence or clues that support the answer.";
  if(q.outcome==="1.2")return"Ask what the heading, structure or language feature helps the reader notice.";
  if(q.outcome==="1.3")return"Read the words before and after the unfamiliar term.";
  if(q.outcome==="2.1")return"Ask who the text is for and what the writer wants the reader to think or do.";
  if(q.outcome==="2.2")return"Check the source, evidence, expertise and possible commercial interest.";
  return"Use the reader's stated purpose to decide which information matters.";
 }
 if(q.standard==="32405"){
  if(q.response_type==="sequence")return"Start with the opening, develop the main content, and finish in a way that suits the text form.";
  if(q.outcome==="1.1")return"Underline the form, audience, purpose and every required content point.";
  if(q.outcome==="1.3")return"Choose language that sounds right for the intended reader.";
  return"Read the whole sentence aloud and check one convention at a time.";
 }
 const a=(q.archetype||"").toLowerCase();
 if(a.includes("percentage"))return"Identify the whole, then find or compare the part out of 100.";
 if(a.includes("rate"))return"Look for 'per', 'each' or 'for one' and compare like units.";
 if(a.includes("scale"))return"Write what one unit on the drawing represents in real life.";
 if(a.includes("area"))return"Area measures a surface and uses square units.";
 if(a.includes("probability"))return"Convert both chances into the same form before comparing.";
 if(a.includes("mean"))return"Add all values, then divide by how many values there are.";
 if(a.includes("median"))return"Order the values and find the middle.";
 return"List the useful information, choose a method, calculate, then sense-check the units and size.";
}
function workedExample(q){
 if(q.standard==="32403")return"If a notice says the final entry is 1:30 pm and a person arrives at 1:40 pm, the time detail is the strongest evidence that they may be too late.";
 if(q.standard==="32405")return"For a council email: use a respectful greeting, state the problem, propose a realistic change, support it with reasons, then close politely.";
 return"A $60 item reduced by 10% has a $6 discount, so the new price is $54. A quick estimate confirms the answer should be slightly below $60.";
}

function submitAnswer(){
 const aq=state.activeQuestion,q=resolveActiveQuestion();if(!aq||aq.result)return;
 let correct=false,message="",answerText="";
 if(q.response_type==="multiple_choice"){
  if(aq.selected===null){toast("Choose an answer first.");return;}
  const correctIndex=q.teacher.answer.charCodeAt(0)-65;correct=aq.selected===correctIndex;answerText=q.teacher.answer_text;message=q.teacher.rationale||"Check the information and reasoning.";
 }else if(q.response_type==="numeric_entry"){
  const val=parseFloat(String(aq.response).replace(/[$,%\s]/g,""));if(Number.isNaN(val)){toast("Enter a number first.");return;}
  const target=Number(q.teacher.answer),tol=Number(q.teacher.tolerance??.001);correct=Math.abs(val-target)<=tol;answerText=numericAnswerText(q);message=q.teacher.rationale;
 }else if(q.response_type==="sequence"){
  correct=JSON.stringify(aq.sequenceOrder)===JSON.stringify(q.teacher.correctOrder);answerText=q.teacher.correctOrder.join(" → ");message=q.teacher.rationale;
 }
 finaliseQuestion(correct,message,answerText);
}

function submitWritingCheck(){
 const q=resolveActiveQuestion(),key=q.baseSource||q.id,d=state.drafts[key]||{text:"",checks:[]};const words=countWords(d.text),checks=(d.checks||[]).length;
 if(words<60){toast("Add a little more development before completing the self-check (aim for at least 60 words).");return;}
