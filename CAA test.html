function finaliseQuestion(correct,message,answerText=""){
 const aq=state.activeQuestion,q=resolveActiveQuestion(),zone=zoneById(aq.zoneId),stats=getZoneStats(aq.zoneId),skill=skillGroup(q);
 aq.attempts++;aq.result={correct,message,answerText};stats.attempts++;
 if(!state.skills[skill])state.skills[skill]={attempts:0,correct:0};state.skills[skill].attempts++;
 if(correct){
  stats.correct++;state.skills[skill].correct++;aq.assistanceOpened?stats.supported++:stats.independent++;state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);if(state.settings.xp)state.xp+=aq.assistanceOpened?8:10;playSound("success");
  if((state.missedSkills[skill]||0)>0){state.missedSkills[skill]=Math.max(0,state.missedSkills[skill]-1);awardBadge("keep-thinking");}
  checkBadgesAndCertificates(zone.id);
 }else{
  stats.incorrect++;stats.recentErrors++;state.streak=0;state.missedSkills[skill]=(state.missedSkills[skill]||0)+1;if(state.settings.xp)state.xp+=2;playSound("soft");
 }
 if(state.currentRun){state.currentRun.completed++;state.currentRun.results.push({zoneId:zone.id,skill,correct,supported:aq.assistanceOpened,questionId:aq.baseId});state.currentRun.nextPreference={skill:questionSkill(q),outcome:q.outcome,strand:q.strand,standard:q.standard,zoneId:zone.id,wasWrong:!correct};}
 saveState();renderPractice();
}
function skipQuestion(){

 if(state.currentRun){state.currentRun.completed++;state.currentRun.results.push({zoneId:state.activeQuestion.zoneId,skill,correct:false,skipped:true});state.currentRun.nextPreference={skill:questionSkill(q),outcome:q.outcome,strand:q.strand,standard:q.standard,zoneId:state.activeQuestion.zoneId,wasWrong:true};}

function nextQuestion(){
 const run=state.currentRun,aq=state.activeQuestion,pref=run?.nextPreference;if(!run){showScreen("zones");return;}
 if(!run.endless&&run.completed>=run.target){state.activeQuestion=null;showScreen("run-summary");return;}
 let zoneId=aq.zoneId;
 if(pref?.wasWrong)zoneId=pref.zoneId;
 else if(run.kind==="mixed")zoneId=randomEnabledZone(run.subject);
 else if(run.kind==="guided")zoneId=run.queue[run.completed%run.queue.length];
 else if(run.kind==="missed"){const skill=run.missed[run.completed%run.missed.length];zoneId=zoneForSkill(skill);}
 else zoneId=run.zoneId;
 const subjectPreference=run.subject?{standard:subjectInfo(run.subject).standard}:null;
 run.nextPreference=null;launchQuestion(zoneId,run.kind,pref?.wasWrong?pref:subjectPreference);
}

 const readCritical=getZoneStats("read-critical").correct;if(readCritical>=5)awardBadge("analyst");
 const write=getZoneStats("write-purpose").correct+getZoneStats("write-accuracy").correct;if(write>=5)awardBadge("communicator");

 const s=getZoneStats(zoneId);
 if(s.correct>=state.settings.checksRequired&&!state.certificates[zoneId]){state.certificates[zoneId]={zoneId,date:new Date().toISOString(),successful:s.correct,independent:s.independent,supported:s.supported,assists:s.assists,skills:zoneById(zoneId).skills};playSound("badge");celebrate();toast(`${zoneById(zoneId).title} certificate earned!`);}
 const certCount=Object.keys(state.certificates).length;if(certCount>=3)awardBadge("skill-builder");

}

function vocabCards(list){return list.map(v=>`<article class="vocab-card card"><span class="pill">${esc(v.area)}</span><h3>${esc(v.term)}</h3><p>${esc(v.definition)}</p><dl><dt>Simpler</dt><dd>${esc(v.simple)}</dd><dt>Example</dt><dd>${esc(v.example)}</dd><dt>Non-example</dt><dd>${esc(v.nonExample)}</dd><dt>Related</dt><dd>${esc(v.related)}</dd></dl><button class="btn btn-secondary" style="margin-top:13px" data-speak-vocab="${VOCAB.indexOf(v)}">🔊 Read this to me</button></article>`).join("");}
function startVocabRun(mode,count,missedOnly=false){
 let pool=missedOnly?VOCAB.filter(v=>state.vocab.missed.includes(v.term)):VOCAB;if(!pool.length)pool=VOCAB;
 const actual=count==="all"?pool.length:Math.min(Number(count)||10,pool.length);const queue=shuffle(pool).slice(0,actual).map((v,i)=>makeVocabQuestion(v,i));
 state.vocabRun={mode,queue,index:0,correct:0,results:[],missed:[]};showScreen("vocab-run");
}
function makeVocabQuestion(v,i){
 const others=shuffle(VOCAB.filter(x=>x.term!==v.term));const type=i%5;let prompt,options,correct;
 if(type===0){prompt=`Which definition best matches “${v.term}”?`;correct=v.definition;options=shuffle([correct,...others.slice(0,3).map(x=>x.definition)]);}
 else if(type===1){prompt=`Which word matches this definition?\n\n${v.definition}`;correct=v.term;options=shuffle([correct,...others.slice(0,3).map(x=>x.term)]);}
 else if(type===2){prompt=`Which example best shows “${v.term}”?`;correct=v.example;options=shuffle([correct,...others.slice(0,3).map(x=>x.nonExample)]);}
 else if(type===3){prompt=`Which statement is NOT an example of “${v.term}”?`;correct=v.nonExample;options=shuffle([correct,v.example,v.context,`A correct use connected to ${v.related}.`]);}
 else{prompt=`Which sentence uses “${v.term}” most accurately?`;correct=v.context;options=shuffle([correct,...others.slice(0,3).map(x=>x.context)]);}
 return {term:v.term,area:v.area,prompt,options,correct,selected:null,result:null};
}

function startRapid(seconds,subject=null){
 const standard=subject?subjectInfo(subject).standard:null;
 const candidates=shuffle(BANK.items.filter(q=>q.response_type==="multiple_choice"&&q.difficulty<=Math.min(2,state.settings.maxDifficulty)&&(!standard||q.standard===standard))).slice(0,60);
 if(!candidates.length){toast(`No ${subject||"Rapid Fire"} questions are available with the current difficulty settings.`);return;}
 if(subject)state.selectedSubject=subject;
 state.rapid={seconds,remaining:seconds,paused:false,index:0,correct:0,completed:0,queue:candidates.map(q=>q.id),selected:null,result:null,startedAt:Date.now(),subject:subject||null};showScreen("rapid");
}
function renderRapid(){
 const r=state.rapid;if(!r){showScreen("hub");return;}

 main.innerHTML=`<section class="screen-title"><div><span class="eyebrow">Rapid Fire • ${esc(area)}</span><h1>${r.seconds?`${r.remaining} seconds remaining`:"Untimed rapid practice"}</h1><p>Brief retrieval only. Pause whenever you need more thinking time. Required Reading source texts remain visible.</p></div><div class="button-row"><button class="btn btn-secondary" data-action="pause-rapid">${r.paused?"▶ Resume":"⏸ Pause"}</button><button class="btn btn-ghost" data-action="end-rapid">End session</button></div></section><section class="question-card card"><div class="question-body"><span class="pill">${esc(areaLabel(q))}</span>${renderStimulus(q,true)}<div class="prompt">${esc(q.student.prompt)}</div><div class="option-list">${q.student.options.map((o,i)=>`<button class="option-btn" data-rapid-option="${i}" aria-pressed="${r.selected===i}" ${r.paused?"disabled":""}><span class="option-letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join("")}</div>${r.result?`<div class="feedback ${r.result.correct?"correct":"notyet"}"><h3>${r.result.correct?"Correct.":"Not yet."}</h3><p>${esc(q.teacher.rationale)}</p><button class="btn btn-primary" data-action="next-rapid">Next →</button></div>`:`<button class="btn btn-primary" data-action="submit-rapid" ${r.selected===null||r.paused?"disabled":""}>Check</button>`}</div></section>`;
 if(r.seconds>0&&!r.paused&&!r.result){rapidTimer=setInterval(()=>{r.remaining--;if(r.remaining<=0){clearInterval(rapidTimer);renderRapid();}else{const h=main.querySelector(".screen-title h1");if(h)h.textContent=`${r.remaining} seconds remaining`;saveState();}},1000);}
}

function generatePaperTest(){
 const settings={
  title:document.getElementById("testTitle").value.trim()||"CAA Practice Test",
  count:Number(document.getElementById("testCount").value),mix:document.getElementById("testMix").value,difficulty:Number(document.getElementById("testDifficulty").value),
  zones:[...document.querySelectorAll("[data-test-zone]:checked")].map(x=>x.dataset.testZone),columns:Number(document.getElementById("testColumns").value),orientation:document.getElementById("testOrientation").value,
  marks:document.getElementById("testMarks").checked,wordBank:document.getElementById("testWordBank").checked,refs:document.getElementById("testRefs").checked,answerKey:document.getElementById("testKey").checked
 };
 if(!settings.zones.length&&settings.mix!=="vocab"){toast("Select at least one learning zone.");return;}
 let generated=[];
 if(settings.mix!=="vocab"){
  let pool=[];
  for(const zid of settings.zones){const z=zoneById(zid);pool.push(...BANK.items.filter(q=>z.filter?.(q)&&q.difficulty<=settings.difficulty&&["multiple_choice","numeric_entry","short_text"].includes(q.response_type)));}
  if(settings.mix==="scenarios")pool=pool.filter(q=>q.difficulty>=2||q.context);
  pool=shuffle([...new Map(pool.map(q=>[q.id,q])).values()]);
  generated.push(...pool.slice(0,settings.mix==="balanced"?Math.ceil(settings.count*.75):settings.count).map(q=>({kind:"bank",id:q.id,zoneId:settings.zones.find(id=>zoneById(id).filter(q))})));
 }
 if(settings.mix==="vocab"||settings.mix==="balanced"){
  const needed=settings.count-generated.length;generated.push(...shuffle(VOCAB).slice(0,needed).map((v,i)=>({kind:"vocab",question:makeVocabQuestion(v,i)})));
 }
 generated=shuffle(generated).slice(0,settings.count);state.lastTest={settings,items:generated,created:new Date().toISOString()};state.lastTestSettings=settings;saveState();previewTest();
}
function previewTest(){
 const t=state.lastTest;if(!t){toast("Generate a test first.");return;}

}
function paperStimulusHTML(q){
 const sid=stimulusIdFor(q);if(!sid)return"";const s=STIMULUS_MAP[sid];if(!s)return"";
 const body=s.text?esc(s.text):s.texts.map(t=>`<strong>${esc(t.label)}</strong>${esc(t.text)}`).join("<br><br>");
 return `<div class="paper-stimulus"><strong>Required reading — ${esc(s.title)}</strong>${body}</div>`;
}
function paperStimulusReferenceHTML(q,answerMode=false){
 const sid=stimulusIdFor(q),s=STIMULUS_MAP[sid];if(!s)return"";
 return `<div class="paper-source-ref"><strong>${answerMode?"Source":"Use the required reading above"}:</strong> ${esc(s.title)}</div>`;
}
function paperQuestion(item,n,answerMode=false,settings={},stimulusMode="full"){
 if(item.kind==="vocab"){
  const q=item.question,ans=q.correct;
  return `<section class="paper-question"><h3>${n}. ${esc(q.prompt)} ${settings.marks?"[1]":""}</h3>${answerMode?`<p><strong>Answer:</strong> ${esc(ans)}<br><em>Marking note:</em> Award for the option matching the term accurately.</p>`:`<div class="paper-options">${q.options.map((o,i)=>`<div>${String.fromCharCode(65+i)}. ${esc(o)}</div>`).join("")}</div>`}</section>`;
 }
 const q=ITEM_MAP[item.id],zone=zoneById(item.zoneId);let body="";
 const source=q.standard==="32403"?(stimulusMode==="full"?paperStimulusHTML(q):paperStimulusReferenceHTML(q,answerMode)):"";
 if(answerMode){
  const answer=q.response_type==="numeric_entry"?numericAnswerText(q):(q.teacher?.answer_text??q.teacher?.answer??q.teacher?.marking_guide?.expected_evidence??"See marking note");
  const markNote=q.teacher?.rationale??q.teacher?.marking_guide?.expected_evidence??q.teacher?.marking_guide?.content??"Accept an equivalent response that uses relevant evidence and clear reasoning.";
  body=`<p><strong>Answer:</strong> ${esc(answer)}</p><p><em>Marking note:</em> ${esc(markNote)}</p>${settings.refs?`<p><small>Learning zone: ${esc(zone?.title||areaLabel(q))}</small></p>`:""}`;
 }
 else if(q.response_type==="multiple_choice")body=`<div class="paper-options">${q.student.options.map((o,i)=>`<div>${String.fromCharCode(65+i)}. ${esc(o)}</div>`).join("")}</div>`;
 else if(q.response_type==="numeric_entry")body=`<div class="answer-space"></div><small>${esc(numericUnitInstruction(q))}</small>`;
 else body=`<div class="answer-space large"></div>`;
 return `<section class="paper-question">${source}<h3>${n}. ${esc(q.student.prompt)} ${settings.marks?`[${q.response_type==="short_text"?2:1}]`:""}</h3>${body}</section>`;
}
function renderPaperItems(t,answerMode=false){
 const seenSources=new Set();
 return t.items.map((item,i)=>{
  let mode="none";
  if(item.kind==="bank"){
   const q=ITEM_MAP[item.id];
   if(q?.standard==="32403"){
    const sid=stimulusIdFor(q);
    if(!answerMode&&!seenSources.has(sid)){mode="full";seenSources.add(sid);}else mode="reference";
   }
  }
  return paperQuestion(item,i+1,answerMode,t.settings,mode);
 }).join("");
}
function buildStudentTestHTML(t){
 const s=t.settings,wordBank=s.wordBank?`<div style="border:1px solid #333;padding:8px;margin:12px 0"><strong>Word bank:</strong> ${shuffle(VOCAB.map(v=>v.term)).slice(0,12).join(" • ")}</div>`:"";
 return `<div class="test-page"><h1>${esc(s.title)}</h1><p style="text-align:center">Practice only — not an official qualification, grade or assessment.</p><div class="test-fields"><div>Name<div class="test-line"></div></div><div>Class<div class="test-line"></div></div><div>Date<div class="test-line"></div></div></div><p><strong>Instructions:</strong> Read each situation carefully. For Reading questions, use the required source text shown with the first question from that text. Show working for Numeracy and use evidence where an explanation is requested.</p>${wordBank}<div class="${s.columns===2?"two-column":""}">${renderPaperItems(t,false)}</div></div>`;
}
function buildAnswerKeyHTML(t){const s=t.settings;return `<div class="test-page"><h1>${esc(s.title)} — Answer Key</h1><p>Brief marking notes are provided for practice checking.</p>${renderPaperItems(t,true)}</div>`;}
function printDocument(title,content,orientation="portrait"){
 const w=window.open("","_blank");
 const css=`@page{size:A4 ${orientation};margin:12mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#000;background:#fff;margin:0;line-height:1.38}.toolbar{position:sticky;top:0;background:#eee;padding:10px;border-bottom:1px solid #aaa;display:flex;gap:8px}.toolbar button{padding:8px 12px}.page{padding:0}.test-page h1{text-align:center;margin:0 0 5px}.test-fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin:14px 0}.test-line{border-bottom:1px solid #333;height:25px}.paper-question{break-inside:avoid;margin:0 0 15px}.paper-question h3{font-size:1rem;margin:0 0 6px}.paper-stimulus{border:1px solid #666;padding:8px 10px;margin:0 0 8px;background:#fafafa;white-space:pre-line;line-height:1.38;font-size:.92rem}.paper-stimulus strong{display:block;margin-bottom:4px}.paper-options{display:grid;gap:3px;margin-left:12px}.answer-space{height:42px;border-bottom:1px solid #aaa}.answer-space.large{height:82px}.two-column{columns:2;column-gap:26px}.two-column .paper-question{display:inline-block;width:100%}.certificate{border:8px double #163b50;padding:18mm;text-align:center;min-height:175mm;display:flex;flex-direction:column;justify-content:center}.certificate h1{font-size:34px;margin:8px}.certificate .name{font-size:30px;border-bottom:2px solid #333;margin:18px auto;padding:4px 25px}.cert-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px}.cert-box{border:1px solid #777;padding:10px}@media print{.toolbar{display:none}.page{padding:0}}`;
 const doc=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>${css}</style></head><body><div class="toolbar"><button onclick="window.print()">Print or Save as PDF</button><button onclick="window.close()">Close</button></div><main class="page">${content}</main><script>window.addEventListener('load',()=>setTimeout(()=>window.print(),350));<\/script></body></html>`;
 if(w){w.document.open();w.document.write(doc);w.document.close();}else{showPrintFallback(title,content,orientation);}
}
function showPrintFallback(title,content,orientation){
 const box=document.getElementById("printFallback");box.innerHTML=`<div class="no-print button-row"><button class="btn btn-primary" id="fallbackPrintBtn">Print this preview</button><button class="btn btn-secondary" id="fallbackCloseBtn">Return to activity</button></div><h1>${esc(title)}</h1>${content}`;
 document.body.classList.add("print-fallback");box.style.display="block";
 document.getElementById("fallbackPrintBtn").onclick=()=>window.print();document.getElementById("fallbackCloseBtn").onclick=()=>{document.body.classList.remove("print-fallback");box.style.display="none";box.innerHTML="";};
 toast("The new print window was blocked. A same-page print preview is open instead.");
}
function certificateHTML(id){
 if(id==="vocabulary"){
  const c=state.vocab.certificate;return `<section class="certificate"><h2>CAA Skills Quest</h2><h1>Vocabulary Practice Certificate</h1><p>This recognises successful vocabulary practice by</p><div class="name">${esc(state.profile.name||"Learner")}</div><p>Class: ${esc(state.profile.className||"—")}</p><div class="cert-grid"><div class="cert-box"><strong>${c.score}%</strong><br>score</div><div class="cert-box"><strong>${c.count}</strong><br>questions</div><div class="cert-box"><strong>${new Date(c.date).toLocaleDateString("en-NZ")}</strong><br>date earned</div></div><p>Support and repeated practice are learning tools. This certificate is not an official grade, qualification or credit.</p></section>`;
 }
 const c=state.certificates[id],z=zoneById(id);
 return `<section class="certificate"><h2>CAA Skills Quest</h2><h1>${esc(z.title)} Practice Certificate</h1><p>This recognises successful practice by</p><div class="name">${esc(state.profile.name||"Learner")}</div><p>Class: ${esc(state.profile.className||"—")} • Date earned: ${new Date(c.date).toLocaleDateString("en-NZ")}</p><h3>Skills practised</h3><p>${z.skills.map(esc).join(" • ")}</p><div class="cert-grid"><div class="cert-box"><strong>${c.successful}</strong><br>successful checks</div><div class="cert-box"><strong>${c.independent}</strong><br>original wording</div><div class="cert-box"><strong>${c.supported}</strong><br>supported successes</div></div><p>Easier wording or support was opened ${c.assists} times. Support is a learning tool and does not reduce the value of practice.</p><p><strong>This certificate is not an official grade, qualification or NCEA credit.</strong></p></section>`;
}
function progressPrintHTML(){return `<section class="test-page"><h1>CAA Skills Quest Progress Summary</h1><p><strong>Student:</strong> ${esc(state.profile.name||"Learner")} &nbsp; <strong>Class:</strong> ${esc(state.profile.className||"—")} &nbsp; <strong>Date:</strong> ${new Date().toLocaleDateString("en-NZ")}</p><p>Overall practice progress: ${overallProgress()}% • XP: ${state.xp} • Best streak: ${state.bestStreak} • Skills secured: ${securedSkills()}</p><table style="width:100%;border-collapse:collapse"><tr><th style="text-align:left;border-bottom:1px solid #333">Zone</th><th>Successful</th><th>Independent</th><th>Supported</th><th>Certificate</th></tr>${ZONES.filter(z=>state.settings.enabledZones.includes(z.id)).map(z=>{const s=getZoneStats(z.id);return`<tr><td style="border-bottom:1px solid #bbb;padding:7px">${esc(z.title)}</td><td style="text-align:center;border-bottom:1px solid #bbb">${s.correct}</td><td style="text-align:center;border-bottom:1px solid #bbb">${s.independent}</td><td style="text-align:center;border-bottom:1px solid #bbb">${s.supported}</td><td style="text-align:center;border-bottom:1px solid #bbb">${state.certificates[z.id]?"Earned":"Not yet"}</td></tr>`}).join("")}</table><p style="margin-top:20px">This is a practice summary, not an official CAA result.</p></section>`;}

function speak(text){if(!("speechSynthesis"in window)){toast("Read-aloud is unavailable in this browser.");return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g," "));u.lang="en-NZ";u.rate=.94;speechSynthesis.speak(u);}
function speakCurrent(){const q=resolveActiveQuestion(),aq=state.activeQuestion;let t=aq.easy?easyText(q.student.prompt):q.student.prompt;if(q.student.options)t+=". Options. "+displayOptions(q,aq).map((o,i)=>`${String.fromCharCode(65+i)}. ${aq.easy?easyText(o.text):o.text}`).join(". ");if(aq.easy)t+=`. Clue: ${clueFor(q)}`;speak(t);}
function readStimulus(){const q=currentView.name==="rapid"&&state.rapid?ITEM_MAP[state.rapid.queue[state.rapid.index]]:resolveActiveQuestion();if(!q)return;const s=STIMULUS_MAP[stimulusIdFor(q)];if(!s)return;speak(s.text||s.texts.map(t=>`${t.label}. ${t.text}`).join(". "));}

function resetSession(keepProfile=true){const settings={...state.settings},profile=keepProfile?{...state.profile}:{name:"",className:"",partner:""};state=defaultState();state.settings=settings;state.profile=profile;state.hasStarted=true;savedState=null;saveState(true);}
function confirmReset(kind){const msg=kind==="all"?"Delete all saved student progress, profiles and teacher settings from this browser?":"Reset the current student's progress and question history? Teacher settings will be kept.";if(confirm(msg)){if(kind==="all"){localStorage.removeItem(STORAGE_KEY);state=defaultState();savedState=null;closeModal();showScreen("start");}else{resetSession(true);closeModal();showScreen("hub");}toast("Reset complete.");}}

function submitVocab(){const run=state.vocabRun,q=run.queue[run.index];if(q.selected===null)return;const correct=q.options[q.selected]===q.correct;q.result={correct};run.results.push({term:q.term,correct});run.correct+=correct?1:0;if(!correct)run.missed.push(q.term);playSound(correct?"success":"soft");saveState();renderVocabRun();}
function speakVocabQuestion(){const run=state.vocabRun,q=run.queue[run.index];speak(`${q.prompt}. ${q.options.map((o,i)=>`${String.fromCharCode(65+i)}. ${o}`).join(". ")}${q.result?`. ${VOCAB.find(v=>v.term===q.term).definition}`:""}`);}
function submitRapid(){const r=state.rapid,q=ITEM_MAP[r.queue[r.index]],correct=r.selected===q.teacher.answer.charCodeAt(0)-65;r.result={correct};r.completed++;if(correct)r.correct++;playSound(correct?"success":"soft");saveState();renderRapid();}

function handleAction(action,el){
 playSound("click");
 if(action==="resume"){
  state.hasStarted=true;const dest=state.currentScreen&&state.currentScreen!=="start"?state.currentScreen:"hub";
  if(dest==="practice"&&state.activeQuestion)showScreen("practice",{zoneId:state.activeQuestion.zoneId});else if(dest==="subject")showScreen("subject",{area:state.selectedSubject||"Reading"});else showScreen(dest,state.currentZone?{zoneId:state.currentZone}:{});
 }
 else if(action==="new-session"){
  syncProfileFromStart();if(confirm("Start a new session? Current progress and question history will be reset.")){resetSession(true);showScreen("hub");}
 }
 else if(action==="start-guided"){if(currentView.name==="start")syncProfileFromStart();startRun("guided");}
 else if(action==="start-zones"){if(currentView.name==="start")syncProfileFromStart();showScreen("zones");}
 else if(action==="start-mixed"){if(currentView.name==="start")syncProfileFromStart();openMixedSetup(currentView.name==="subject"?state.selectedSubject:null);}
 else if(action==="start-subject-practice"){if(currentView.name==="start")syncProfileFromStart();const area=el.dataset.subject||state.selectedSubject||"Reading";state.selectedSubject=area;startRun("mixed",{target:10,subject:area});}
 else if(action==="start-rapid"){if(currentView.name==="start")syncProfileFromStart();openRapidSetup(currentView.name==="subject"?state.selectedSubject:(state.rapid?.subject||null));}
 else if(action==="vocab-practice"){if(currentView.name==="start")syncProfileFromStart();startVocabRun("practice",10);}
 else if(action==="vocab-test")openVocabTestSetup();
 else if(action==="vocab-missed"){closeModal();startVocabRun("test",Math.max(10,state.vocab.missed.length),true);}
 else if(action==="missed-skills"){if(currentView.name==="start")syncProfileFromStart();startRun("missed",{target:10});}
 else if(action==="sorter")showScreen("sorter");
 else if(action==="settings")openSettings();
 else if(action==="help")openHelp();
 else if(action==="guide")openGuide();
 else if(action==="certificates")openCertificates();
 else if(action==="close-modal")closeModal();
 else if(action==="sound"){state.settings.sound=!state.settings.sound;saveState();toast(state.settings.sound?"Sound on":"Sound muted");}
 else if(action==="fullscreen"){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
 else if(action==="toggle-easy"){
  state.activeQuestion.easy=!state.activeQuestion.easy;
  if(state.activeQuestion.easy&&!state.activeQuestion.assistanceOpened){state.activeQuestion.assistanceOpened=true;const s=getZoneStats(state.activeQuestion.zoneId);s.assists++;}
  saveState();renderPractice();
 }
 else if(action==="read-question")speakCurrent();
 else if(action==="read-stimulus")readStimulus();
 else if(action==="read-feedback"){const r=state.activeQuestion.result;speak(`${r.correct?"Correct":"Not yet"}. ${r.message}. ${r.answerText?`Best answer: ${r.answerText}`:""}`);}
 else if(action==="submit-answer")submitAnswer();
 else if(action==="reveal-self-check")revealSelfCheck();
 else if(action==="submit-writing-check")submitWritingCheck();
 else if(action==="next-question")nextQuestion();
 else if(action==="skip-question")skipQuestion();
 else if(action==="read-vocab-intro")speak("Search for a term, read its student-friendly definition, then compare its example and non-example.");
 else if(action==="submit-vocab")submitVocab();
 else if(action==="next-vocab"){state.vocabRun.index++;renderVocabRun();saveState();}
 else if(action==="speak-vocab-question")speakVocabQuestion();
 else if(action==="reset-sorter"){state.sorter=null;renderSorter();saveState();}
 else if(action==="save-settings")saveSettings();
 else if(action==="reset-current")confirmReset("current");
 else if(action==="reset-all")confirmReset("all");
 else if(action==="test-builder")openTestBuilder();
 else if(action==="generate-test")generatePaperTest();
 else if(action==="regenerate-test"){const old={...state.lastTestSettings};closeModal();openTestBuilder();setTimeout(()=>{if(old.title)document.getElementById("testTitle").value=old.title;},30);}
 else if(action==="print-student-test")printDocument(state.lastTest.settings.title,buildStudentTestHTML(state.lastTest),state.lastTest.settings.orientation);
 else if(action==="print-answer-key")printDocument(state.lastTest.settings.title+" — Answer Key",buildAnswerKeyHTML(state.lastTest),state.lastTest.settings.orientation);
 else if(action==="print-progress")printDocument("CAA Skills Quest Progress Summary",progressPrintHTML(),"portrait");
 else if(action==="read-guide"){const s=GUIDE_SLIDES[guideIndex];speak(`${s.title}. ${s.description}. Simpler explanation: ${s.simple}`);}
 else if(action==="guide-fullscreen"){const img=modal.querySelector(".guide-image");img?.requestFullscreen?.();}
 else if(action==="pause-rapid"){state.rapid.paused=!state.rapid.paused;saveState();renderRapid();}
 else if(action==="end-rapid"){state.rapid.remaining=0;renderRapid();}
 else if(action==="submit-rapid")submitRapid();
 else if(action==="next-rapid"){state.rapid.index++;state.rapid.selected=null;state.rapid.result=null;renderRapid();saveState();}
}

main.addEventListener("click",e=>{
 const nav=e.target.closest("[data-nav]");if(nav){showScreen(nav.dataset.nav);return;}
 const subject=e.target.closest("[data-subject]");if(subject&&!subject.dataset.action){if(currentView.name==="start")syncProfileFromStart();state.selectedSubject=subject.dataset.subject;showScreen("subject",{area:subject.dataset.subject});return;}
 const zone=e.target.closest("[data-zone]");if(zone){startZone(zone.dataset.zone,zone.dataset.area||null);return;}
 const actionEl=e.target.closest("[data-action]");if(actionEl){handleAction(actionEl.dataset.action,actionEl);return;}
 const opt=e.target.closest("[data-option]");if(opt&&!state.activeQuestion.result){state.activeQuestion.selected=Number(opt.dataset.option);saveState();renderPractice();return;}
 const up=e.target.closest("[data-seq-up]");if(up){const i=Number(up.dataset.seqUp),a=state.activeQuestion.sequenceOrder;[a[i-1],a[i]]=[a[i],a[i-1]];saveState();renderPractice();return;}
 const down=e.target.closest("[data-seq-down]");if(down){const i=Number(down.dataset.seqDown),a=state.activeQuestion.sequenceOrder;[a[i+1],a[i]]=[a[i],a[i+1]];saveState();renderPractice();return;}
 const vc=e.target.closest("[data-speak-vocab]");if(vc){const v=VOCAB[Number(vc.dataset.speakVocab)];speak(`${v.term}. ${v.definition}. Simpler: ${v.simple}. Example: ${v.example}. Non-example: ${v.nonExample}`);return;}
 const vo=e.target.closest("[data-vocab-option]");if(vo){const q=state.vocabRun.queue[state.vocabRun.index];if(!q.result){q.selected=Number(vo.dataset.vocabOption);renderVocabRun();saveState();}return;}
 const sc=e.target.closest("[data-sort-card]");if(sc){state.sorter.selected=Number(sc.dataset.sortCard);renderSorter();return;}
 const sb=e.target.closest("[data-sort-bin]");if(sb&&state.sorter.selected!==null){const c=state.sorter.cards[state.sorter.selected];c.placed=sb.dataset.sortBin;if(c.placed===c.area)state.sorter.correct++;else state.missedSkills[`Question recognition — ${c.area}`]=(state.missedSkills[`Question recognition — ${c.area}`]||0)+1;state.sorter.selected=null;playSound(c.placed===c.area?"success":"soft");saveState();renderSorter();return;}
 const cert=e.target.closest("[data-print-cert]");if(cert){printDocument("CAA Skills Quest Certificate",certificateHTML(cert.dataset.printCert),"landscape");return;}
 const self=e.target.closest("[data-selfmark]");if(self){closeModal();finaliseQuestion(self.dataset.selfmark==="yes",self.dataset.selfmark==="yes"?"Your response included the key evidence or reasoning.":"Use the model to identify the missing step, then try a fresh question.","");return;}
 const mix=e.target.closest("[data-mixed-count]");if(mix){const v=mix.dataset.mixedCount,choice=document.getElementById("mixedSubject")?.value||"All",subject=choice==="All"?null:choice;closeModal();startRun("mixed",{target:v==="endless"?999999:Number(v),endless:v==="endless",subject});return;}
 const vt=e.target.closest("[data-start-vocab]");if(vt){closeModal();startVocabRun("test",vt.dataset.startVocab);return;}
 const rt=e.target.closest("[data-rapid-time]");if(rt){const choice=document.getElementById("rapidSubject")?.value||"All",subject=choice==="All"?null:choice;closeModal();startRapid(Number(rt.dataset.rapidTime),subject);return;}
 const ro=e.target.closest("[data-rapid-option]");if(ro&&!state.rapid.result&&!state.rapid.paused){state.rapid.selected=Number(ro.dataset.rapidOption);renderRapid();saveState();return;}
});

modal.addEventListener("click",e=>{
 if(e.target===modal){closeModal();return;}
 const action=e.target.closest("[data-action]");if(action){handleAction(action.dataset.action,action);return;}
 const guide=e.target.closest("[data-guide]");if(guide){guideIndex=clamp(guideIndex+(guide.dataset.guide==="next"?1:-1),0,GUIDE_SLIDES.length-1);renderGuide();return;}
 const gi=e.target.closest("[data-guide-index]");if(gi){guideIndex=Number(gi.dataset.guideIndex);renderGuide();return;}
 const cert=e.target.closest("[data-print-cert]");if(cert){printDocument("CAA Skills Quest Certificate",certificateHTML(cert.dataset.printCert),"landscape");return;}
 const mix=e.target.closest("[data-mixed-count]");if(mix){const v=mix.dataset.mixedCount,choice=document.getElementById("mixedSubject")?.value||"All",subject=choice==="All"?null:choice;closeModal();startRun("mixed",{target:v==="endless"?999999:Number(v),endless:v==="endless",subject});return;}
 const vt=e.target.closest("[data-start-vocab]");if(vt){closeModal();startVocabRun("test",vt.dataset.startVocab);return;}
 const rt=e.target.closest("[data-rapid-time]");if(rt){const choice=document.getElementById("rapidSubject")?.value||"All",subject=choice==="All"?null:choice;closeModal();startRapid(Number(rt.dataset.rapidTime),subject);return;}
 const self=e.target.closest("[data-selfmark]");if(self){closeModal();finaliseQuestion(self.dataset.selfmark==="yes",self.dataset.selfmark==="yes"?"Your response included the key evidence or reasoning.":"Use the model to identify the missing step, then try a fresh question.","");return;}
});

document.getElementById("topbar").addEventListener("click",e=>{
 const nav=e.target.closest("[data-nav]");if(nav){showScreen(nav.dataset.nav);return;}
 const action=e.target.closest("[data-action]");if(action){handleAction(action.dataset.action,action);return;}
});
document.getElementById("menuToggle").addEventListener("click",()=>{const menu=document.getElementById("navMenu"),btn=document.getElementById("menuToggle"),open=!menu.classList.contains("open");menu.classList.toggle("open",open);btn.setAttribute("aria-expanded",String(open));});
document.querySelector("#navMenu").addEventListener("click",()=>{document.getElementById("navMenu").classList.remove("open");document.getElementById("menuToggle").setAttribute("aria-expanded","false");});
document.addEventListener("click",e=>{const menu=document.getElementById("navMenu"),toggle=document.getElementById("menuToggle");if(menu.classList.contains("open")&&!menu.contains(e.target)&&!toggle.contains(e.target)){menu.classList.remove("open");toggle.setAttribute("aria-expanded","false");}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const menu=document.getElementById("navMenu");if(menu.classList.contains("open")){menu.classList.remove("open");document.getElementById("menuToggle").setAttribute("aria-expanded","false");}else if(modal.open)closeModal();}});
window.addEventListener("beforeunload",()=>saveState());
updateTopbar();render();
</script>
</body>
