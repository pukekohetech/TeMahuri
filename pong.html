<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neon Power Pong</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #18213d 0%, #070814 45%, #02030a 100%);
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .game-shell {
      width: min(96vw, 980px);
      text-align: center;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow:
        0 0 8px #00f5ff,
        0 0 18px #a600ff;
    }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.08);
      color: white;
      border-radius: 999px;
      padding: 8px 13px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0,245,255,0.15);
    }

    button:hover {
      background: rgba(0,245,255,0.18);
    }

    #pongCanvas {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 900 / 560;
      border: 3px solid rgba(255,255,255,0.75);
      border-radius: 18px;
      background: #050610;
      box-shadow:
        0 0 25px rgba(0,245,255,0.35),
        0 0 60px rgba(166,0,255,0.18);
      display: block;
      margin: 0 auto;
    }

    .controls {
      margin-top: 10px;
      color: #c9d4ff;
      font-size: 14px;
      line-height: 1.5;
    }

    .powerups {
      margin-top: 6px;
      color: #96f7ff;
      font-size: 13px;
    }

    kbd {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 5px;
      padding: 2px 6px;
      color: white;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="topbar">
      <h1>NEON POWER PONG</h1>
      <div class="buttons">
        <button id="startPauseBtn">Start</button>
        <button id="restartBtn">Restart</button>
        <button id="aiBtn">AI: Off</button>
        <button id="muteBtn">Sound: On</button>
      </div>
    </div>

    <canvas id="pongCanvas" width="900" height="560"></canvas>

    <div class="controls">
      Player 1: <kbd>W</kbd> / <kbd>S</kbd>
      &nbsp; | &nbsp;
      Player 2: <kbd>↑</kbd> / <kbd>↓</kbd>
      &nbsp; | &nbsp;
      <kbd>Space</kbd> Pause/Start
      &nbsp; | &nbsp;
      <kbd>R</kbd> Restart
      &nbsp; | &nbsp;
      <kbd>A</kbd> Toggle AI
      &nbsp; | &nbsp;
      <kbd>M</kbd> Mute
    </div>

    <div class="powerups">
      Powerups: BIG paddle, SHRINK opponent, SLOW ball, MULTI ball, SHIELD, FIREBALL
    </div>
  </div>

  <script>
    const canvas = document.getElementById("pongCanvas");
    const ctx = canvas.getContext("2d");

    const startPauseBtn = document.getElementById("startPauseBtn");
    const restartBtn = document.getElementById("restartBtn");
    const aiBtn = document.getElementById("aiBtn");
    const muteBtn = document.getElementById("muteBtn");

    const W = canvas.width;
    const H = canvas.height;

    const WINNING_SCORE = 7;
    const BASE_PADDLE_HEIGHT = 96;
    const PADDLE_WIDTH = 16;
    const BALL_RADIUS = 9;

    let keys = {};
    let state = "menu";
    let aiEnabled = false;
    let soundOn = true;
    let audioCtx = null;

    let balls = [];
    let powerups = [];
    let particles = [];
    let floatingText = [];
    let stars = [];
    let screenShake = 0;
    let powerupCooldown = 180;
    let lastTime = 0;
    let frame = 0;
    let winnerText = "";

    const players = {
      left: {
        name: "Player 1",
        x: 32,
        y: H / 2 - BASE_PADDLE_HEIGHT / 2,
        w: PADDLE_WIDTH,
        h: BASE_PADDLE_HEIGHT,
        baseH: BASE_PADDLE_HEIGHT,
        speed: 8.5,
        score: 0,
        color: "#00f5ff",
        shield: false,
        effects: {
          big: 0,
          small: 0,
          fire: 0
        }
      },
      right: {
        name: "Player 2",
        x: W - 32 - PADDLE_WIDTH,
        y: H / 2 - BASE_PADDLE_HEIGHT / 2,
        w: PADDLE_WIDTH,
        h: BASE_PADDLE_HEIGHT,
        baseH: BASE_PADDLE_HEIGHT,
        speed: 8.5,
        score: 0,
        color: "#ff3df2",
        shield: false,
        effects: {
          big: 0,
          small: 0,
          fire: 0
        }
      }
    };

    const POWERUP_TYPES = [
      {
        id: "BIG",
        label: "BIG",
        color: "#00f5ff",
        description: "bigger paddle"
      },
      {
        id: "SHRINK",
        label: "MINI",
        color: "#ff3df2",
        description: "shrinks opponent"
      },
      {
        id: "SLOW",
        label: "SLOW",
        color: "#8dff6a",
        description: "slows the ball"
      },
      {
        id: "MULTI",
        label: "MULTI",
        color: "#ffe66d",
        description: "extra ball"
      },
      {
        id: "SHIELD",
        label: "SHIELD",
        color: "#6ea8ff",
        description: "blocks one goal"
      },
      {
        id: "FIRE",
        label: "FIRE",
        color: "#ff8b2b",
        description: "fireball hit"
      }
    ];

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function initStars() {
      stars = [];
      for (let i = 0; i < 90; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: rand(0.5, 1.8),
          speed: rand(0.1, 0.45),
          alpha: rand(0.25, 0.9)
        });
      }
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function beep(freq = 440, duration = 0.06, type = "sine", volume = 0.045) {
      if (!soundOn || !audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = type;
      osc.frequency.value = freq;

      gain.gain.setValueAtTime(volume, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function createBall(direction = Math.random() > 0.5 ? 1 : -1) {
      const speed = 6.4;
      return {
        x: W / 2,
        y: H / 2,
        r: BALL_RADIUS,
        vx: direction * speed,
        vy: rand(-3.2, 3.2),
        trail: [],
        owner: null,
        fire: 0,
        color: "#ffffff"
      };
    }

    function resetPlayers() {
      for (const side of ["left", "right"]) {
        const p = players[side];
        p.y = H / 2 - BASE_PADDLE_HEIGHT / 2;
        p.h = BASE_PADDLE_HEIGHT;
        p.score = 0;
        p.shield = false;
        p.effects.big = 0;
        p.effects.small = 0;
        p.effects.fire = 0;
      }
    }

    function newMatch(startNow = false) {
      resetPlayers();
      balls = [createBall(Math.random() > 0.5 ? 1 : -1)];
      powerups = [];
      particles = [];
      floatingText = [];
      screenShake = 0;
      powerupCooldown = 220;
      winnerText = "";
      state = startNow ? "playing" : "menu";
      updateButtons();
    }

    function updateButtons() {
      if (state === "playing") {
        startPauseBtn.textContent = "Pause";
      } else if (state === "paused") {
        startPauseBtn.textContent = "Resume";
      } else if (state === "gameover") {
        startPauseBtn.textContent = "New Game";
      } else {
        startPauseBtn.textContent = "Start";
      }

      aiBtn.textContent = aiEnabled ? "AI: On" : "AI: Off";
      muteBtn.textContent = soundOn ? "Sound: On" : "Sound: Off";
    }

    function startOrPause() {
      initAudio();

      if (state === "menu") {
        state = "playing";
      } else if (state === "playing") {
        state = "paused";
      } else if (state === "paused") {
        state = "playing";
      } else if (state === "gameover") {
        newMatch(true);
      }

      updateButtons();
    }

    function toggleAI() {
      aiEnabled = !aiEnabled;
      updateButtons();
      addFloatingText(W / 2, 95, aiEnabled ? "AI PLAYER 2 ON" : "AI PLAYER 2 OFF", "#ffffff");
    }

    function toggleSound() {
      initAudio();
      soundOn = !soundOn;
      updateButtons();
    }

    function addFloatingText(x, y, text, color) {
      floatingText.push({
        x,
        y,
        text,
        color,
        life: 95
      });
    }

    function burst(x, y, color, count = 18, power = 4) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = rand(0.5, power);

        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: rand(1.2, 3.5),
          color,
          life: rand(35, 70)
        });
      }
    }

    function spawnPowerup() {
      const type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];

      powerups.push({
        x: rand(170, W - 170),
        y: rand(95, H - 95),
        r: 22,
        type,
        life: 680,
        pulse: Math.random() * Math.PI * 2
      });
    }

    function activatePowerup(powerup, ownerSide) {
      const type = powerup.type.id;
      const self = players[ownerSide];
      const otherSide = ownerSide === "left" ? "right" : "left";
      const other = players[otherSide];

      if (type === "BIG") {
        self.effects.big = Math.max(self.effects.big, 560);
        addFloatingText(powerup.x, powerup.y - 25, `${self.name}: BIG PADDLE`, powerup.type.color);
      }

      if (type === "SHRINK") {
        other.effects.small = Math.max(other.effects.small, 520);
        addFloatingText(powerup.x, powerup.y - 25, `${other.name}: SHRUNK`, powerup.type.color);
      }

      if (type === "SLOW") {
        for (const b of balls) {
          b.vx *= 0.72;
          b.vy *= 0.72;
        }
        addFloatingText(powerup.x, powerup.y - 25, "BALL SLOWED", powerup.type.color);
      }

      if (type === "MULTI") {
        if (balls.length < 4) {
          const direction = ownerSide === "left" ? 1 : -1;
          const extra = createBall(direction);
          extra.x = powerup.x;
          extra.y = powerup.y;
          extra.vy = rand(-4, 4);
          extra.owner = ownerSide;
          balls.push(extra);
          addFloatingText(powerup.x, powerup.y - 25, "MULTI BALL", powerup.type.color);
        } else {
          addFloatingText(powerup.x, powerup.y - 25, "MAX BALLS", powerup.type.color);
        }
      }

      if (type === "SHIELD") {
        self.shield = true;
        addFloatingText(powerup.x, powerup.y - 25, `${self.name}: SHIELD`, powerup.type.color);
      }

      if (type === "FIRE") {
        self.effects.fire = Math.max(self.effects.fire, 600);
        addFloatingText(powerup.x, powerup.y - 25, `${self.name}: FIRE READY`, powerup.type.color);
      }

      burst(powerup.x, powerup.y, powerup.type.color, 35, 5.5);
      beep(760, 0.08, "triangle", 0.06);
    }

    function updateEffects(p, dt) {
      p.effects.big = Math.max(0, p.effects.big - dt);
      p.effects.small = Math.max(0, p.effects.small - dt);
      p.effects.fire = Math.max(0, p.effects.fire - dt);

      let targetHeight = p.baseH;

      if (p.effects.big > 0) {
        targetHeight += 52;
      }

      if (p.effects.small > 0) {
        targetHeight -= 42;
      }

      targetHeight = clamp(targetHeight, 48, 165);

      const middle = p.y + p.h / 2;
      p.h += (targetHeight - p.h) * 0.14 * dt;
      p.y = clamp(middle - p.h / 2, 0, H - p.h);
    }

    function movePaddles(dt) {
      const left = players.left;
      const right = players.right;

      if (keys["w"]) {
        left.y -= left.speed * dt;
      }

      if (keys["s"]) {
        left.y += left.speed * dt;
      }

      if (aiEnabled) {
        let targetBall = null;

        const incoming = balls
          .filter(b => b.vx > 0)
          .sort((a, b) => b.x - a.x);

        targetBall = incoming[0] || balls[0];

        if (targetBall) {
          const targetY = targetBall.y - right.h / 2;
          const difference = targetY - right.y;
          const maxMove = right.speed * 0.82 * dt;

          right.y += clamp(difference * 0.075, -maxMove, maxMove);
        }
      } else {
        if (keys["ArrowUp"]) {
          right.y -= right.speed * dt;
        }

        if (keys["ArrowDown"]) {
          right.y += right.speed * dt;
        }
      }

      left.y = clamp(left.y, 0, H - left.h);
      right.y = clamp(right.y, 0, H - right.h);
    }

    function circleRectCollision(ball, rect) {
      const closestX = clamp(ball.x, rect.x, rect.x + rect.w);
      const closestY = clamp(ball.y, rect.y, rect.y + rect.h);
      const dx = ball.x - closestX;
      const dy = ball.y - closestY;

      return dx * dx + dy * dy <= ball.r * ball.r;
    }

    function handlePaddleCollision(ball, side) {
      const paddle = players[side];

      if (!circleRectCollision(ball, paddle)) return;

      if (side === "left" && ball.vx >= 0) return;
      if (side === "right" && ball.vx <= 0) return;

      const direction = side === "left" ? 1 : -1;

      const hitPoint = (ball.y - (paddle.y + paddle.h / 2)) / (paddle.h / 2);
      const angle = clamp(hitPoint, -0.95, 0.95) * 0.95;

      let speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
      speed = clamp(speed * 1.055 + 0.1, 5.4, 14.5);

      if (paddle.effects.fire > 0) {
        ball.fire = 280;
        speed = clamp(speed * 1.25, 7.2, 16.2);
        paddle.effects.fire = Math.max(0, paddle.effects.fire - 170);
        burst(ball.x, ball.y, "#ff8b2b", 32, 5.5);
        beep(155, 0.08, "sawtooth", 0.06);
      } else {
        beep(430, 0.045, "square", 0.035);
      }

      ball.vx = Math.cos(angle) * speed * direction;
      ball.vy = Math.sin(angle) * speed;
      ball.owner = side;
      ball.color = paddle.color;

      if (side === "left") {
        ball.x = paddle.x + paddle.w + ball.r + 1;
      } else {
        ball.x = paddle.x - ball.r - 1;
      }

      burst(ball.x, ball.y, paddle.color, ball.fire > 0 ? 24 : 12, ball.fire > 0 ? 5 : 3);
      screenShake = Math.max(screenShake, ball.fire > 0 ? 8 : 3);
    }

    function scoreGoal(scoringSide) {
      const scoringPlayer = players[scoringSide];

      scoringPlayer.score += 1;

      burst(
        scoringSide === "left" ? W - 30 : 30,
        H / 2,
        scoringPlayer.color,
        45,
        7
      );

      screenShake = 13;
      beep(190, 0.18, "triangle", 0.08);

      if (scoringPlayer.score >= WINNING_SCORE) {
        winnerText = `${scoringPlayer.name} wins!`;
        state = "gameover";
        updateButtons();
      }
    }

    function updateBall(ball, dt) {
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      if (ball.fire > 0) {
        ball.fire = Math.max(0, ball.fire - dt);
      }

      ball.trail.push({
        x: ball.x,
        y: ball.y,
        color: ball.fire > 0 ? "#ff8b2b" : ball.color
      });

      if (ball.trail.length > 18) {
        ball.trail.shift();
      }

      if (ball.y - ball.r <= 0 && ball.vy < 0) {
        ball.y = ball.r;
        ball.vy *= -1;
        burst(ball.x, ball.y, "#ffffff", 8, 2.4);
        beep(260, 0.04, "sine", 0.025);
      }

      if (ball.y + ball.r >= H && ball.vy > 0) {
        ball.y = H - ball.r;
        ball.vy *= -1;
        burst(ball.x, ball.y, "#ffffff", 8, 2.4);
        beep(260, 0.04, "sine", 0.025);
      }

      handlePaddleCollision(ball, "left");
      handlePaddleCollision(ball, "right");

      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        const dx = ball.x - p.x;
        const dy = ball.y - p.y;

        if (Math.sqrt(dx * dx + dy * dy) < ball.r + p.r) {
          const owner = ball.owner || (ball.vx > 0 ? "left" : "right");
          activatePowerup(p, owner);
          powerups.splice(i, 1);
        }
      }

      if (ball.x < -ball.r) {
        if (players.left.shield) {
          players.left.shield = false;
          ball.x = 35;
          ball.vx = Math.abs(ball.vx) * 1.05;
          ball.owner = "left";
          burst(22, ball.y, players.left.color, 32, 5);
          addFloatingText(95, ball.y, "SHIELD BLOCK", players.left.color);
          beep(620, 0.12, "triangle", 0.06);
          return false;
        }

        scoreGoal("right");
        return true;
      }

      if (ball.x > W + ball.r) {
        if (players.right.shield) {
          players.right.shield = false;
          ball.x = W - 35;
          ball.vx = -Math.abs(ball.vx) * 1.05;
          ball.owner = "right";
          burst(W - 22, ball.y, players.right.color, 32, 5);
          addFloatingText(W - 95, ball.y, "SHIELD BLOCK", players.right.color);
          beep(620, 0.12, "triangle", 0.06);
          return false;
        }

        scoreGoal("left");
        return true;
      }

      return false;
    }

    function updatePowerups(dt) {
      powerupCooldown -= dt;

      if (powerupCooldown <= 0 && powerups.length < 3) {
        spawnPowerup();
        powerupCooldown = rand(420, 680);
      }

      for (let i = powerups.length - 1; i >= 0; i--) {
        powerups[i].life -= dt;

        if (powerups[i].life <= 0) {
          powerups.splice(i, 1);
        }
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.life -= dt;

        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }

      for (let i = floatingText.length - 1; i >= 0; i--) {
        const t = floatingText[i];

        t.y -= 0.35 * dt;
        t.life -= dt;

        if (t.life <= 0) {
          floatingText.splice(i, 1);
        }
      }
    }

    function updateStars(dt) {
      for (const s of stars) {
        s.x -= s.speed * dt;

        if (s.x < 0) {
          s.x = W;
          s.y = Math.random() * H;
        }
      }
    }

    function update(dt) {
      if (state !== "playing") {
        updateParticles(dt);
        updateStars(dt);
        return;
      }

      frame += dt;

      updateStars(dt);
      updateEffects(players.left, dt);
      updateEffects(players.right, dt);
      movePaddles(dt);
      updatePowerups(dt);

      let lastScoringSide = null;

      for (let i = balls.length - 1; i >= 0; i--) {
        const scored = updateBall(balls[i], dt);

        if (scored) {
          lastScoringSide = balls[i].x < W / 2 ? "right" : "left";
          balls.splice(i, 1);
        }
      }

      if (state === "playing" && balls.length === 0) {
        const direction = lastScoringSide === "left" ? 1 : -1;
        balls.push(createBall(direction));
      }

      updateParticles(dt);

      if (screenShake > 0) {
        screenShake *= 0.88;
        if (screenShake < 0.3) screenShake = 0;
      }
    }

    function roundedRectPath(x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);

      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawBackground() {
      const gradient = ctx.createRadialGradient(W / 2, H / 2, 80, W / 2, H / 2, W / 1.1);
      gradient.addColorStop(0, "#121836");
      gradient.addColorStop(0.48, "#070814");
      gradient.addColorStop(1, "#02030a");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);

      for (const s of stars) {
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      ctx.save();
      ctx.strokeStyle = "rgba(0,245,255,0.055)";
      ctx.lineWidth = 1;

      for (let x = 0; x <= W; x += 60) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }

      for (let y = 0; y <= H; y += 60) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawArena() {
      ctx.save();

      ctx.strokeStyle = "rgba(255,255,255,0.2)";
      ctx.lineWidth = 2;
      ctx.setLineDash([12, 14]);
      ctx.beginPath();
      ctx.moveTo(W / 2, 25);
      ctx.lineTo(W / 2, H - 25);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.shadowBlur = 18;
      ctx.shadowColor = "#00f5ff";
      ctx.strokeStyle = "rgba(0,245,255,0.35)";
      ctx.lineWidth = 2;
      roundedRectPath(15, 15, W - 30, H - 30, 16);
      ctx.stroke();

      ctx.shadowColor = "#ff3df2";
      ctx.strokeStyle = "rgba(255,61,242,0.22)";
      roundedRectPath(24, 24, W - 48, H - 48, 12);
      ctx.stroke();

      ctx.restore();
    }

    function drawScores() {
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.font = "bold 92px Arial";
      ctx.fillStyle = "rgba(255,255,255,0.07)";
      ctx.fillText(players.left.score, W * 0.28, 88);
      ctx.fillText(players.right.score, W * 0.72, 88);

      ctx.font = "bold 18px Arial";
      ctx.fillStyle = players.left.color;
      ctx.fillText("PLAYER 1", W * 0.28, 34);

      ctx.fillStyle = players.right.color;
      ctx.fillText(aiEnabled ? "AI / PLAYER 2" : "PLAYER 2", W * 0.72, 34);

      ctx.restore();
    }

    function drawShield(p, side) {
      if (!p.shield) return;

      ctx.save();

      ctx.globalAlpha = 0.55;
      ctx.shadowBlur = 18;
      ctx.shadowColor = p.color;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 7;

      if (side === "left") {
        ctx.beginPath();
        ctx.moveTo(18, 70);
        ctx.lineTo(18, H - 70);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(W - 18, 70);
        ctx.lineTo(W - 18, H - 70);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawPaddle(p) {
      ctx.save();

      const fireGlow = p.effects.fire > 0 ? 18 : 0;

      ctx.shadowColor = p.effects.fire > 0 ? "#ff8b2b" : p.color;
      ctx.shadowBlur = 20 + fireGlow;

      const grad = ctx.createLinearGradient(p.x, p.y, p.x + p.w, p.y + p.h);
      grad.addColorStop(0, "#ffffff");
      grad.addColorStop(0.45, p.color);
      grad.addColorStop(1, "#ffffff");

      ctx.fillStyle = grad;
      roundedRectPath(p.x, p.y, p.w, p.h, 9);
      ctx.fill();

      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(255,255,255,0.55)";
      roundedRectPath(p.x, p.y, p.w, p.h, 9);
      ctx.stroke();

      if (p.effects.fire > 0) {
        ctx.globalAlpha = 0.75;
        ctx.strokeStyle = "#ff8b2b";
        ctx.lineWidth = 3;
        roundedRectPath(p.x - 5, p.y - 5, p.w + 10, p.h + 10, 12);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawBall(ball) {
      ctx.save();

      for (let i = 0; i < ball.trail.length; i++) {
        const t = ball.trail[i];
        const alpha = i / ball.trail.length;

        ctx.globalAlpha = alpha * 0.32;
        ctx.fillStyle = ball.fire > 0 ? "#ff8b2b" : t.color;
        ctx.beginPath();
        ctx.arc(t.x, t.y, ball.r * (0.45 + alpha), 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;
      ctx.shadowBlur = ball.fire > 0 ? 28 : 18;
      ctx.shadowColor = ball.fire > 0 ? "#ff8b2b" : ball.color;

      const grad = ctx.createRadialGradient(
        ball.x - 3,
        ball.y - 3,
        2,
        ball.x,
        ball.y,
        ball.fire > 0 ? ball.r * 2.5 : ball.r * 1.7
      );

      if (ball.fire > 0) {
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(0.35, "#ffe0a3");
        grad.addColorStop(0.7, "#ff8b2b");
        grad.addColorStop(1, "#ff2a00");
      } else {
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(0.45, ball.color);
        grad.addColorStop(1, "#7c5cff");
      }

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.fire > 0 ? ball.r + 2 : ball.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawPowerups() {
      for (const p of powerups) {
        const pulse = Math.sin(frame * 0.06 + p.pulse) * 4;
        const alpha = clamp(p.life / 100, 0.35, 1);

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.shadowBlur = 24;
        ctx.shadowColor = p.type.color;

        ctx.fillStyle = "rgba(5,6,16,0.88)";
        ctx.strokeStyle = p.type.color;
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r + pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "bold 12px Arial";
        ctx.fillStyle = "#ffffff";
        ctx.fillText(p.type.label, p.x, p.y + 1);

        ctx.restore();
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = clamp(p.life / 60, 0, 1);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      for (const t of floatingText) {
        ctx.save();
        ctx.globalAlpha = clamp(t.life / 70, 0, 1);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "bold 17px Arial";
        ctx.fillStyle = t.color;
        ctx.shadowBlur = 14;
        ctx.shadowColor = t.color;
        ctx.fillText(t.text, t.x, t.y);
        ctx.restore();
      }
    }

    function drawEffectBadges() {
      ctx.save();
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.font = "bold 13px Arial";

      drawBadgesForPlayer(players.left, 35, H - 32, "left");

      ctx.textAlign = "right";
      drawBadgesForPlayer(players.right, W - 35, H - 32, "right");

      ctx.restore();
    }

    function drawBadgesForPlayer(p, x, y, side) {
      const badges = [];

      if (p.effects.big > 0) badges.push("BIG");
      if (p.effects.small > 0) badges.push("MINI");
      if (p.effects.fire > 0) badges.push("FIRE");
      if (p.shield) badges.push("SHIELD");

      if (badges.length === 0) return;

      ctx.fillStyle = p.color;
      ctx.shadowBlur = 12;
      ctx.shadowColor = p.color;

      const text = badges.join("  ");

      if (side === "left") {
        ctx.fillText(text, x, y);
      } else {
        ctx.fillText(text, x, y);
      }
    }

    function drawOverlay() {
      if (state === "playing") return;

      ctx.save();

      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(0, 0, W, H);

      ctx.shadowBlur = 30;
      ctx.shadowColor = "#00f5ff";
      ctx.fillStyle = "rgba(8,12,30,0.9)";
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.lineWidth = 2;
      roundedRectPath(W / 2 - 230, H / 2 - 120, 460, 240, 20);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      if (state === "menu") {
        ctx.font = "bold 42px Arial";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("NEON POWER PONG", W / 2, H / 2 - 50);

        ctx.font = "18px Arial";
        ctx.fillStyle = "#c9d4ff";
        ctx.fillText("Press SPACE or click Start", W / 2, H / 2 + 2);
        ctx.fillText(`First to ${WINNING_SCORE} wins`, W / 2, H / 2 + 35);
      }

      if (state === "paused") {
        ctx.font = "bold 48px Arial";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("PAUSED", W / 2, H / 2 - 35);

        ctx.font = "18px Arial";
        ctx.fillStyle = "#c9d4ff";
        ctx.fillText("Press SPACE to continue", W / 2, H / 2 + 22);
      }

      if (state === "gameover") {
        ctx.font = "bold 46px Arial";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("GAME OVER", W / 2, H / 2 - 50);

        ctx.font = "bold 24px Arial";
        ctx.fillStyle = "#96f7ff";
        ctx.fillText(winnerText, W / 2, H / 2 - 3);

        ctx.font = "18px Arial";
        ctx.fillStyle = "#c9d4ff";
        ctx.fillText("Press R or click New Game", W / 2, H / 2 + 42);
      }

      ctx.restore();
    }

    function draw() {
      drawBackground();

      ctx.save();

      if (screenShake > 0) {
        ctx.translate(rand(-screenShake, screenShake), rand(-screenShake, screenShake));
      }

      drawArena();
      drawScores();

      drawShield(players.left, "left");
      drawShield(players.right, "right");

      drawPowerups();

      drawPaddle(players.left);
      drawPaddle(players.right);

      for (const ball of balls) {
        drawBall(ball);
      }

      drawParticles();
      drawEffectBadges();

      ctx.restore();

      drawOverlay();
    }

    function gameLoop(timestamp) {
      const delta = timestamp - lastTime;
      lastTime = timestamp;

      const dt = clamp(delta / 16.67, 0, 2.2);

      update(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("keydown", function (e) {
      if (["ArrowUp", "ArrowDown", " "].includes(e.key)) {
        e.preventDefault();
      }

      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      keys[key] = true;

      if (e.repeat) return;

      initAudio();

      if (e.code === "Space") {
        startOrPause();
      }

      if (key === "r") {
        newMatch(true);
      }

      if (key === "a") {
        toggleAI();
      }

      if (key === "m") {
        toggleSound();
      }
    });

    window.addEventListener("keyup", function (e) {
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      keys[key] = false;
    });

    startPauseBtn.addEventListener("click", startOrPause);

    restartBtn.addEventListener("click", function () {
      initAudio();
      newMatch(true);
    });

    aiBtn.addEventListener("click", function () {
      initAudio();
      toggleAI();
    });

    muteBtn.addEventListener("click", toggleSound);

    initStars();
    newMatch(false);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
