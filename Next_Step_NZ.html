function freshState(){return {stage:'start',name:'',className:'',started:false,interests:[],learning:[],priorities:[],region:'franklin',move:'maybe',schoolPlan:'notSure',pathScores:{},pinnedPaths:[],savedCareers:[],savedOptions:[],readiness:{},firstChoice:'',backupChoice:'',customNext:'',todosDone:{},completedStages:[]}}
let state=loadState();
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY));return Object.assign(freshState(),s||{});}catch(e){return freshState()}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));updateChrome()}
function resetAll(){if(confirm('Start a completely new journey? This clears the saved answers on this device.')){localStorage.removeItem(STORAGE_KEY);state=freshState();render('start');toast('New journey started.')}}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.add('hidden'),2600)}
function pct(){const i=STAGES.findIndex(s=>s.id===state.stage);return Math.round(Math.max(0,i)/(STAGES.length-1)*100)}
function updateChrome(){const i=STAGES.findIndex(s=>s.id===state.stage);document.getElementById('stageLabel').textContent=STAGES[i]?.label||'Start';document.getElementById('progressLabel').textContent=pct()+'%';document.getElementById('progressFill').style.width=pct()+'%';renderTabs()}
function renderTabs(){const wrap=document.getElementById('stageTabs');wrap.innerHTML=STAGES.map((s,i)=>{const active=s.id===state.stage;const done=state.completedStages.includes(s.id);const enabled=state.started||i===0;return `<button class="stage-tab ${active?'active':''} ${done?'done':''}" ${enabled?'':'disabled'} onclick="render('${s.id}')">${s.icon} ${s.label}</button>`}).join('')}
function completeStage(id){if(!state.completedStages.includes(id))state.completedStages.push(id);save()}
function render(stage=state.stage){state.stage=stage;save();const app=document.getElementById('app');const fn={start:renderStart,discover:renderDiscover,careers:renderCareers,pathways:renderPathways,compare:renderCompare,ready:renderReady,options:renderOptions,plan:renderPlan,pack:renderPack}[stage];app.innerHTML=fn();window.scrollTo({top:0,behavior:'smooth'});bindDynamic();updateChrome()}
function goHome(){render('start')}
function showPack(){if(!state.started){toast('Start your journey first.');return}render('pack')}
function next(stage,current){if(current)completeStage(current);render(stage)}
function linkById(id){return RESOURCES.find(r=>r.id===id)}
function extLink(r,label){return `<a class="btn linkish small" href="${r.url}" target="_blank" rel="noopener">${label||'Open'} ↗</a>`}
function stageHeader(kicker,title,sub){return `<div class="section-head"><div><div class="stage-kicker">${kicker}</div><h2>${title}</h2><p>${sub}</p></div></div>`}
function layout(main,help){return `<div class="layout"><div class="main-col">${main}</div><aside class="side-col">${renderFitMini()}${renderHelpCard(help)}</aside></div>`}
function renderFitMini(){if(!state.started||state.stage==='start')return '';const scores=calculateScores();const top=Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,4);return `<div class="panel"><h3>Live pathway fit</h3><p style="font-size:11px">Updates as you answer. It is a preference match, not a prediction of success.</p>${top.map(([id,score])=>fitMini(id,score,scores)).join('')}<button class="btn ghost small wide" onclick="render('pathways')">See all pathways</button></div>`}
function fitMini(id,score,scores){const max=Math.max(...Object.values(scores),1);const val=Math.round((score/max)*100);const label=val>=80?'Strong match':val>=58?'Good fit':'Worth exploring';const cls=val>=80?'strong':val>=58?'good':'explore';return `<div class="fit-card"><div class="fit-top"><span class="fit-name">${PATHWAYS[id].emoji} ${PATHWAYS[id].label}</span><span class="fit-label ${cls}">${label}</span></div><div class="meter"><span style="width:${Math.max(12,val)}%"></span></div></div>`}
function renderHelpCard(ids=[]){const links=(ids||[]).map(linkById).filter(Boolean);return `<div class="help-card"><h3>Need help?</h3><p>Use a trusted current source rather than guessing. External links need internet access.</p><div class="help-links">${links.length?links.map(r=>`<a class="help-link" href="${r.url}" target="_blank" rel="noopener">${esc(r.title)} ↗<br><span style="font-weight:400;opacity:.82">${esc(r.why)}</span></a>`).join(''):`<button class="help-link" onclick="openHelp()">Open help & trusted links</button>`}</div></div>`}
function renderStart(){const resume=state.started;return `<section class="hero"><div style="position:relative;z-index:2"><span class="eyebrow">🧭 Aotearoa school-leaver pathway planner</span><h1>NEXT<br>STEP NZ</h1><h2>Build your route beyond school.</h2><p>Answer quick questions about what matters to you. Your journey adapts, highlights pathways that fit your choices, and finishes with a personalised pack of priorities, options, useful links and next steps.</p><div class="hero-actions"><button class="btn primary" onclick="startJourney()">${resume?'Continue my journey':'Start my journey'} →</button>${resume?`<button class="btn ghost" onclick="resetAll()">Start new</button>`:''}<button class="btn linkish" onclick="printPaperPlanner()">🖨 Paper version</button></div><div class="mini-journey">${['Discover','Explore','Shortlist','Get ready','Connect','Launch'].map((x,i)=>`<div class="journey-step"><strong>${['🧭','🔎','⭐','🧰','🔗','🚀'][i]}</strong>${x}</div>`).join('')}</div></div><div class="hero-card"><h3 style="margin-top:0">Your journey stays on this device</h3><div class="form-grid"><div class="form-field"><label for="studentName">First name / preferred name</label><input id="studentName" value="${esc(state.name)}" placeholder="Optional"></div><div class="form-field"><label for="className">Class</label><input id="className" value="${esc(state.className)}" placeholder="Optional"></div></div><div class="privacy">🔒 This planner uses local browser storage. Do not enter IRD numbers, bank numbers, passport numbers, health details or other sensitive information. External official links open separately.</div><div class="panel soft" style="margin:12px 0 0;padding:14px"><strong>What you will leave with</strong><p style="margin:6px 0 0;font-size:12px">Your strongest pathway matches • careers to investigate • saved universities/courses/employers • readiness checklist • prioritised to-dos • a backup plan • printable Next Step Pack</p></div><div class="softline"></div><div class="btn-row"><button class="btn dark" onclick="openTeacherGuide()">Teacher: how to use this</button><button class="btn ghost" onclick="openSources()">About the links</button></div></div></section><p class="footer-note">Designed as a planning tool, not a careers verdict. Requirements, vacancies, course dates and provider structures change. Links were checked against current NZ sources on ${VERIFIED}.</p>`}
function startJourney(){state.name=document.getElementById('studentName')?.value.trim()||state.name;state.className=document.getElementById('className')?.value.trim()||state.className;state.started=true;save();render(state.stage==='start'?'discover':state.stage)}
function renderDiscover(){const interestCards=INTERESTS.map(x=>choiceCard('interests',x)).join('');const learnCards=LEARNING.map(x=>choiceCard('learning',x)).join('');const pri=PRIORITIES.map(x=>`<button class="priority-card ${state.priorities.includes(x.id)?'selected':''}" onclick="toggleArray('priorities','${x.id}',5)">${x.emoji}<br>${x.label}</button>`).join('');const main=`${stageHeader('Stage 1','Discover me','Quick choices, not an essay. Try answers, change them, and see what pathways move up or down.')}<div class="panel"><div class="prompt">What sounds like you?</div><div class="subprompt">Choose as many as fit. Tap “What could this lead to?” for examples.</div><div class="choice-grid">${interestCards}</div></div><div class="panel"><div class="prompt">How do you prefer to learn?</div><div class="subprompt">Choose any that feel true.</div><div class="choice-grid">${learnCards}</div></div><div class="panel"><div class="prompt">What matters most after school?</div><div class="subprompt">Choose up to five priorities. These will appear in your final pack.</div><div class="rank-grid">${pri}</div></div><div class="panel"><div class="prompt">Where could you study or work?</div><div class="form-grid"><div class="form-field"><label>Preferred area</label><select onchange="state.region=this.value;save();render('discover')"><option value="franklin" ${sel('franklin',state.region)}>Pukekohe / Franklin / nearby</option><option value="auckland" ${sel('auckland',state.region)}>Auckland</option><option value="waikato" ${sel('waikato',state.region)}>Waikato</option><option value="bay" ${sel('bay',state.region)}>Bay of Plenty</option><option value="wellington" ${sel('wellington',state.region)}>Wellington</option><option value="canterbury" ${sel('canterbury',state.region)}>Canterbury</option><option value="otago" ${sel('otago',state.region)}>Otago</option><option value="all" ${sel('all',state.region)}>Anywhere in New Zealand</option></select></div><div class="form-field"><label>Moving away from home</label><select onchange="state.move=this.value;save()"><option value="no" ${sel('no',state.move)}>Prefer to stay near home</option><option value="maybe" ${sel('maybe',state.move)}>Maybe, for a strong option</option><option value="yes" ${sel('yes',state.move)}>Open to moving</option></select></div></div></div><div class="panel highlight"><strong>There is no “wrong” profile.</strong><p style="margin-bottom:0">“Still figuring it out” is a real pathway. The goal is to improve your next decision, not force a final career choice.</p></div><div class="btn-row"><button class="btn primary" onclick="next('careers','discover')">Explore careers →</button></div>`;return layout(main,['tahatu','interestquiz','pathfinder'])}
function sel(a,b){return a===b?'selected':''}
function choiceCard(prop,x){const selected=state[prop].includes(x.id);return `<button class="choice-card ${selected?'selected':''}" onclick="toggleArray('${prop}','${x.id}')"><span class="tick">✓</span><span class="emoji">${x.emoji}</span><strong>${x.label}</strong>${x.examples?`<small>${x.examples}</small>`:''}</button>`}
function toggleArray(prop,id,max=99){const arr=state[prop];const idx=arr.indexOf(id);if(idx>=0)arr.splice(idx,1);else{if(arr.length>=max){toast(`Choose up to ${max}. Remove one first.`);return}arr.push(id)}save();render(state.stage)}
function selectedIndustryIds(){const counts={};state.interests.forEach(id=>{const i=INTERESTS.find(x=>x.id===id);(i?.tags||[]).forEach(t=>counts[t]=(counts[t]||0)+1)});return Object.keys(counts).sort((a,b)=>counts[b]-counts[a])}
function renderCareers(){let inds=selectedIndustryIds();if(!inds.length)inds=Object.keys(INDUSTRIES);const cards=inds.map(id=>{const ind=INDUSTRIES[id];const careers=ind.careers.map(c=>{const saved=state.savedCareers.includes(c);return `<button class="btn ${saved?'green':'ghost'} small" onclick="toggleSavedCareer('${escJs(c)}')">${saved?'✓ Saved':'☆ Save'} ${esc(c)}</button>`}).join('');return `<div class="career-card"><div class="card-icon">${ind.emoji}</div><h3>${ind.label}</h3><p class="card-desc">Some roles to investigate — not a complete list.</p><div class="card-actions">${careers}</div><div class="tagrow">${ind.paths.map(p=>`<span class="tag">${PATHWAYS[p].label}</span>`).join('')}</div></div>`}).join('');const main=`${stageHeader('Stage 2','Career explorer','Career ideas are examples to investigate, not decisions being made for you. Save anything that makes you curious.')}<div class="panel navy"><h3>Based on your choices...</h3><p>${inds.length<Object.keys(INDUSTRIES).length?'These areas connect most strongly to the interests you selected.':'Choose some interests in Discover Me to make this list more personal.'}</p><div class="tagrow">${inds.slice(0,6).map(i=>`<span class="badge teal">${INDUSTRIES[i].emoji} ${INDUSTRIES[i].label}</span>`).join('')}</div></div><div class="career-grid">${cards}</div><div class="panel"><h3>Saved career ideas</h3>${state.savedCareers.length?`<div class="btn-row">${state.savedCareers.map(c=>`<span class="badge blue">${esc(c)}</span>`).join('')}</div>`:'<p>Save a few roles you want to investigate. You do not need to know the exact job yet.</p>'}</div><div class="btn-row"><button class="btn ghost" onclick="render('discover')">← Back</button><button class="btn primary" onclick="next('pathways','careers')">See my pathways →</button></div>`;return layout(main,['tahatu','pathfinder'])}
function escJs(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function toggleSavedCareer(c){const i=state.savedCareers.indexOf(c);if(i>=0)state.savedCareers.splice(i,1);else state.savedCareers.push(c);save();render('careers')}
function calculateScores(){const s={university:5,apprenticeship:5,vocational:5,employment:5,worktrain:5,nzdf:4,police:4,exploration:4};state.interests.forEach(id=>addWeights(s,INTERESTS.find(x=>x.id===id)?.weights));state.learning.forEach(id=>addWeights(s,LEARNING.find(x=>x.id===id)?.weights));state.priorities.forEach(id=>addWeights(s,PRIORITIES.find(x=>x.id===id)?.weights));if(state.savedCareers.length===0)s.exploration+=2;selectedIndustryIds().slice(0,3).forEach(ind=>INDUSTRIES[ind].paths.forEach(p=>s[p]=(s[p]||0)+1));state.pinnedPaths.forEach(p=>s[p]+=5);return s}
function addWeights(s,w={}){Object.entries(w||{}).forEach(([k,v])=>s[k]=(s[k]||0)+v)}
function reasonsFor(path){const reasons=[];state.interests.forEach(id=>{const x=INTERESTS.find(i=>i.id===id);if((x?.weights?.[path]||0)>=3)reasons.push(x.label)});state.learning.forEach(id=>{const x=LEARNING.find(i=>i.id===id);if((x?.weights?.[path]||0)>=3)reasons.push(x.label)});state.priorities.forEach(id=>{const x=PRIORITIES.find(i=>i.id===id);if((x?.weights?.[path]||0)>=3)reasons.push(x.label)});return [...new Set(reasons)].slice(0,4)}
function renderPathways(){const scores=calculateScores();const sorted=Object.keys(PATHWAYS).sort((a,b)=>scores[b]-scores[a]);const max=Math.max(...Object.values(scores),1);const cards=sorted.map((id,index)=>{const p=PATHWAYS[id],val=Math.round(scores[id]/max*100),reasons=reasonsFor(id);const pinned=state.pinnedPaths.includes(id);return `<div class="path-card ${index<3?'recommended':''}">${pinned?'<span class="saved-ribbon">PINNED</span>':''}<div class="card-icon">${p.emoji}</div><div class="path-score">${index<3?'Currently highlighted':'Explore option'} • preference fit ${val}%</div><h3>${p.label}</h3><p class="card-desc">${p.desc}</p><div class="meter"><span style="width:${Math.max(10,val)}%"></span></div><h4 style="font-size:12px;margin-bottom:6px">Why it may fit</h4><ul>${(reasons.length?reasons:p.fit.slice(0,2)).map(r=>`<li>${esc(r)}</li>`).join('')}</ul><div class="warning">${p.watch}</div><div class="card-actions"><button class="btn ${pinned?'green':'ghost'} small" onclick="togglePin('${id}')">${pinned?'✓ Keep exploring':'☆ Add to my options'}</button><button class="btn linkish small" onclick="pathDetails('${id}')">What would I do next?</button></div></div>`}).join('');const main=`${stageHeader('Stage 3','Your pathway fit','The bars show how closely each route matches what you said matters to you. They are not probabilities and do not decide your future.')}<div class="inline-note"><strong>Try another answer and see what changes.</strong> You can also pin a pathway even if it is not highly ranked — curiosity is enough reason to investigate.</div><div class="path-grid">${cards}</div><div class="btn-row" style="margin-top:16px"><button class="btn ghost" onclick="render('careers')">← Back</button><button class="btn primary" onclick="next('compare','pathways')">Compare my options →</button></div>`;return layout(main,['pathfinder','ue','wbl','nzdf','police'])}
function togglePin(id){const i=state.pinnedPaths.indexOf(id);if(i>=0)state.pinnedPaths.splice(i,1);else state.pinnedPaths.push(id);save();render('pathways')}
function pathDetails(id){const p=PATHWAYS[id];const recs=RESOURCES.filter(r=>r.paths.includes(id)).slice(0,5);openModal(`${p.emoji} ${p.label}`,`<p>${p.desc}</p><h3>Useful next moves</h3><ul>${p.fit.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="inline-note">${p.watch}</div><h3>Open a trusted starting point</h3><div class="btn-row">${recs.map(r=>extLink(r,r.title)).join('')}</div>`)}
function comparePaths(){const scores=calculateScores();let ids=[...state.pinnedPaths];Object.keys(PATHWAYS).sort((a,b)=>scores[b]-scores[a]).forEach(id=>{if(!ids.includes(id)&&ids.length<4)ids.push(id)});return ids.slice(0,4)}
function renderCompare(){const ids=comparePaths();const scores=calculateScores(),max=Math.max(...Object.values(scores));const rows=[['Learning style',id=>pathLearning(id)],['Earn while learning',id=>['apprenticeship','worktrain','nzdf','police','employment'].includes(id)?'Often / yes depending on route':'Usually study-first'],['Typical commitment',id=>pathCommitment(id)],['Entry check',id=>PATHWAYS[id].watch],['Matches your priorities',id=>reasonsFor(id).join(', ')||'Keep exploring'],['Preference fit',id=>`<span class="match-pill">${Math.round(scores[id]/max*100)}%</span>`]];const table=`<div class="compare-wrap"><table class="compare-table"><thead><tr><th>Compare</th>${ids.map(id=>`<th>${PATHWAYS[id].emoji} ${PATHWAYS[id].label}</th>`).join('')}</tr></thead><tbody>${rows.map(([name,fn])=>`<tr><td>${name}</td>${ids.map(id=>`<td>${fn(id)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;const main=`${stageHeader('Stage 4','Compare — without pretending there is one perfect route','Use the comparison to notice trade-offs. Preference fit describes your selections, not your chance of getting in or succeeding.')}<div class="panel">${table}</div><div class="panel highlight"><h3>Which ones do you actually want to keep?</h3><p>Pin or remove pathways. Keep at least one backup route if you can.</p><div class="btn-row">${ids.map(id=>`<button class="btn ${state.pinnedPaths.includes(id)?'green':'ghost'} small" onclick="toggleComparePin('${id}')">${state.pinnedPaths.includes(id)?'✓':''} ${PATHWAYS[id].label}</button>`).join('')}</div></div><div class="btn-row"><button class="btn ghost" onclick="render('pathways')">← Back</button><button class="btn primary" onclick="next('ready','compare')">Get ready →</button></div>`;return layout(main,['pathfinder','tahatu'])}
function toggleComparePin(id){togglePin(id);render('compare')}
function pathLearning(id){return {university:'Academic + independent study',apprenticeship:'Workplace + structured training',vocational:'Practical course + theory',employment:'Workplace learning',worktrain:'Work + formal/part-time learning',nzdf:'Structured training + workplace/team learning',police:'Selection + Police College / role training',exploration:'Tasters, experience, research'}[id]}
function pathCommitment(id){return {university:'Often several years; programme dependent',apprenticeship:'Several years; trade dependent',vocational:'Months to several years; staged options',employment:'Job dependent',worktrain:'Varies with qualification and employer',nzdf:'Role and service commitment dependent',police:'Recruitment process + Police College for constables',exploration:'Short, low-risk exploration steps'}[id]}
function activePaths(){const scores=calculateScores();let ids=[...state.pinnedPaths];Object.keys(PATHWAYS).sort((a,b)=>scores[b]-scores[a]).forEach(id=>{if(!ids.includes(id)&&ids.length<3)ids.push(id)});return ids.length?ids:['exploration']}
function renderReady(){const paths=activePaths();const cards=READINESS.filter(r=>r.for.some(p=>paths.includes(p))).map(r=>readyCard(r)).join('');const main=`${stageHeader('Stage 5','Get ready','Only the tasks relevant to the pathways you are exploring are shown. Mark what is already sorted so you can focus on what matters.')}<div class="panel navy"><h3>Current focus</h3><div class="btn-row">${paths.map(p=>`<span class="badge teal">${PATHWAYS[p].emoji} ${PATHWAYS[p].label}</span>`).join('')}</div></div><div class="readiness-grid">${cards}</div><div class="panel highlight"><h3>School can help with some of this</h3><p>Ask about Gateway, Trades Academy, work experience, careers support, University Entrance progress, subjects needed for courses, and people who could act as referees. You do not have to organise everything alone.</p></div><div class="btn-row"><button class="btn ghost" onclick="render('compare')">← Back</button><button class="btn primary" onclick="next('options','ready')">Find real options →</button></div>`;return layout(main,['ird','cv','licence','studylink'])}
function readyCard(r){const status=state.readiness[r.id]||'notStarted';const done=status==='ready';const links=r.links.map(linkById).filter(Boolean);return `<div class="ready-card ${done?'done':''}"><div class="ready-top"><span class="ready-icon">${done?'✅':r.emoji}</span><h3>${r.label}</h3></div><select class="status-select" onchange="setReadiness('${r.id}',this.value)"><option value="notStarted" ${sel('notStarted',status)}>Not sorted yet</option><option value="help" ${sel('help',status)}>I need help with this</option><option value="ready" ${sel('ready',status)}>Ready / already sorted</option><option value="na" ${sel('na',status)}>Not relevant to me right now</option></select><div class="microhelp">${r.help}${links.length?`<div class="card-actions">${links.map(x=>extLink(x,'Help')).join('')}</div>`:''}</div></div>`}
function setReadiness(id,val){state.readiness[id]=val;save();render('ready')}
function regionMatches(r){if(state.region==='all'||state.move==='yes')return true;return r.regions.includes('all')||r.regions.includes(state.region)||(state.region==='franklin'&&(r.regions.includes('auckland')||r.regions.includes('waikato')))}
function resourceScore(r,paths,inds){let s=0;r.paths.forEach(p=>{if(paths.includes(p))s+=4});r.industries.forEach(i=>{if(inds.includes(i))s+=3});if(regionMatches(r))s+=2;if(r.regions.includes(state.region))s+=2;return s}
function recommendedResources(){const paths=activePaths(),inds=selectedIndustryIds();return RESOURCES.filter(r=>r.paths.some(p=>paths.includes(p))||r.industries.some(i=>inds.includes(i))).map(r=>({...r,score:resourceScore(r,paths,inds)})).filter(r=>r.score>0).sort((a,b)=>b.score-a.score)}
function renderOptions(){const recs=recommendedResources();const types=[...new Set(recs.map(r=>r.type))].sort();const cards=recs.map(r=>oppCard(r)).join('');const main=`${stageHeader('Stage 6','Real options & useful links','These are starting points chosen from your pathway, interests and location preferences. Current vacancies and course details change, so each card explains why to click the source.')}<div class="panel highlight"><strong>Links checked ${VERIFIED}.</strong><p style="margin-bottom:0">The page itself works offline, but these current opportunity and help links need internet access. Always confirm entry requirements, dates and vacancies with the provider or employer.</p></div><div class="filterbar"><select id="typeFilter" onchange="filterOpps()"><option value="">All resource types</option>${types.map(t=>`<option>${esc(t)}</option>`).join('')}</select><input id="oppSearch" oninput="filterOpps()" placeholder="Search options…" aria-label="Search options"></div><div class="opportunity-grid" id="oppGrid">${cards}</div><div class="btn-row" style="margin-top:16px"><button class="btn ghost" onclick="render('ready')">← Back</button><button class="btn primary" onclick="next('plan','options')">Build my plan →</button></div>`;return layout(main,['tahatu','pathfinder','seek','trademejobs'])}
function oppCard(r){const saved=state.savedOptions.includes(r.id);return `<article class="opp-card" data-type="${esc(r.type)}" data-text="${esc((r.title+' '+r.type+' '+r.why).toLowerCase())}">${saved?'<span class="saved-ribbon">SAVED</span>':''}<div class="tag">${esc(r.type)}</div><h3>${esc(r.title)}</h3><div class="why"><strong>Why click?</strong> ${esc(r.why)}</div><div class="card-actions"><a class="btn linkish small external" href="${r.url}" target="_blank" rel="noopener">Open official/current page ↗</a><button class="btn ${saved?'green':'ghost'} small" onclick="toggleSavedOption('${r.id}')">${saved?'✓ Saved':'☆ Save'}</button></div></article>`}
function toggleSavedOption(id){const i=state.savedOptions.indexOf(id);if(i>=0)state.savedOptions.splice(i,1);else state.savedOptions.push(id);save();render('options')}
function filterOpps(){const type=document.getElementById('typeFilter').value.toLowerCase();const q=document.getElementById('oppSearch').value.toLowerCase();document.querySelectorAll('#oppGrid .opp-card').forEach(el=>{el.style.display=((!type||el.dataset.type.toLowerCase()===type)&&(!q||el.dataset.text.includes(q)))?'':'none'})}
function generateTodos(){const todos=[];const paths=activePaths();const need=(id,label,when='This week')=>{const s=state.readiness[id];if(s!=='ready'&&s!=='na')todos.push({id:'ready-'+id,label,when})};need('cv','Start or improve my CV using NZ guidance');need('refs','Ask suitable people if they can be referees');need('ird','Check whether I have an IRD number and get help if needed');need('bank','Make sure I have a bank account suitable for wages');need('email','Make my job/application email and voicemail professional');if(paths.includes('university')){need('ue','Check my University Entrance progress and programme prerequisites','This term');need('finance','Check scholarships, fees and StudyLink information','This term')};if(paths.some(p=>['apprenticeship','employment','worktrain','nzdf','police'].includes(p)))need('transport','Make a realistic transport / driver licence plan','This term');if(paths.includes('nzdf'))need('nzdfelig','Check NZDF eligibility and the exact requirements for roles I save','This term');if(paths.includes('police'))need('policeelig','Check current Police Officer eligibility and recruitment requirements','This term');if(state.savedOptions.length)todos.push({id:'saved-followup',label:`Open and compare my ${state.savedOptions.length} saved option${state.savedOptions.length>1?'s':''}`,when:'This week'});if(state.savedCareers.length)todos.push({id:'career-followup',label:`Research my saved career ideas: ${state.savedCareers.slice(0,3).join(', ')}`,when:'This term'});todos.push({id:'school-help',label:'Talk with a school careers adviser / trusted teacher about my shortlist',when:'This term'});todos.push({id:'applications',label:'Check application dates and submit the applications I choose',when:'Before leaving school'});return todos}
function renderPlan(){const paths=activePaths();const options=state.savedOptions.map(linkById).filter(Boolean);const todos=generateTodos();const choiceOpts=paths.map(p=>`<option value="${p}" ${sel(p,state.firstChoice)}>${PATHWAYS[p].label}</option>`).join('');const backupOpts=paths.map(p=>`<option value="${p}" ${sel(p,state.backupChoice)}>${PATHWAYS[p].label}</option>`).join('');const groups=['This week','This term','Before leaving school'].map(when=>`<div class="todo-box"><h3>${when}</h3>${todos.filter(t=>t.when===when).map(t=>todoItem(t)).join('')||'<p>No automatic tasks here yet.</p>'}</div>`).join('');const main=`${stageHeader('Stage 7','Build my plan','Turn exploration into a small number of actions. A backup plan is good planning, not failure.')}<div class="panel"><div class="prompt">Choose a current first route and a backup</div><div class="form-grid"><div class="form-field"><label>Current first choice</label><select onchange="state.firstChoice=this.value;save()"><option value="">Still deciding</option>${choiceOpts}</select></div><div class="form-field"><label>Backup / second route</label><select onchange="state.backupChoice=this.value;save()"><option value="">Choose later</option>${backupOpts}</select></div></div><div class="inline-note">These choices are editable. The goal is to know what to investigate next, not to lock yourself into one future.</div></div><div class="plan-grid">${groups}</div><div class="panel"><h3>Anything else I want to remember?</h3><textarea class="text-entry" placeholder="Optional — e.g. Ask about Open Day, email an employer, visit MIT TechPark…" oninput="state.customNext=this.value;save()">${esc(state.customNext)}</textarea></div><div class="panel"><h3>Saved options I want to keep</h3>${options.length?`<div class="link-list">${options.map(r=>`<a href="${r.url}" target="_blank" rel="noopener">${esc(r.title)} ↗</a>`).join('')}</div>`:'<p>No saved links yet. Return to Real Options and save universities, training providers, employers or help pages you want in your final pack.</p>'}</div><div class="btn-row"><button class="btn ghost" onclick="render('options')">← Back</button><button class="btn primary" onclick="next('pack','plan')">Build my Next Step Pack →</button></div>`;return layout(main,['pathfinder','cv','studylink'])}
function todoItem(t){const checked=!!state.todosDone[t.id];return `<div class="todo-item"><input type="checkbox" id="${t.id}" ${checked?'checked':''} onchange="state.todosDone['${t.id}']=this.checked;save()"><label for="${t.id}">${esc(t.label)}</label></div>`}
function renderPack(){const scores=calculateScores();const top=Object.keys(PATHWAYS).sort((a,b)=>scores[b]-scores[a]).slice(0,4);const todos=generateTodos();const saved=state.savedOptions.map(linkById).filter(Boolean);const ready=READINESS.filter(r=>state.readiness[r.id]==='ready');const open=READINESS.filter(r=>['notStarted','help',undefined].includes(state.readiness[r.id]));const pack=`<div class="pack-hero"><div><div class="stage-kicker" style="color:#9ff3e5">Your personalised leaving-school pack</div><h2>${state.name?esc(state.name)+"'s ":''}Next Step Pack</h2><p>Priorities • pathway matches • saved options • readiness • next actions • useful links</p></div><div class="btn-row"><button class="btn primary" onclick="printPack()">🖨 Print / Save PDF</button><button class="btn ghost" onclick="downloadPlan()">⬇ Save progress file</button></div></div><div class="pack-section"><h3>1. About me</h3><p><strong>My priorities:</strong> ${state.priorities.length?state.priorities.map(id=>PRIORITIES.find(p=>p.id===id)?.label).join(' • '):'Still choosing'}</p><p><strong>Interests:</strong> ${state.interests.length?state.interests.map(id=>INTERESTS.find(p=>p.id===id)?.label).join(' • '):'Still exploring'}</p><p><strong>Saved career ideas:</strong> ${state.savedCareers.length?state.savedCareers.join(' • '):'None saved yet'}</p><p><strong>Location preference:</strong> ${regionLabel(state.region)} • ${moveLabel(state.move)}</p></div><div class="pack-section"><h3>2. My strongest pathways</h3>${top.map(id=>`<div class="fit-card"><div class="fit-top"><strong>${PATHWAYS[id].emoji} ${PATHWAYS[id].label}</strong><span class="fit-label ${state.pinnedPaths.includes(id)?'strong':''}">${state.pinnedPaths.includes(id)?'Saved option':'Preference match'}</span></div><div class="fit-reason">Why it may fit: ${reasonsFor(id).join(', ')||PATHWAYS[id].fit.slice(0,2).join(', ')}.</div><div class="microhelp"><strong>Check:</strong> ${PATHWAYS[id].watch}</div></div>`).join('')}</div><div class="pack-section"><h3>3. Options I saved</h3>${saved.length?`<div class="link-list">${saved.map(r=>`<a href="${r.url}" target="_blank" rel="noopener">${esc(r.title)} — ${esc(r.type)} ↗</a>`).join('')}</div>`:'<p>No specific organisations saved yet. Use Real Options to add universities, courses, training or employers.</p>'}</div><div class="pack-section"><h3>4. My readiness check</h3><ul class="checklist">${ready.map(r=>`<li class="done">✓ ${r.label}</li>`).join('')}${open.slice(0,10).map(r=>`<li class="open">○ ${r.label}</li>`).join('')}</ul></div><div class="pack-section"><h3>5. My next steps</h3>${['This week','This term','Before leaving school'].map(when=>`<h4>${when}</h4><ul class="checklist">${todos.filter(t=>t.when===when).map(t=>`<li class="${state.todosDone[t.id]?'done':'open'}">${state.todosDone[t.id]?'✓':'○'} ${esc(t.label)}</li>`).join('')}</ul>`).join('')}${state.customNext?`<p><strong>My note:</strong> ${esc(state.customNext)}</p>`:''}</div><div class="pack-section"><h3>6. My current choice + backup</h3><p><strong>First route:</strong> ${state.firstChoice?PATHWAYS[state.firstChoice].label:'Still deciding'}</p><p><strong>Backup route:</strong> ${state.backupChoice?PATHWAYS[state.backupChoice].label:'Choose another reasonable option'}</p><div class="inline-note">Having another option is good planning, not failure.</div></div><div class="pack-section"><h3>7. Questions I should still answer</h3><ul>${questionsStillNeeded().map(q=>`<li>${esc(q)}</li>`).join('')}</ul></div><div class="pack-section"><h3>8. Useful links for my journey</h3><div class="link-list">${packLinks().map(r=>`<a href="${r.url}" target="_blank" rel="noopener">${esc(r.title)} — ${esc(r.why)} ↗</a>`).join('')}</div></div><div class="btn-row"><button class="btn ghost" onclick="render('plan')">← Edit my plan</button><button class="btn primary" onclick="printPack()">🖨 Print / Save PDF</button></div>`;return pack+`<p class="footer-note">This plan is based on your own selections. It does not guarantee entry, employment, scholarship eligibility or suitability for a regulated role. Verify requirements with the official provider/employer.</p>`}
function regionLabel(r){return {franklin:'Pukekohe / Franklin / nearby',auckland:'Auckland',waikato:'Waikato',bay:'Bay of Plenty',wellington:'Wellington',canterbury:'Canterbury',otago:'Otago',all:'Anywhere in NZ'}[r]||r}
function moveLabel(m){return {no:'prefer to stay near home',maybe:'open to moving for a strong option',yes:'open to moving'}[m]}
function questionsStillNeeded(){const q=[];const paths=activePaths();if(paths.includes('university'))q.push('Do my subjects and NCEA plan meet the entry requirements for the exact degree I want?','When do applications, scholarships and accommodation applications close?');if(paths.includes('apprenticeship')||paths.includes('worktrain'))q.push('Which employers and current training providers support the apprenticeship or work-based qualification I want?');if(paths.includes('nzdf'))q.push('Which NZDF roles match my interests, and what are the exact education, medical, fitness, licence and security requirements for those roles?');if(paths.includes('police'))q.push('Am I aiming for Police Officer or an employee role, and what are the current requirements for that specific route?');if(paths.some(p=>['employment','apprenticeship','worktrain'].includes(p)))q.push('Which three employers or current vacancies should I investigate first?');q.push('Who at school can help me check this plan?','What is my next action if my first option does not work out?');return q}
function packLinks(){const selected=state.savedOptions.map(linkById).filter(Boolean);const helpful=recommendedResources().filter(r=>['Career explorer','Official requirements','Application help','Study finance','Employer / training pathway','Employer / recruitment'].includes(r.type)).slice(0,6);const all=[...selected,...helpful];return all.filter((r,i,a)=>a.findIndex(x=>x.id===r.id)===i).slice(0,12)}
function renderHelp(){return ''}
function bindDynamic(){}
function openModal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">${title}</h2><button class="modal-close" onclick="closeModal()" aria-label="Close">×</button></div>${body}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function openHelp(){openModal('Help — keep the journey simple',`<h3>How to use Next Step NZ</h3><ol><li>Make quick selections about yourself.</li><li>Save careers and pathways worth investigating.</li><li>Mark life-admin tasks that are already sorted.</li><li>Open current official links only when they are useful.</li><li>Save a first route and a backup.</li><li>Print your personalised pack and use it for a conversation with whānau, a teacher, careers adviser or employer.</li></ol><h3>If you are stuck</h3><p>Choose “Still figuring it out”, use Tahatū’s Interest Quiz or Path Finder, or ask for work experience / Gateway / Trades Academy information at school.</p><div class="btn-row">${extLink(linkById('tahatu'),'Tahatū')}${extLink(linkById('pathfinder'),'Path Finder')}</div><h3>Privacy</h3><p>The planner saves choices locally in this browser. Never type actual IRD, bank, passport, licence or medical numbers into it.</p>`)}
function openTeacherGuide(){openModal('Teacher guide — a short facilitated pathway conversation',`<p><strong>Purpose:</strong> help a student turn “I don’t know” into a manageable shortlist and a small number of next actions. It is not a career aptitude test.</p><h3>A simple 30–45 minute use</h3><ol><li><strong>5–10 min — Discover:</strong> student selects interests, learning preferences and priorities. Ask “Why did you choose that?” only when useful.</li><li><strong>5 min — Career Explorer:</strong> save 2–5 roles that create curiosity. They do not need to commit.</li><li><strong>5 min — Pathway Fit:</strong> explain that the percentage is a match to their selections, not probability of success.</li><li><strong>5–10 min — Get Ready:</strong> mark what is already sorted and identify only the missing admin that matters to their routes.</li><li><strong>5–10 min — Real Options:</strong> open one or two current official links together. Save useful providers/employers.</li><li><strong>Finish — Pack:</strong> print/save the pack and agree on the next 1–3 actions.</li></ol><h3>Useful prompts</h3><ul><li>“Which option are you curious enough to investigate?”</li><li>“What matters most to you — earning, location, practical work, a degree, service, something else?”</li><li>“What is one step you can do this week?”</li><li>“What could be a sensible backup?”</li></ul><h3>Anxiety reduction</h3><p>Normalise uncertainty. Students may change answers at any time. Avoid presenting the highlighted pathway as “the answer”. Focus on evidence, current entry requirements and achievable next actions.</p>`)}
function openSources(){openModal('About the links and current information',`<p>External links were selected from current New Zealand government, education-provider, employer and recognised career/training sites and checked on <strong>${VERIFIED}</strong>.</p><ul><li>Tahatū is the national career navigator and currently includes 800+ career ideas and 4,000+ qualifications/courses.</li><li>NZ’s vocational system changed in 2026. This planner links to the Tertiary Education Commission’s current provider/work-based-learning information instead of assuming old ITO structures remain unchanged.</li><li>NZTA has announced changes to the car driver-licensing system from 25 January 2027, so students are directed to NZTA rather than being taught a soon-to-change process.</li><li>NZDF and NZ Police requirements are summarised cautiously and always linked to their official recruitment pages.</li></ul><p>Course dates, vacancies and detailed entry requirements can change after this file is created. The official linked page should win.</p>`)}
function printPack(){const html=printPackHTML();openPrintWindow('Next Step Pack',html)}
function printPackHTML(){const scores=calculateScores();const top=Object.keys(PATHWAYS).sort((a,b)=>scores[b]-scores[a]).slice(0,4);const saved=state.savedOptions.map(linkById).filter(Boolean);const todos=generateTodos();return `<header><h1>${esc(state.name?state.name+"'s ":'')}Next Step Pack</h1><p>${esc(state.className||'')} • Generated ${new Date().toLocaleDateString('en-NZ')}</p></header><section><h2>My priorities</h2><p>${state.priorities.map(id=>esc(PRIORITIES.find(p=>p.id===id)?.label)).join(' • ')||'Still choosing'}</p><h2>My interests</h2><p>${state.interests.map(id=>esc(INTERESTS.find(p=>p.id===id)?.label)).join(' • ')||'Still exploring'}</p><h2>Career ideas I saved</h2><p>${state.savedCareers.map(esc).join(' • ')||'None saved yet'}</p></section><section><h2>My strongest pathway matches</h2>${top.map(id=>`<div class="box"><strong>${PATHWAYS[id].label}</strong><br><span>${esc(reasonsFor(id).join(', ')||PATHWAYS[id].fit.slice(0,2).join(', '))}</span><p class="small"><strong>Check:</strong> ${esc(PATHWAYS[id].watch)}</p></div>`).join('')}</section><section><h2>Options I saved</h2>${saved.length?saved.map(r=>`<p><strong>${esc(r.title)}</strong><br><a href="${r.url}">${r.url}</a><br><span class="small">${esc(r.why)}</span></p>`).join(''):'<p>No specific providers/employers saved yet.</p>'}</section><section><h2>Readiness</h2><div class="cols">${READINESS.filter(r=>state.readiness[r.id]).map(r=>`<div>${state.readiness[r.id]==='ready'?'✓':'☐'} ${esc(r.label)} — ${esc(statusLabel(state.readiness[r.id]))}</div>`).join('')}</div></section><section><h2>My next steps</h2>${['This week','This term','Before leaving school'].map(when=>`<h3>${when}</h3>${todos.filter(t=>t.when===when).map(t=>`<div>☐ ${esc(t.label)}</div>`).join('')}`).join('')}${state.customNext?`<p><strong>My note:</strong> ${esc(state.customNext)}</p>`:''}</section><section><h2>First route + backup</h2><p><strong>First route:</strong> ${state.firstChoice?PATHWAYS[state.firstChoice].label:'Still deciding'}<br><strong>Backup:</strong> ${state.backupChoice?PATHWAYS[state.backupChoice].label:'Choose another reasonable option'}</p><p class="small">Having another option is good planning, not failure.</p></section><section><h2>Questions to answer next</h2><ul>${questionsStillNeeded().map(q=>`<li>${esc(q)}</li>`).join('')}</ul></section><footer>This pack is a planning aid, not a guarantee of admission, employment, eligibility or suitability. Verify current requirements with the official provider/employer. External links checked ${VERIFIED}.</footer>`}
function statusLabel(s){return {ready:'ready / sorted',help:'need help',notStarted:'not sorted yet',na:'not relevant right now'}[s]||s}
function openPrintWindow(title,body){const w=window.open('','_blank');if(!w){toast('The print window was blocked. Allow pop-ups, then try again.');return}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>@page{size:A4 portrait;margin:12mm}body{font-family:Arial,sans-serif;color:#142b35;font-size:10pt;line-height:1.35}header{border-bottom:4px solid #0a6f74;padding-bottom:8px;margin-bottom:10px}h1{font-size:24pt;margin:0}h2{font-size:14pt;color:#083c55;margin:15px 0 6px;border-bottom:1px solid #d7e3e7;padding-bottom:3px}h3{font-size:11pt;margin:10px 0 4px}.box{border:1px solid #bfcfd5;border-radius:8px;padding:7px;margin:6px 0;break-inside:avoid}.small{font-size:8.5pt;color:#526970}.cols{columns:2;column-gap:18px}.cols div{break-inside:avoid;margin-bottom:4px}a{color:#075d91;word-break:break-all}section{break-inside:auto}li{margin-bottom:3px}footer{margin-top:18px;border-top:1px solid #ccd9de;padding-top:6px;font-size:8pt;color:#657981}.actions{position:fixed;right:10px;top:10px}@media print{.actions{display:none}}</style></head><body><div class="actions"><button onclick="window.print()">Print / Save PDF</button> <button onclick="window.close()">Close</button></div>${body}<script>window.addEventListener('load',()=>setTimeout(()=>window.print(),200));<\/script></body></html>`);w.document.close()}
function printPaperPlanner(){const body=`<header><h1>Next Step NZ — Paper Pathway Planner</h1><p>Name: ______________________________ Class: ______________ Date: ______________</p></header><section><h2>1. What sounds like me?</h2><div class="cols">${INTERESTS.filter(x=>x.id!=='unsure').map(x=>`<div>☐ ${esc(x.label)}</div>`).join('')}</div><p>☐ I am still figuring it out</p></section><section><h2>2. How I like to learn</h2><div class="cols">${LEARNING.map(x=>`<div>☐ ${esc(x.label)}</div>`).join('')}</div></section><section><h2>3. My top five priorities</h2><div class="cols">${PRIORITIES.map(x=>`<div>☐ ${esc(x.label)}</div>`).join('')}</div></section><section><h2>4. Pathways to investigate</h2><div class="cols">${Object.values(PATHWAYS).map(p=>`<div>☐ ${esc(p.label)}</div>`).join('')}</div><p>Why these? ____________________________________________________________________________</p></section><section><h2>5. Readiness</h2><div class="cols">${READINESS.slice(0,9).map(r=>`<div>☐ Ready &nbsp; ☐ Need help — ${esc(r.label)}</div>`).join('')}</div></section><section><h2>6. My next three actions</h2><p>1. ____________________________________________________________________________________</p><p>2. ____________________________________________________________________________________</p><p>3. ____________________________________________________________________________________</p></section><section><h2>7. My first route + backup</h2><p>First route: ___________________________________ Backup: ___________________________________</p><p>Who can help me check this plan? ________________________________________________________</p></section><footer>Use the digital Next Step NZ resource for current links to career information, providers, employers, NZDF, NZ Police, IRD, banking, StudyLink, CV help and more.</footer>`;openPrintWindow('Next Step NZ Paper Planner',body)}
function downloadPlan(){const safe={...state,notice:'This file contains planning choices only. It should not contain IRD, bank, passport, health or other sensitive numbers.'};const blob=new Blob([JSON.stringify(safe,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Next-Step-NZ-plan.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render(state.stage||'start');
</script>
